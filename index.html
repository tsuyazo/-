<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミス台帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C4A63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ミス台帳">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --paper:#E7EDE2; --card:#FAFBF6; --rule:#C2D0B8; --ruleSoft:#DCE5D5;
  --ink:#1E2A33; --inkSoft:#5C6B72; --ai:#2C4A63; --aiSoft:#E2E9EF;
  --shu:#C0392B; --shuSoft:#F3DDD9; --och:#9A6B2F; --ochSoft:#EFE6D5;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{padding:calc(26px + env(safe-area-inset-top)) 20px 16px;border-bottom:2px solid var(--ai);background:var(--card)}
.eyebrow{font-size:10px;letter-spacing:.3em;color:var(--inkSoft);margin-bottom:6px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between}
h1{font-family:var(--mincho);font-size:28px;margin:0;letter-spacing:.06em;font-weight:600}
.count{font-family:var(--num);font-size:12px;color:var(--inkSoft)}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:5}
nav button{flex:1;padding:13px 2px;font-size:14px;border:none;background:none;font-family:var(--mincho);
  font-size:15px;color:var(--inkSoft);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ai);border-bottom-color:var(--ai)}
main{padding:22px 20px;max-width:620px;margin:0 auto}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--inkSoft);margin-bottom:7px}
.lbl span{letter-spacing:0;margin-left:8px;color:var(--rule)}
.f{margin-bottom:18px}
input[type=text],input[type=date]{width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
  background:none;border:none;border-bottom:1px solid var(--rule);padding:8px 2px;outline:none;border-radius:0}
input::placeholder{color:var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;padding:9px 12px;border-radius:2px;border:1px solid var(--rule);
  background:none;color:var(--inkSoft);font-family:var(--sans)}
.chip.on{border-color:var(--ai);background:var(--aiSoft);color:var(--ai);font-weight:700}
.chip.shu.on{border-color:var(--shu);background:var(--shuSoft);color:var(--shu)}
.link{background:none;border:none;color:var(--ai);font-size:13px;text-decoration:underline;padding:4px 0;font-family:var(--sans)}
#more{border-top:1px dashed var(--rule);padding-top:18px;margin-top:4px}
.save{margin-top:26px;width:100%;padding:15px 0;border:none;border-radius:2px;background:var(--ai);
  color:#fff;font-family:var(--mincho);font-size:16px;letter-spacing:.1em}
.save:disabled{background:var(--ruleSoft);color:var(--rule)}
.note{font-size:11px;color:var(--inkSoft);margin-top:10px;line-height:1.7}
.book{background:var(--card);border:1px solid var(--rule)}
.row{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--ruleSoft)}
.row:last-child{border-bottom:none}
.no{font-family:var(--num);font-size:10px;color:var(--rule);padding-top:3px;width:26px;flex-shrink:0}
.no.re{color:var(--shu)}
.what{font-size:14px;line-height:1.6;margin-bottom:5px}
.meta{font-size:11px;color:var(--inkSoft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta .self{color:var(--ai);font-weight:700}
.meta .other{color:var(--shu);font-weight:700}
.deep{margin-top:8px;padding-left:10px;border-left:2px solid var(--ruleSoft);
  font-size:12px;color:var(--inkSoft);line-height:1.7}
.deep .fix{color:var(--ai)}
.deep .why{color:var(--shu)}
.acts{display:flex;gap:14px;margin-top:8px}
.acts button{background:none;border:none;padding:0;font-size:11px;color:var(--rule);font-family:var(--sans)}
.acts button.on{color:var(--shu)}
.sev{display:flex;flex-direction:column;gap:6px}
.sevbtn{display:flex;align-items:baseline;gap:10px;text-align:left;padding:10px 12px;
  border:1px solid var(--rule);border-radius:2px;background:none;font-family:var(--sans);width:100%}
.sevbtn b{font-family:var(--mincho);font-size:15px;color:var(--inkSoft);flex-shrink:0}
.sevbtn i{font-style:normal;font-size:11px;color:var(--inkSoft);line-height:1.5}
.sevbtn.on{border-color:var(--ai);background:var(--aiSoft)}
.sevbtn.on b,.sevbtn.on i{color:var(--ai)}
.sevbtn.s3.on{border-color:var(--och);background:var(--ochSoft)}
.sevbtn.s3.on b,.sevbtn.s3.on i{color:var(--och)}
.sevbtn.s4.on{border-color:var(--shu);background:var(--shuSoft)}
.sevbtn.s4.on b,.sevbtn.s4.on i{color:var(--shu)}
.badge{font-family:var(--mincho);font-weight:700}
.badge.s1{color:var(--inkSoft)}.badge.s2{color:var(--ai)}
.badge.s3{color:var(--och)}.badge.s4{color:var(--shu)}
.sortbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.sortbar .cap{font-size:11px;letter-spacing:.14em;color:var(--inkSoft);margin-right:2px}
.chip.mini{font-size:11px;padding:5px 9px}
.ghost{margin-top:18px;width:100%;padding:12px 0;background:none;border:1px solid var(--rule);
  border-radius:2px;color:var(--ai);font-size:13px;font-family:var(--sans)}
.empty{color:var(--inkSoft);font-size:14px;line-height:1.9;padding-top:10px}
.kenin{display:flex;align-items:center;gap:18px}
.stamp{width:92px;height:92px;border-radius:50%;border:2.5px solid var(--shu);display:flex;
  flex-direction:column;align-items:center;justify-content:center;color:var(--shu);flex-shrink:0}
.stamp.off{border-color:var(--rule);color:var(--rule);opacity:.6}
.stamp .cap{font-family:var(--mincho);font-size:11px;letter-spacing:.1em}
.stamp .big{font-family:var(--num);font-size:27px;font-weight:700;line-height:1.1}
.stamp .pc{font-family:var(--num);font-size:10px}
.kenin p{font-size:13px;color:var(--inkSoft);line-height:1.7;margin:0}
.nums{display:flex;gap:26px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.nums .cap{font-size:11px;color:var(--inkSoft);margin-bottom:3px}
.nums .v{font-family:var(--num);font-size:20px}
.panel{margin-top:26px;background:var(--card);border:1px solid var(--rule);padding:16px 16px 14px}
.panel h2{font-family:var(--mincho);font-size:15px;margin:0 0 10px;font-weight:600}
.panel ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--inkSoft);line-height:1.8}
.tally{margin-top:30px}
.tally h2{font-family:var(--mincho);font-size:15px;font-weight:600;margin:0 0 12px;
  border-bottom:1px solid var(--rule);padding-bottom:6px}
.bar{margin-bottom:10px}
.bar .t{display:flex;justify-content:space-between;font-size:13px;color:var(--inkSoft);margin-bottom:4px}
.bar.top .t{color:var(--ink);font-weight:700}
.bar .t b{font-family:var(--num);font-weight:inherit}
.track{height:6px;background:var(--ruleSoft)}
.track i{display:block;height:100%;background:var(--rule)}
.bar.top .track i{background:var(--ai)}
.modal{position:fixed;inset:0;background:rgba(30,42,51,.55);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:20}
.modal .box{background:var(--card);padding:16px;width:100%;max-width:560px}
.modal h2{font-family:var(--mincho);font-size:15px;margin:0 0 8px;font-weight:600}
textarea{width:100%;height:200px;font-family:var(--num);font-size:11px;border:1px solid var(--rule);
  padding:8px;background:#fff;color:var(--ink)}
.modal .close{margin-top:10px;width:100%;padding:11px 0;border:none;background:var(--ai);color:#fff;font-size:14px}
#toast{position:fixed;left:0;right:0;bottom:26px;display:flex;justify-content:center;pointer-events:none}
#report{height:260px;font-size:11px;line-height:1.6}
.linkbtn{display:block;text-align:center;text-decoration:none;padding:12px 0;margin-top:10px;
  border:1px solid var(--rule);border-radius:2px;color:var(--ai);font-size:13px}
#toast div{background:var(--ai);color:#fff;font-size:13px;padding:10px 16px;border-radius:2px;
  pointer-events:auto;display:flex;align-items:center;gap:14px}
#toast button{background:none;border:none;color:#fff;font-size:13px;font-weight:700;
  text-decoration:underline;font-family:var(--sans);padding:0}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){#toast div{animation:up .2s ease}}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
</style>
</head>
<body>
<header>
  <div class="eyebrow">ERROR LEDGER</div>
  <div class="titlerow"><h1>ミス台帳</h1><div class="count" id="count">000 件</div></div>
</header>
<nav>
  <button data-tab="write" class="on">記録</button>
  <button data-tab="book">台帳</button>
  <button data-tab="view">傾向</button>
  <button data-tab="report">レポート</button>
</nav>
<main id="main"></main>
<div id="toast" class="hide"></div>

<script>
const KINDS=["転記・入力","指示の抜け漏れ","期限・スケジュール","確認不足","認識違い","知識不足","紛失・所在不明"];
const STAGES=["指示を受けた時","作業中","見直し時","提出後"];
const DETECTORS=["自分","先輩・上司","顧客・外部"];
const SEV=[
  ["Lv1","自分の時間を少し使った（15分ほどで直せた）"],
  ["Lv2","自分の時間を多く使った。または社内の人の時間を少し使わせた（その場の指摘で済んだ）"],
  ["Lv3","社内の人の時間を多く使わせた（手を動かさせた・別途時間を取らせた）。または関与先の時間を少し使わせた"],
  ["Lv4","関与先の時間を多く使わせた"]
];
const KEY="misslog:v1";

let entries=[],trash=[];
(function(){try{
  const raw=JSON.parse(localStorage.getItem(KEY)||"null");
  if(Array.isArray(raw)){entries=raw}
  else if(raw&&typeof raw==="object"){entries=raw.entries||[];trash=raw.trash||[]}
}catch(e){}})();
const save=()=>{try{
  const prev=localStorage.getItem(KEY);
  if(prev)localStorage.setItem(KEY+":bak",prev);
  localStorage.setItem(KEY,JSON.stringify({v:2,entries,trash}));
}catch(e){alert("保存できませんでした。端末の空き容量を確認してください。")}};
const newId=()=>{let id;do{id=Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  while(entries.some(e=>e.id===id)||trash.some(e=>e.id===id));return id};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="write";
const blankForm=()=>({date:today(),client:"",what:"",kind:"",stage:"",detector:"",sev:"",loss:false,cause:"",why:"",fix:"",repeat:false});
let form=blankForm();
let editing=null;
let more=false;
let showTrash=false;
let sortKey="date",sortDir=-1;
let period="week";

function toast(m,undoId){const t=document.getElementById("toast");
  t.innerHTML='<div>'+esc(m)+(undoId?' <button data-act="undo" data-id="'+undoId+'">元に戻す</button>':"")+'</div>';
  t.classList.remove("hide");clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.add("hide"),undoId?6000:2200)}

function stats(){
  const n=entries.length,self=entries.filter(e=>e.detector==="自分").length;
  const rec=entries.filter(e=>{const d=new Date(e.date);return !isNaN(d)&&Date.now()-d.getTime()<90*864e5});
  const rs=rec.filter(e=>e.detector==="自分").length;
  return{n,rate:n?self/n:0,recN:rec.length,recRate:rec.length?rs/rec.length:0,
    rep:entries.filter(e=>e.repeat).length,
    kinds:KINDS.map(k=>({label:k,n:entries.filter(e=>e.kind===k).length})),
    stages:STAGES.map(s=>({label:s,n:entries.filter(e=>e.stage===s).length})),
    sevs:SEV.map(([k])=>({label:k,n:entries.filter(e=>e.sev===k).length})),
    heavy:entries.filter(e=>e.sev==="Lv4").length,
    loss:entries.filter(e=>e.loss).length};
}

function chips(list,sel,act,shu){
  return '<div class="chips">'+list.map(v=>
    '<button class="chip'+(shu&&v!=="自分"?" shu":"")+(sel===v?" on":"")+'" data-act="'+act+'" data-v="'+esc(v)+'">'+esc(v)+'</button>'
  ).join("")+'</div>';
}

function viewWrite(){
  return `
  <div class="f"><div class="lbl">何が起きた<span>事実だけ・1行</span></div>
    <input type="text" id="what" value="${esc(form.what)}" placeholder="源泉の税額を前期の数字のまま入力した"></div>
  <div class="f"><div class="lbl">種類</div>${chips(KINDS,form.kind,"kind")}</div>
  <div class="f"><div class="lbl">誰が気づいた</div>${chips(DETECTORS,form.detector,"detector",true)}</div>
  <div class="f"><div class="lbl">重大度<span>誰の時間をどれだけ使わせたか</span></div>
    <div class="sev">${SEV.map(([k,d],i)=>
      `<button class="sevbtn s${i+1}${form.sev===k?" on":""}" data-act="sev" data-v="${esc(k)}"><b>${esc(k)}</b><i>${esc(d)}</i></button>`
    ).join("")}</div>
    <div style="margin-top:8px"><button class="chip shu${form.loss?" on":""}" data-act="loss">実損が発生した</button></div></div>
  ${more?`<div id="more">
    <div class="f"><div class="lbl">発生工程</div>${chips(STAGES,form.stage,"stage")}</div>
    <div class="f"><div class="lbl">原因<span>なぜを1回だけ</span></div>
      <input type="text" id="cause" value="${esc(form.cause)}" placeholder="前期資料を見ながら手で打ち直した"></div>
    <div class="f"><div class="lbl">なぜまずいか<span>誰にどんな不利益が出るか</span></div>
      <input type="text" id="why" value="${esc(form.why)}" placeholder="納付額が過少になり、加算税が関与先の負担になる"></div>
    <div class="f"><div class="lbl">次の防ぎ方<span>動作で書く</span></div>
      <input type="text" id="fix" value="${esc(form.fix)}" placeholder="前期比較を並べて印刷し、翌朝に見る"></div>
    <div class="f" style="display:flex;gap:14px">
      <input type="date" id="date" value="${esc(form.date)}">
      <input type="text" id="client" value="${esc(form.client)}" placeholder="案件（記号で）"></div>
    <button class="chip shu${form.repeat?" on":""}" data-act="repeat">同じ型の再発</button>
  </div>`:`<button class="link" data-act="more">原因・なぜまずいか・防ぎ方を書く</button>`}
  <button class="save" id="save" ${form.what.trim()&&form.kind&&form.detector&&form.sev?"":"disabled"}>${editing?"更新する":"記入する"}</button>
  ${editing?`<button class="link" data-act="cancel" style="display:block;margin-top:12px">編集をやめる</button>`
    :`<div class="note">上の4つだけで記入できます。原因や防ぎ方は、あとから台帳の「編集」で足せます。</div>`}`;
}

const SORTS=[["date","日付"],["sev","重大度"],["kind","種類"],["stage","工程"],["detector","発見者"],["client","案件"],["repeat","再発"]];
function sortVal(e,k){
  if(k==="sev")return SEV.findIndex(v=>v[0]===e.sev);
  if(k==="kind")return KINDS.indexOf(e.kind);
  if(k==="stage")return STAGES.indexOf(e.stage);
  if(k==="detector")return DETECTORS.indexOf(e.detector);
  if(k==="repeat")return e.repeat?1:0;
  return e[k]||"";
}
function sortedEntries(){
  return [...entries].sort((x,y)=>{
    const a=sortVal(x,sortKey),b=sortVal(y,sortKey);
    if(a<b)return -sortDir;
    if(a>b)return sortDir;
    return x.date<y.date?1:x.date>y.date?-1:0;
  });
}
function sortBar(){
  return `<div class="sortbar"><span class="cap">並び替え</span>`+SORTS.map(([k,l])=>
    `<button class="chip mini${sortKey===k?" on":""}" data-act="sort" data-k="${k}">${l}${sortKey===k?(sortDir===-1?" ↓":" ↑"):""}</button>`
  ).join("")+`</div>`;
}

function trashSection(){
  if(!trash.length)return "";
  let h=`<button class="ghost" data-act="trash">削除した記録（${trash.length}）${showTrash?"を閉じる":"を見る"}</button>`;
  if(showTrash){
    h+=`<div class="book" style="margin-top:10px">`+trash.map(e=>`
      <div class="row">
        <div class="no">—</div>
        <div style="flex:1;min-width:0">
          <div class="what" style="color:var(--inkSoft)">${esc(e.what)}</div>
          <div class="meta"><span style="font-family:var(--num)">${esc(e.date)}</span><span>${esc(e.kind)}</span></div>
          <div class="acts">
            <button data-act="restore" data-id="${e.id}" style="color:var(--ai)">戻す</button>
            <button data-act="purge" data-id="${e.id}">完全に削除</button>
          </div>
        </div>
      </div>`).join("")+`</div>
      <div class="note">ここに残っているものは、いつでも台帳に戻せます。</div>`;
  }
  return h;
}

function viewBook(){
  if(!entries.length)return `<div class="empty">まだ1件もありません。<br>次に何か起きたら、その場で「記録」に1行だけ入れてください。</div>
    <button class="ghost" data-act="import">控えから読み込む</button>`+trashSection();
  const num={};entries.forEach((e,i)=>num[e.id]=entries.length-i);
  const rows=sortedEntries().map(e=>`
    <div class="row">
      <div class="no${e.repeat?" re":""}">${String(num[e.id]).padStart(3,"0")}</div>
      <div style="flex:1;min-width:0">
        <div class="what">${esc(e.what)}</div>
        <div class="meta"><span style="font-family:var(--num)">${esc(e.date)}</span>
          ${e.client?"<span>"+esc(e.client)+"</span>":""}
          ${e.sev?`<span class="badge s${SEV.findIndex(v=>v[0]===e.sev)+1}">${esc(e.sev)}</span>`:""}
          ${e.loss?`<span class="badge s4">実損</span>`:""}
          <span>${esc(e.kind)}</span>${e.stage?"<span>"+esc(e.stage)+"</span>":""}
          <span class="${e.detector==="自分"?"self":"other"}">${esc(e.detector)}が発見</span></div>
        ${e.cause||e.why||e.fix?`<div class="deep">${e.cause?"<div>因 — "+esc(e.cause)+"</div>":""}${e.why?'<div class="why">害 — '+esc(e.why)+"</div>":""}${e.fix?'<div class="fix">次 — '+esc(e.fix)+"</div>":""}</div>`:""}
        <div class="acts">
          <button data-act="edit" data-id="${e.id}" style="color:var(--ai)">編集</button>
          <button data-act="rep" data-id="${e.id}" class="${e.repeat?"on":""}">${e.repeat?"● 再発":"○ 再発にする"}</button>
          <button data-act="del" data-id="${e.id}">削除</button>
        </div>
      </div>
    </div>`).join("");
  return sortBar()+`<div class="book">${rows}</div>
    <button class="ghost" data-act="export">スプレッドシートに貼る形で出す</button>
    <button class="ghost" data-act="import">控えから読み込む</button>
    ${trashSection()}`;
}

function bar(d,max,top){
  return `<div class="bar${top?" top":""}"><div class="t"><span>${esc(d.label)}</span><b>${d.n}</b></div>
    <div class="track"><i style="width:${(d.n/max)*100}%"></i></div></div>`;
}
function tally(title,data){
  const shown=data.filter(d=>d.n>0).sort((a,b)=>b.n-a.n);
  if(!shown.length)return "";
  const max=Math.max(1,...shown.map(d=>d.n));
  return `<div class="tally"><h2>${title}</h2>${shown.map((d,i)=>bar(d,max,i<2)).join("")}</div>`;
}

function viewStats(){
  const s=stats(),empty=s.n===0;
  const top2=[...s.kinds].sort((a,b)=>b.n-a.n).filter(d=>d.n>0).slice(0,2);
  let html=`<div class="kenin">
    <div class="stamp${empty?" off":""}"><div class="cap">自己検知</div>
      <div class="big">${empty?"—":Math.round(s.rate*100)}</div><div class="pc">${empty?"":"%"}</div></div>
    <p>${empty?"記録が入るとここに出ます。":"提出前に自分で見つけた割合。件数ではなく、この比率が上がっているかだけを見ます。"}</p></div>`;
  if(!empty){
    html+=`<div class="nums">
      <div><div class="cap">直近90日</div><div class="v">${s.recN?Math.round(s.recRate*100)+"%":"—"}</div></div>
      <div><div class="cap">Lv4</div><div class="v" style="color:${s.heavy?"var(--och)":"inherit"}">${s.heavy}</div></div>
      <div><div class="cap">実損</div><div class="v" style="color:${s.loss?"var(--shu)":"inherit"}">${s.loss}</div></div>
      <div><div class="cap">再発</div><div class="v" style="color:${s.rep?"var(--shu)":"inherit"}">${s.rep}</div></div>
      <div><div class="cap">総件数</div><div class="v">${s.n}</div></div></div>`;
  }
  if(top2.length){
    html+=`<div class="panel"><h2>今月潰すのはこの${top2.length===2?"2つ":"1つ"}</h2>`;
    top2.forEach((d,i)=>{
      const fixes=[...new Set(entries.filter(e=>e.kind===d.label&&e.fix).map(e=>e.fix))].slice(0,3);
      html+=`<div style="margin-bottom:${i===0&&top2.length>1?14:0}px">
        <div style="font-size:14px;font-weight:700">${esc(d.label)}
          <span style="font-family:var(--num);color:var(--inkSoft);margin-left:8px;font-weight:400">${d.n}件</span></div>
        ${fixes.length?"<ul>"+fixes.map(f=>"<li>"+esc(f)+"</li>").join("")+"</ul>"
          :'<div style="font-size:12px;color:var(--rule);margin-top:4px">防ぎ方がまだ書かれていません</div>'}
        ${d.label==="知識不足"?'<div style="font-size:11px;color:var(--shu);margin-top:6px">これはチェックリストではなく、勉強リストに回す型です</div>':""}</div>`;
    });
    html+=`<div class="note">全部は潰さないこと。上位2つだけを作業チェックリストに落とします。</div></div>`;
  }
  html+=tally("重大度別",s.sevs)+tally("種類別",s.kinds)+tally("発生工程別",s.stages);
  if(empty)html+=`<div class="empty">3か月ぶん貯まると、自分のミスが数パターンに収束していることが見えます。</div>`;
  return html;
}

function periodRange(){
  const to=today();
  if(period==="month")return [to.slice(0,8)+"01",to];
  const d=new Date(); d.setDate(d.getDate()-6);
  return [new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),to];
}
function countLine(arr,keys,pick){
  return keys.map(k=>{const n=arr.filter(e=>pick(e)===k).length;return n?k+"×"+n:null})
    .filter(Boolean).join(" ")||"なし";
}
function buildReport(){
  const [from,to]=periodRange();
  const a=entries.filter(e=>e.date>=from&&e.date<=to)
    .sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  const label=period==="week"?"週次":"月次";
  if(!a.length)return `【ミス台帳・${label}レポート依頼】\n期間: ${from} 〜 ${to}\n\nこの期間の記録は0件でした。`;
  const self=a.filter(e=>e.detector==="自分").length;
  const nofix=a.filter(e=>!e.fix).length;
  const nowhy=a.filter(e=>!e.why).length;
  const rep_=a.filter(e=>e.repeat).length;
  const ask=period==="week"
    ? "この内容から週次レポートを作ってください。反省文ではなく、未処理の督促が主目的です。5行以内でお願いします。"
    : "この内容から月次レポートを作ってください。型の分布、自己検知率、再発の状況、今月潰すべき2つ、知識不足から抽出した勉強リストを含めてください。";
  const rows=a.map((e,i)=>{
    const d=[e.cause?"因: "+e.cause:"",e.why?"害: "+e.why:"",e.fix?"次: "+e.fix:"次: (未記入)"]
      .filter(Boolean).join(" / ");
    return `${i+1}) ${e.date} [${e.sev||"?"}/${e.kind}/${e.detector}が発見${e.loss?"/実損":""}${e.repeat?"/再発":""}]${e.client?" "+e.client:""}\n   ${e.what}\n   ${d}`;
  }).join("\n");
  return `【ミス台帳・${label}レポート依頼】
期間: ${from} 〜 ${to}
件数: ${a.length}（うち再発 ${rep_}）
自己検知率: ${Math.round(self/a.length*100)}%（${self}/${a.length}）
重大度: ${countLine(a,SEV.map(v=>v[0]),e=>e.sev)}\n実損が出た件: ${a.filter(e=>e.loss).length}
種類: ${countLine(a,KINDS,e=>e.kind)}
発生工程: ${countLine(a,STAGES,e=>e.stage)}
未記入: 防ぎ方${nofix}件 / なぜまずいか${nowhy}件

■明細
${rows}

${ask}`;
}
function viewReport(){
  return `<div class="chips" style="margin-bottom:14px">
      <button class="chip${period==="week"?" on":""}" data-act="period" data-v="week">今週（直近7日）</button>
      <button class="chip${period==="month"?" on":""}" data-act="period" data-v="month">今月</button>
    </div>
    <textarea id="report" readonly></textarea>
    <button class="save" data-act="copy">コピーする</button>
    <a class="linkbtn" href="https://claude.ai/new" target="_blank" rel="noopener">Claudeを開く</a>
    <div class="note">コピーしてから、Claudeの入力欄に貼り付けてください。</div>`;
}

function render(){
  document.getElementById("count").textContent=String(entries.length).padStart(3,"0")+" 件";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  document.getElementById("main").innerHTML=
    tab==="write"?viewWrite():tab==="book"?viewBook():tab==="report"?viewReport():viewStats();
  if(tab==="report")document.getElementById("report").value=buildReport();
}

function readInputs(){
  ["what","cause","why","fix","client","date"].forEach(id=>{
    const el=document.getElementById(id); if(el)form[id]=el.value;
  });
}

document.addEventListener("input",e=>{
  if(e.target.id==="what"){
    form.what=e.target.value;
    const b=document.getElementById("save");
    if(b)b.disabled=!(form.what.trim()&&form.kind&&form.detector&&form.sev);
  }
});

document.addEventListener("click",e=>{
  const nav=e.target.closest("nav button");
  if(nav){readInputs();tab=nav.dataset.tab;render();return}
  const b=e.target.closest("[data-act]");
  if(b){
    const a=b.dataset.act;
    if(a==="more"){readInputs();more=true;render()}
    else if(["kind","stage","detector","sev"].includes(a)){readInputs();form[a]=form[a]===b.dataset.v?"":b.dataset.v;render()}
    else if(a==="repeat"){readInputs();form.repeat=!form.repeat;render()}
    else if(a==="loss"){readInputs();form.loss=!form.loss;render()}
    else if(a==="rep"){const x=entries.find(v=>v.id===b.dataset.id);x.repeat=!x.repeat;save();render()}
    else if(a==="del"){
      const i=entries.findIndex(v=>v.id===b.dataset.id);
      if(i>=0){const x=entries.splice(i,1)[0];x.deletedAt=Date.now();trash.unshift(x);
        if(trash.length>200)trash.length=200;save();render();toast("削除しました",x.id)}
    }
    else if(a==="undo"||a==="restore"){
      const i=trash.findIndex(v=>v.id===b.dataset.id);
      if(i>=0){const x=trash.splice(i,1)[0];delete x.deletedAt;entries.unshift(x);save();render()}
      document.getElementById("toast").classList.add("hide");
    }
    else if(a==="purge"){
      if(confirm("この記録を完全に削除します。元に戻せません。"))
        {trash=trash.filter(v=>v.id!==b.dataset.id);save();render()}
    }
    else if(a==="trash"){showTrash=!showTrash;render()}
    else if(a==="edit"){
      const x=entries.find(v=>v.id===b.dataset.id);
      if(x){form={...x};editing=x.id;more=true;tab="write";render();
        if(typeof scrollTo==="function")scrollTo(0,0)}
    }
    else if(a==="cancel"){editing=null;form=blankForm();more=false;render()}
    else if(a==="period"){period=b.dataset.v;render()}
    else if(a==="copy"){
      const t=document.getElementById("report");
      t.focus();t.setSelectionRange(0,t.value.length);
      const done=()=>toast("コピーしました");
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(t.value).then(done).catch(()=>toast("選択したので、長押しでコピーしてください"));
      else{try{document.execCommand("copy");done()}catch(err){toast("選択したので、長押しでコピーしてください")}}
    }
    else if(a==="import"){showImport()}
    else if(a==="sort"){
      const k=b.dataset.k;
      if(sortKey===k)sortDir=-sortDir; else{sortKey=k;sortDir=(k==="date"||k==="sev"||k==="repeat"?-1:1)}
      render();
    }
    else if(a==="export"){showExport()}
    return;
  }
  if(e.target.id==="save"){
    readInputs();
    if(!(form.what.trim()&&form.kind&&form.detector&&form.sev))return;
    if(editing){
      const i=entries.findIndex(v=>v.id===editing);
      if(i>=0)entries[i]={...entries[i],...form,what:form.what.trim(),id:editing};
      editing=null;
    }else{
      entries.unshift({...form,what:form.what.trim(),id:newId()});
    }
    save();
    form=blankForm();
    more=false;render();toast("保存しました");
  }
});

function importTSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length&&/^日付\t/.test(lines[0]))lines.shift();
  let added=0,skipped=0;
  lines.forEach(l=>{
    const c=l.split("\t");
    if(c.length<3)return;
    const e={date:(c[0]||"").trim()||today(),client:c[1]||"",what:(c[2]||"").trim(),
      sev:(c[3]||"").trim(),kind:(c[4]||"").trim(),stage:(c[5]||"").trim(),
      detector:(c[6]||"").trim(),cause:c[7]||"",why:c[8]||"",fix:c[9]||"",
      loss:!!(c[10]&&c[10].trim()),repeat:!!(c[11]&&c[11].trim())};
    if(!e.what)return;
    if(entries.some(x=>x.date===e.date&&x.what===e.what)){skipped++;return}
    e.id=newId(); entries.unshift(e); added++;
  });
  if(added)save();
  return [added,skipped];
}
function showImport(){
  const d=document.createElement("div");
  d.className="modal";
  d.innerHTML=`<div class="box"><h2>控えを貼り付けて読み込む</h2>
    <div class="note" style="margin:0 0 8px">スプレッドシートから該当範囲をコピーして貼り付けてください。見出し行は入っていても大丈夫です。同じ日付・同じ内容のものは重複登録しません。</div>
    <textarea placeholder="日付	案件	何が起きた	…"></textarea>
    <button class="close" data-go="1">読み込む</button>
    <button class="ghost" style="margin-top:8px">やめる</button></div>`;
  const ta=d.querySelector("textarea"); ta.readOnly=false;
  d.addEventListener("click",ev=>{
    if(ev.target===d||ev.target.classList.contains("ghost")){d.remove();return}
    if(ev.target.dataset.go){
      const [n,sk]=importTSV(ta.value);
      d.remove(); render();
      toast(n?`${n}件を読み込みました${sk?`（重複${sk}件は除外）`:""}`:"読み込めるデータが見つかりませんでした");
    }
  });
  document.body.appendChild(d);
  ta.focus();
}
function showExport(){
  const head="日付\t案件\t何が起きた\t重大度\t種類\t発生工程\t誰が気づいた\t原因\tなぜまずいか\t次の防ぎ方\t実損\t再発";
  const rows=[...entries].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>
    [e.date,e.client,e.what,e.sev,e.kind,e.stage,e.detector,e.cause,e.why,e.fix,e.loss?"○":"",e.repeat?"○":""]
      .map(v=>String(v||"").replace(/[\t\n]/g," ")).join("\t"));
  const tsv=[head,...rows].join("\n");
  const d=document.createElement("div");
  d.className="modal";
  d.innerHTML=`<div class="box"><h2>全体を選択してコピーし、スプレッドシートのA1に貼ってください</h2>
    <textarea readonly></textarea><button class="close">閉じる</button></div>`;
  d.querySelector("textarea").value=tsv;
  d.addEventListener("click",ev=>{if(ev.target===d||ev.target.classList.contains("close"))d.remove()});
  document.body.appendChild(d);
  const ta=d.querySelector("textarea");ta.focus();ta.setSelectionRange(0,tsv.length);
}

render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
