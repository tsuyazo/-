<meta charset="utf-8">
<title>ゲートボール1103 デュエル盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one-screen duel table — opponent above, you below, hand docked at the bottom. Single dark walnut theme by design. */
:root{
  --table:#211813; --felt:#2d221b; --slot:#382a21; --line:#4d3c2f;
  --ink:#f2e8d8; --muted:#b8a48c; --brass:#d6a94f; --brassInk:#2a1d0c;
  --hurt:#e0604f; --heal:#7fbf86;
  --c-normal:#d9bb62; --c-effect:#cf7e45; --c-fusion:#8f63b5; --c-synchro:#ece8dc; --c-xyz:#2b2a31;
  --c-spell:#2f8c78; --c-trap:#b14a7f; --c-token:#8a8f96; --c-back:#5a3b26;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--table);color:var(--ink);font-family:var(--body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;padding-block:8px}

/* ---- setup ---- */
.setup{display:flex;flex-direction:column;gap:18px;padding-block:20px 32px}
.brand{font-family:var(--display);font-size:clamp(34px,10vw,52px);line-height:1;letter-spacing:.02em;color:var(--brass);margin:0}
.brand small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.2em;margin-top:8px}
.seat{background:var(--felt);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.seat h2{margin:0;font-family:var(--display);font-size:18px;font-weight:400}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.deckbtn{text-align:left;border:1px solid var(--line);background:var(--slot);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.deckbtn b{font-size:13px}
.deckbtn span{font-size:11px;color:var(--muted)}
.deckbtn.on{border-color:var(--brass);background:#4a3720}
.tier{font-family:var(--display);font-size:11px;color:var(--brass)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipbtn{border:1px solid var(--line);background:var(--slot);border-radius:999px;padding:7px 12px;font-size:13px}
.chipbtn.on{border-color:var(--brass);color:var(--brass)}
.big{border:none;background:var(--brass);color:var(--brassInk);font-family:var(--display);font-size:18px;padding:14px;border-radius:6px;width:100%}
.ghost{border:1px solid var(--line);background:none;border-radius:6px;padding:12px;width:100%}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:0}

/* ---- board ---- */
.side{display:flex;flex-direction:column;gap:4px}
.piles{display:flex;gap:4px;flex-wrap:wrap}
.pile{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--felt);border-radius:4px;padding:3px 4px;font-size:11px;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.pile b{font-size:12px}
.pile.fz{flex:2 1 0;text-overflow:ellipsis}
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1/1;background:var(--slot);border-radius:4px;display:grid;place-items:center;position:relative;border:1px dashed var(--line);min-width:0}
.cell.st{background:#30251d}
.tile{width:72%;height:100%;border-radius:3px;padding:3px;display:flex;flex-direction:column;justify-content:space-between;
  font-size:9px;line-height:1.2;overflow:hidden;border:1px solid rgba(0,0,0,.35);position:relative;color:#1b130e;text-align:left;background:var(--c-effect)}
.tile .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;word-break:break-all}
.tile .st{font-size:8.5px;white-space:nowrap;letter-spacing:-.02em}
.tile.def{transform:rotate(90deg)}
.tile.t-通常{background:var(--c-normal)} .tile.t-効果{background:var(--c-effect)} .tile.t-融合{background:var(--c-fusion);color:#fff}
.tile.t-同調{background:var(--c-synchro)} .tile.t-重ね{background:var(--c-xyz);color:#efe6d6} .tile.t-魔法{background:var(--c-spell);color:#fff}
.tile.t-罠{background:var(--c-trap);color:#fff} .tile.t-トークン{background:var(--c-token)}
.tile.back{background:repeating-linear-gradient(45deg,var(--c-back) 0 6px,#4a2f1e 6px 12px);border-color:#7a5536}
.tile.down::after{content:"裏";position:absolute;right:2px;bottom:2px;font-size:9px;background:rgba(0,0,0,.55);color:#fff;padding:0 3px;border-radius:2px}
.badges{position:absolute;left:-2px;top:-4px;display:flex;gap:2px;z-index:2}
.bdg{font-size:9px;background:var(--brass);color:var(--brassInk);border-radius:3px;padding:0 3px;font-weight:700}
.bdg.neg{background:#6b6f78;color:#fff}
.bdg.mod{background:#e9d9b8}
.mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:6px 0}
.lp{font-family:var(--display);font-size:22px;line-height:1}
.lp small{display:block;font-family:var(--body);font-size:10px;color:var(--muted)}
.lp.r{text-align:right}
.lp.cur{color:var(--brass)}
.phase{display:flex;flex-direction:column;align-items:center;gap:2px}
.phase .t{font-size:10px;color:var(--muted)}
.phase .p{font-family:var(--display);font-size:15px;border:1px solid var(--brass);color:var(--brass);background:none;border-radius:4px;padding:4px 10px}
.logline{font-size:11px;color:var(--muted);text-align:center;min-height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:none;background:none;width:100%}
.hand{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 4px;min-height:96px}
.hand .tile{width:62px;flex:0 0 62px;height:88px;font-size:10px}
.hand .tile .st{font-size:9px}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-top:4px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.tools button{border:1px solid var(--line);background:var(--felt);border-radius:4px;padding:9px 2px;font-size:12px}
.tools .go{background:var(--brass);color:var(--brassInk);border-color:var(--brass);font-weight:700}
.who{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

/* ---- sheet / modal ---- */
.scrim{position:fixed;inset:0;background:rgba(10,6,4,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--felt);border-top:2px solid var(--brass);width:100%;max-width:560px;max-height:82%;overflow-y:auto;border-radius:10px 10px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;text-wrap:balance}
.meta{font-size:12px;color:var(--muted)}
.ctext{font-size:13px;line-height:1.75;white-space:pre-wrap;background:var(--slot);padding:10px;border-radius:4px;margin:0}
.guide{background:var(--slot);border-radius:4px;padding:8px 10px;margin:8px 0;font-size:12.5px;line-height:1.7}
.guide summary{cursor:pointer;font-weight:700;color:var(--brass)}
.guide .gline{margin:6px 0;display:grid;grid-template-columns:4em 1fr;gap:6px}
.guide .gline b{color:var(--muted)}
.guide ol,.guide ul{margin:2px 0 6px;padding-left:1.3em}
.guide li{margin:2px 0}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.acts button{border:1px solid var(--line);background:var(--slot);border-radius:4px;padding:10px 6px;font-size:13px;text-align:center}
.acts button.pri{background:var(--brass);color:var(--brassInk);border-color:var(--brass);font-weight:700}
.acts button.dan{border-color:#7e3a32}
.acts button:disabled{opacity:.38;cursor:not-allowed}
.why{font-size:11px;color:var(--muted)}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px}
.steps button{border:1px solid var(--line);background:var(--slot);border-radius:4px;padding:6px 8px;font-size:12px;min-width:44px}
.steps b{min-width:40px;text-align:center}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--slot);border-radius:4px;padding:6px;text-align:left;width:100%}
.li.on{border-color:var(--brass);background:#4a3720}
.lirow{display:flex;gap:4px;align-items:stretch}
.lirow .li{flex:1;min-width:0}
.infobtn{flex:0 0 auto;border:1px solid var(--line);background:var(--felt);border-radius:4px;padding:0 10px;font-size:11px;color:var(--muted)}
.infobtn.on{border-color:var(--brass);color:var(--brass)}
.liinfo{display:flex;gap:8px;align-items:flex-start;background:var(--felt);border:1px solid var(--line);border-radius:4px;padding:8px;margin:-2px 0 2px}
.liinfo img{width:72px;flex:0 0 72px;border-radius:3px}
.liinfo .meta{margin:0 0 4px}
.liinfo .ctext{font-size:12.5px;padding:6px 8px}
.li .sw{width:10px;align-self:stretch;border-radius:2px;flex:0 0 10px}
.li .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.li .tx b{font-size:13px}
.li .tx span{font-size:11px;color:var(--muted)}
.form{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:13px}
.form input,.form select{background:var(--slot);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:8px;font-size:16px;width:100%;font-family:inherit}
.curtain{position:fixed;inset:0;z-index:40;background:var(--table);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.curtain .brand{font-size:40px}
.win{border:2px solid var(--brass);border-radius:6px;padding:12px;text-align:center;color:var(--brass);background:var(--felt);margin-bottom:6px}
.win .wt{font-family:var(--display);font-size:24px;line-height:1.2}
.win .wsub{margin:4px 0 8px;font-size:12px;color:var(--muted)}
.win .wrows{display:grid;gap:4px;font-size:12.5px;color:var(--ink);text-align:left}
.win .wrows div{display:flex;justify-content:space-between;gap:8px;background:var(--slot);border-radius:4px;padding:4px 8px}
.win .wrows b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:50;max-width:90%}
/* ---- PC幅：盤面の右にデュエルの記録を常に出す ---- */
#sidelog{display:none}
@media (min-width:1000px){
  #sidelog{display:block;position:fixed;top:12px;bottom:12px;right:16px;width:min(340px,calc((100vw - 520px)/2 - 32px));
    background:var(--felt);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-y:auto;font-size:12px;line-height:1.7}
  #sidelog h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:14px;color:var(--brass);position:sticky;top:-10px;background:var(--felt);padding-block:4px}
  #sidelog div{padding-block:1px;border-bottom:1px solid rgba(255,255,255,.04)}
  #sidelog .sl-turn{color:var(--brass);font-weight:700;margin-top:8px;border:0}
  #sidelog .sl-op{color:var(--muted)}
}
.hintbtn{margin:4px 0 8px;font-size:12px}
.hintline{margin:4px 0 8px;font-size:12.5px;color:var(--brass);font-weight:700}
.li.rec{border-color:var(--brass)!important;box-shadow:0 0 0 1px var(--brass) inset}
.recmark{font-style:normal;font-weight:700;display:inline-block;background:var(--brass);color:var(--brassInk);font-size:10px;border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:1px}
/* ---- 演出（召喚・攻撃・ダメージ・発動）。src/fx.js が要素とクラスを付け外しする ---- */
html{overflow-x:clip}
#caption.low{top:auto;bottom:16%;transform:translate(-50%,0)}
#duel-fx{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none;z-index:24}
.fx{position:absolute;pointer-events:none;animation:var(--anim) var(--t) ease-out forwards}
.fx.ring{--anim:fx-ring;width:90px;height:90px;border-radius:50%;border:3px solid var(--brass);box-shadow:0 0 18px var(--brass),inset 0 0 14px var(--brass)}
.fx.ring.special{border-color:#bfe9ff;box-shadow:0 0 22px #8fd3ff,inset 0 0 16px #8fd3ff}
.fx.ring.flip{border-color:#e8c58a}
@keyframes fx-ring{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
.fx.pillar{--anim:fx-pillar;width:70px;height:60vh;transform-origin:50% 100%;background:linear-gradient(to top,rgba(190,235,255,.85),rgba(190,235,255,.25) 60%,transparent);filter:blur(2px);mix-blend-mode:screen}
@keyframes fx-pillar{0%{transform:translate(-50%,-100%) scaleY(0);opacity:0}35%{transform:translate(-50%,-100%) scaleY(1);opacity:.9}100%{transform:translate(-50%,-100%) scaleY(1);opacity:0}}
.fx.tag{--anim:fx-tag;font-family:var(--display);font-size:13px;letter-spacing:.06em;white-space:nowrap;color:#fff;text-shadow:0 0 6px var(--brass),0 1px 2px #000}
.fx.tag.special{text-shadow:0 0 8px #6cc6ff,0 1px 2px #000}
@keyframes fx-tag{0%{transform:translate(-50%,-30%);opacity:0}25%{transform:translate(-50%,-100%);opacity:1}100%{transform:translate(-50%,-140%);opacity:0}}
.tile.fx-drop{animation:fx-drop var(--t) ease-out}
@keyframes fx-drop{from{transform:scale(1.35);opacity:0;filter:brightness(2.2)}to{transform:scale(1);opacity:1;filter:brightness(1)}}
.fx.srcglow{--anim:fx-glow;transform:translate(-50%,-50%);border-radius:4px;box-shadow:0 0 0 2px #fff,0 0 22px 6px var(--glow)}
.fx.srcglow.spell{--glow:#3fd1a8}.fx.srcglow.trap{--glow:#ff5fb0}.fx.srcglow.monster{--glow:#ffb35c}
@keyframes fx-glow{0%{opacity:0}20%{opacity:1}70%{opacity:1}100%{opacity:0}}
.fx.cutin{--anim:fx-cutin;display:flex;flex-direction:column;align-items:center;gap:6px}
@keyframes fx-cutin{
  0%{transform:translate(calc(-50% + var(--from) * 60vw),-50%) skewX(calc(var(--from) * -12deg));opacity:0}
  22%{transform:translate(-50%,-50%) skewX(0deg);opacity:1}
  78%{transform:translate(-50%,-50%) scale(1.02);opacity:1}
  100%{transform:translate(calc(-50% - var(--from) * 40vw),-50%);opacity:0}}
.fx.cutin .cut-band{font-family:var(--display);font-size:22px;letter-spacing:.08em;color:#fff;padding:4px 22px;border-radius:3px;background:var(--band);box-shadow:0 0 24px var(--band);white-space:nowrap}
.fx.cutin .cut-band small{font-family:var(--body);font-size:11px;margin-left:8px;opacity:.85}
.fx.cutin .cut-card{width:118px;aspect-ratio:59/86;border-radius:5px;overflow:hidden;background:var(--band);box-shadow:0 0 0 2px #fff,0 0 28px var(--band),0 10px 30px rgba(0,0,0,.6)}
.fx.cutin .cut-card img{width:100%;height:100%;object-fit:cover;display:block}
.fx.cutin .cut-blank{width:100%;height:100%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px)}
.fx.cutin .cut-name{font-weight:700;font-size:15px;color:#fff;background:rgba(10,6,4,.85);padding:3px 12px;border-radius:3px;max-width:80vw;text-align:center}
.fx.cutin.spell{--band:#1f9c78}.fx.cutin.trap{--band:#b8306f}.fx.cutin.monster{--band:#c4672a}
.tile.fx-lunge{position:relative;z-index:5;animation:fx-lunge var(--t) ease-in-out}
@keyframes fx-lunge{0%{transform:translate(0,0) scale(1)}25%{transform:translate(0,0) scale(1.12)}55%{transform:translate(var(--dx),var(--dy)) scale(1.12)}100%{transform:translate(0,0) scale(1)}}
.fx.impact{--anim:fx-impact;width:80px;height:80px}
@keyframes fx-impact{from{transform:translate(-50%,-50%) scale(.3) rotate(-20deg);opacity:1}to{transform:translate(-50%,-50%) scale(1.4) rotate(0deg);opacity:0}}
.fx.impact i{position:absolute;left:50%;top:50%;width:96px;height:6px;margin:-3px 0 0 -48px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff,#ffd27a,#fff,transparent);box-shadow:0 0 12px #ffcf6a}
.fx.impact i:nth-child(1){transform:rotate(30deg)}.fx.impact i:nth-child(2){transform:rotate(-30deg)}.fx.impact i:nth-child(3){transform:rotate(90deg);width:60px;margin-left:-30px}
.fx.impact.direct i{background:linear-gradient(90deg,transparent,#fff,#ff6a55,#fff,transparent);box-shadow:0 0 14px #ff5a45}
.fx.lpnum{--anim:fx-num;font-family:var(--display);font-size:26px;color:var(--hurt);text-shadow:0 0 10px rgba(224,96,79,.8),0 2px 0 #000;white-space:nowrap}
.fx.lpnum.heavy{font-size:36px}
.fx.lpnum.recover{color:var(--heal);text-shadow:0 0 10px rgba(127,191,134,.8),0 2px 0 #000}
.fx.lpnum.cost{font-size:20px;color:#e8a35c;text-shadow:0 2px 0 #000}
@keyframes fx-num{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{transform:translate(-50%,-90%) scale(1.15);opacity:1}70%{transform:translate(-50%,-110%) scale(1);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.fx-shake{animation:fx-shake var(--t) linear}
@keyframes fx-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.fx-quake{animation:fx-quake var(--t) linear}
@keyframes fx-quake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}}
.fx-vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 10px rgba(224,60,40,.55);animation:fx-vig var(--t) ease-out forwards;--peak:.6}
.fx-vignette.mine{box-shadow:inset 0 0 120px 24px rgba(224,40,30,.75)}
.fx-vignette.heavy{--peak:1}
@keyframes fx-vig{0%{opacity:0}15%{opacity:var(--peak)}100%{opacity:0}}
.fx.shard{--anim:fx-shard;width:7px;height:7px;background:#e9dcc6;box-shadow:0 0 6px rgba(255,220,170,.8);border-radius:1px}
.fx.shard.ban{background:#b9a3ff;box-shadow:0 0 6px #9a7dff}
@keyframes fx-shard{from{transform:translate(-50%,-50%) rotate(0deg);opacity:1}to{transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) rotate(var(--rot));opacity:0}}
/* 動きを減らす設定の人には、移動や揺れをやめて光と数字だけにする */
@media (prefers-reduced-motion: reduce){
  .tile.fx-lunge,.fx-shake,.fx-quake,.tile.fx-drop{animation:none}
  .fx.cutin{animation-name:fx-glow;transform:translate(-50%,-50%)}
  .fx.shard,.fx.pillar{display:none}
}
.logbox{font-size:12px;line-height:1.7;display:flex;flex-direction:column-reverse;gap:2px}
.logbox div{border-bottom:1px solid var(--line);padding-block:2px}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .16s ease-out} .scrim.still .sheet{animation:none} @keyframes up{from{transform:translateY(24px);opacity:.6}} }

/* engine-driven additions */
.tile.can{box-shadow:0 0 0 2px var(--brass),0 0 10px rgba(214,169,79,.65)}
.pile.hot{border-color:var(--brass);color:var(--brass)}
.chain{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;font-size:11px}
.chain span{border:1px solid var(--hurt);color:var(--ink);border-radius:999px;padding:1px 8px;background:#3a1f1a}
.think{grid-column:span 3;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--brass);border:1px dashed var(--line);border-radius:4px}
.tools button:disabled{opacity:.4}
.think.narrow{grid-column:span 2}
.tools button.on{border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.ask{font-size:15px;font-weight:700;margin:0}
.phase .p{cursor:default}
.phase .ns{font-size:10px}

/* card images */
.tile.img{background-size:cover;background-position:center 18%;color:#fff}

/* turn & phase visibility */
[hidden]{display:none!important}
.phases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;font-size:10px;text-align:center}

.phases.mine span.on{background:var(--brass);color:var(--brassInk);border-color:var(--brass);font-weight:700}
.phases.theirs span.on{background:var(--hurt);color:#fff;border-color:var(--hurt);font-weight:700}
.who{font-family:var(--display);font-size:13px;border-radius:4px;padding:3px 8px}
.who.mine{background:var(--brass);color:var(--brassInk)}
.who.theirs{background:var(--hurt);color:#fff}

.side.turnside.theirs{--turnc:rgba(224,96,79,.55)}

.banner{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(10,6,4,.45)}
.banner .band{width:100%;text-align:center;font-family:var(--display);font-size:clamp(28px,9vw,44px);padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));color:#fff}
.banner .band small{display:block;font-family:var(--body);font-size:13px;letter-spacing:.2em;opacity:.85}
.banner.mine .band{background:var(--brass);color:var(--brassInk)}
.banner.theirs .band{background:var(--hurt)}
.caption{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:25;max-width:min(92vw,480px);background:#160f0b;border:2px solid var(--hurt);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:15px;font-weight:700;text-align:center;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){
  .banner:not([hidden]) .band{animation:sweep .35s ease-out}
  @keyframes sweep{from{transform:translateX(-30%);opacity:0}}
  .caption.pop{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translate(-50%,-40%);opacity:0}}
}
