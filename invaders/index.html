  cv.style.height = Math.floor(H * scale) + "px";
  cv.width = Math.floor(W * scale * dpr);
  cv.height = Math.floor(H * scale * dpr);

function checkAch() {
  mem.ach = mem.ach || {};

function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
}
function tone(f, d, type = "square", v = 0.05, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
let noiseBuf = null;
function noise(d, v = 0.08, hp = 800) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = hp;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d);
}

function noteAt(t, n, d, type, v) {
  if (!n) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (n - 69) / 12);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function wantSong() {
  if (snd > 0 || paused || document.hidden) return null;
  switch (state) {
    case "title": return "title";
    case "shop": return ui && ui.mood === "empty" ? null : "shop";
    case "ending": return ui && ui.ending === "genocide" ? null : "happy";
    case "dying": case "over": case "revive": case "chest": return null;
  }
  if (enemies.some(e => MON[e.type].boss && !e.dead)) return "boss";
  if (form && form.peace > 0) return "happy";
  return "field";
}
setInterval(() => {
  if (!AC) return;
  const want = wantSong();
  if (want !== bgm.song) { bgm.song = want; bgm.step = 0; bgm.next = AC.currentTime + 0.08; }
  if (!want) return;
  const S = SONGS[want], dur = 60 / S.bpm / 2;
  if (bgm.next < AC.currentTime - 0.5) bgm.next = AC.currentTime + 0.05; // ながく とまっていたら やりなおす
  while (bgm.next < AC.currentTime + 0.25) {
    noteAt(bgm.next, S.mel[bgm.step % S.mel.length], dur * 0.9, S.lead, S.mv);
    noteAt(bgm.next, S.bass[bgm.step % S.bass.length], dur * 0.95, "triangle", S.bv);
    bgm.next += dur; bgm.step++;
  }
}, 50);

function makeSprite(rows, color) {
  const w = Math.max(...rows.map(r => r.length));
  const c = document.createElement("canvas");
  c.width = w; c.height = rows.length;
  const x = c.getContext("2d"); x.fillStyle = color;
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === "#") x.fillRect(i, j, 1, 1); });
  return c;
}

function rectLine(x, y, w, h, color = C.white, lw = 2) {
  ctx.fillStyle = color;

  ctx.fillRect(x, y, lw, h); ctx.fillRect(x + w - lw, y, lw, h);
}

function unlockedTypes(w) {
  const t = [0, 1, 2];
  if (w >= 2) t.push(5);
  if (w >= 3) t.push(3);
  if (w >= 4) t.push(6);
  if (w >= 6) t.push(4);
  if (w >= 7) t.push(8);
  if (w >= 8) t.push(15);
  if (w >= 9) t.push(16);
  return t;
}

function buildFormation() {
  const rows = Math.min(3 + Math.floor((wave - 1) / 2), 5), cols = 6;
  const gx = 30, gy = 22, fw = (cols - 1) * gx + 12;
  form.ox = BOX0.x + (BOX0.w - fw) / 2;
  const pool = unlockedTypes(wave);
  const rowTypes = [];
  for (let r = 0; r < rows; r++) {
    if (wave <= 1) rowTypes.push(r === 0 ? 2 : (r <= (rows - 1) / 2 ? 1 : 0));
    else rowTypes.push(pick(pool));
  }
  const nt = NEW_TYPE[wave] && NEW_TYPE[wave].type;
  if (nt != null && !rowTypes.includes(nt)) rowTypes[Math.floor(rows / 2)] = nt;
  rowTypes.forEach((type, r) => {
    for (let c = 0; c < cols; c++) {
      const m = MON[type];
      const e = mkEnemy(type, 0, 0, { fx: c * gx + (12 - m.w) / 2, fy: r * gy + (10 - m.h) / 2 });
      enemies.push(e);
    }
  });
  form.total = enemies.length;
  form.oyT = form.oy; form.oy -= 80; // うえから おりてくる
  placeFormation();
}

function mkEnemy(type, x, y, extra = {}) {
  const m = MON[type];
  if (!mem.seen[type]) { mem.seen[type] = 1; saveMem(); }
  return Object.assign({
    id: nextId++, type, x, y, w: m.w, h: m.h, hp: m.hp + Math.floor((wave - 1) / 3), flash: 0, shakeT: 0,
    free: !m.fm, fm: !!m.fm, t: Math.random() * 10, fx: 0, fy: 0, dv: 0, guard: false, guardT: Math.random() * 1.2,
  }, extra);
}

function placeFormation() {

function openMenu(tab) {
  setState("menu"); SFX.select();
  ui = { tab, cursor: 0, sub: "weapon" };
  menuHint();
}
function closeMenu() {
  SFX.cancel();
  soul.inv = Math.max(soul.inv, 0.5);
  setState("play"); ui = null;
}
function menuHint() {
  if (state !== "menu") return;
  if (ui.tab === "item") say(soul.bag.length ? "＊ タップで つかう。" : "＊ なにも もっていない。");
  else say("＊ タップで そうびを かえる。");
}

// 画面ごとの「えらべる行」（描画と タップ判定で 共通）
function layoutRows() {
  const rows = [];
  const x = BOX0.x + 12, w = BOX0.w - 24;
  if (state === "menu" && ui.tab === "item") {
    let y = BOX0.y + 30;
    soul.bag.forEach((key, i) => { rows.push({ x, y, w, h: 16, label: ITEMS[key].name, act: () => useItem(i) }); y += 17; });
  } else if (state === "menu" && ui.tab === "equip") {
    const y0 = BOX0.y + 64;
    const half = w / 2;
    rows.push({ x, y: y0, w: half - 4, h: 16, tab: true, label: "ぶき", on: ui.sub === "weapon", act: () => { ui.sub = "weapon"; ui.cursor = 0; SFX.move(); } });
    rows.push({ x: x + half + 4, y: y0, w: half - 4, h: 16, tab: true, label: "ぼうぐ", on: ui.sub === "armor", act: () => { ui.sub = "armor"; ui.cursor = 1; SFX.move(); } });
    let y = y0 + 22;
    const list = ui.sub === "weapon" ? soul.weapons : soul.armors;
    for (const key of list) {
      const d = ui.sub === "weapon" ? WEAPONS[key] : ARMORS[key];
      const cur = soul[ui.sub] === key;
      rows.push({ x, y, w, h: 15, label: (cur ? "E " : "") + d.name + (ui.sub === "weapon" && wUp(key) ? " +" + wUp(key) : ""), right: ui.sub === "weapon" ? "ATK" + (d.atk + wUp(key)) : "DEF" + d.def,
        cur, act: () => equip(ui.sub, key) });
      y += 15;
    }
  } else if (state === "shop") {
    let y = BOX0.y + 104;
    ui.stock.forEach((s, i) => {
      const d = stockData(s), price = Math.ceil(d.price * ui.mult);
      rows.push({ x, y, w, h: 17, label: d.name, right: s.sold ? "うりきれ" : price ? price + "G" : "タダ", dim: s.sold, act: () => buy(i) });
      y += 18;
    });
    if (ui.mood !== "empty") {
      const up = wUp(soul.weapon), price = Math.ceil(forgePrice() * ui.mult);
      rows.push({ x, y, w, h: 17, label: up >= 5 ? "ぶきを きたえる" : "ぶきを きたえる +" + (up + 1), right: up >= 5 ? "MAX" : price + "G", dim: up >= 5, act: forge });
      y += 18;
      rows.push({ x, y: y + 4, w: w / 2 - 6, h: 17, label: "はなす", act: shopTalk });
    }
    rows.push({ x: ui.mood !== "empty" ? x + w / 2 + 6 : x, y: y + 4, w: w / 2 - 6, h: 17, label: "でる", act: leaveShop });
  }
  return rows;
}

function tapRows(p) {
  const rows = layoutRows().filter(r => r.act);
  const i = rows.findIndex(r => p.x >= r.x - 4 && p.x <= r.x + r.w + 4 && p.y >= r.y - 2 && p.y <= r.y + r.h + 1);
  if (i >= 0) { ui.cursor = i; rows[i].act(); }
}

function useItem(i) {
  const key = soul.bag[i];
  if (!key) return;
  soul.bag.splice(i, 1);
  say(ITEMS[key].use());
  ui.cursor = Math.min(ui.cursor, Math.max(0, soul.bag.length - 1));
}
function healMsg(text, n) {
  const before = soul.hp;
  soul.hp = Math.min(soul.maxHp, soul.hp + n);
  SFX.heal();
  return "＊ " + text + "\n＊ " + (soul.hp >= soul.maxHp ? "HPが まんたんに なった！" : "HPが " + (soul.hp - before) + " かいふくした！");
}
function bombAll(dmg) {
  for (const e of enemies) {
    if (e.dead || e.dying || e.spare || MON[e.type].ghost) continue; // みのがせる あいては まきこまない
    damageEnemy(e, dmg, true);
  }
  enemies = enemies.filter(e => !e.dead);
}
function equip(slot, key) {
  const d = slot === "weapon" ? WEAPONS[key] : ARMORS[key];
  if (soul[slot] === key) { say("＊ " + d.name + "\n＊ " + d.desc); return; }
  soul[slot] = key; SFX.equip();
  say("＊ " + d.name + " を そうびした。\n＊ " + d.desc);
}

// ---------------- みのがす ----------------
function doSpare() {
  if (form && form.peace > 0) {
    const n = dismissFormation(C.yellow, "みんな うれしそうに かえっていった", C.yellow);
    soul.spares++; mem.totalSpares = (mem.totalSpares || 0) + 1; SFX.spare();
    let g = n * 2 * (armor().goldX || 1), gift = "";
    const key = pick(["candy", "pie", "smoke", "bomb"]);
    if (soul.bag.length < INV_MAX) { soul.bag.push(key); gift = "  " + ITEMS[key].name; } else g += 10;
    soul.gold += g;
    pops.push({ x: W / 2, y: BOX.y + 126, text: "+" + g + "G" + gift, color: C.gold, t: -0.4 });
    return;
  }
  const list = spareables();
  if (!list.length) { SFX.cancel(); pops.push({ x: soul.x + 3, y: soul.y - 14, text: "…", color: C.gray, t: 0 }); return; }
  for (const e of list) {
    const m = MON[e.type];
    if (m.boss) { e.dying = true; soul.hold = false; startTalk(BOSS[m.boss].spared, e.id, "bossSpared"); return; }
    // まよいゴースト・わらにんぎょう
    if (m.dummy) pops.push({ x: e.x + 6, y: e.y - 22, text: "わらにんぎょうは ほっとした", color: C.white, t: -0.4 });
    e.dead = true; soul.spares++; mem.totalSpares = (mem.totalSpares || 0) + 1; SFX.spare();
    fadeOut(e, C.yellow);
    const key = pick(["candy", "pie", "smoke"]);
    if (soul.bag.length < INV_MAX) { soul.bag.push(key); pops.push({ x: e.x + 6, y: e.y - 8, text: ITEMS[key].name, color: C.yellow, t: 0 }); }
    else { soul.gold += 10; pops.push({ x: e.x + 6, y: e.y - 8, text: "+10G", color: C.gold, t: 0 }); }
  }
  enemies = enemies.filter(e => !e.dead);
}
// おどりの ウェーブを おわらせる（みのがした／じかんぎれ）
function dismissFormation(color, text, textColor) {
  const fm = enemies.filter(e => e.fm);
  for (const e of fm) { e.dead = true; fadeOut(e, color); }
  enemies = enemies.filter(e => !e.dead);
  form.peace = 0; soul.hold = false;
  pops.push({ x: W / 2, y: BOX.y + 110, text, color: textColor, t: 0 });
  return fm.length;
}
function fadeOut(e, color) {
  const m = MON[e.type], s = m.scale || 1;
  frameRows(e).forEach((r, j) => { for (let i = 0; i < r.length; i += 2) if (r[i] === "#") {
    parts.push({ x: e.x + i * s, y: e.y + j * s, vx: (Math.random() - 0.5) * 10, vy: -10 - Math.random() * 10, life: 0.8, max: 0.8, delay: 0, color, s: s });
  } });
}

// ---------------- かいわ（Undertale の ふきだし） ----------------
function startTalk(lines, who, after) {
  // メニューや おみせの なかでは はじめない。もどってから はなす
  if (state === "menu" || state === "shop" || state === "chest" || state === "savept") { form.pendingTalk = { lines, who, after }; return; }
  setState("talk");
  ui = { talk: lines, i: 0, who, after };
  say(lines[0]);
}
function talkTap() {
  if (!msg.done) { msg.shown = msgLen(); msg.done = true; return; }
  ui.i++;
  if (ui.i < ui.talk.length) { say(ui.talk[ui.i]); return; }
  const { who, after } = ui;
  ui = null; setState("play");
  const e = enemies.find(x => x.id === who);
  if (!e) return;
  const m = MON[e.type], key = m.boss;
  if (after === "flowerLeave") {
    e.dead = true; fadeOut(e, C.gold); SFX.spare();
    enemies = enemies.filter(x => !x.dead);
    mem.flower = true; saveMem();
    soul.hold = false; soul.hp = soul.maxHp; form.flower = 0;
    nextWave();
    return;
  }
  if (after === "phase2") bossPhase2(e);
  else if (after === "bossDust") {
    killEnemy(e); soul.bossKills++; soul.route[key] = "killed";
    mem.killed[key] = (mem.killed[key] || 0) + 1; saveMem();
    enemies = enemies.filter(x => !x.dead);
    Object.assign(TBOX, BOX0); soul.invert = false; form.dark = false;
  } else if (after === "bossSpared") {
    e.dead = true; soul.spares++; mem.totalSpares = (mem.totalSpares || 0) + 1; SFX.spare(); fadeOut(e, C.yellow);
    soul.route[key] = "spared"; if (!soul.friends.includes(key)) soul.friends.push(key);
    mem.spared[key] = (mem.spared[key] || 0) + 1; saveMem();
    const g = BOSS[key].gift, gold = 40 + wave * 2;
    soul.gold += gold;
    const list = g.type === "weapon" ? soul.weapons : soul.armors;
    if (!list.includes(g.key)) list.push(g.key);
    if (key === "cloud" && soul.bag.length < INV_MAX) soul.bag.push("cotton");
    const d = g.type === "weapon" ? WEAPONS[g.key] : ARMORS[g.key];
    pops.push({ x: W / 2, y: BOX0.y + 70, text: d.name + " +" + gold + "G", color: C.yellow, t: -0.8 });
    pops.push({ x: W / 2, y: BOX0.y + 90, text: m.name + "が みかたに なった", color: C.white, t: -1.6 });
    enemies = enemies.filter(x => !x.dead);
    Object.assign(TBOX, BOX0); soul.invert = false; form.dark = false;
  }
}

function spawnEvent() {

  const r = Math.random();
  const kind = (wave % 5 === 4 && !form.savedHere) || r < 0.12 ? "save" : r < 0.42 ? "shop" : "chest";
  if (kind === "save") form.savedHere = true;
  const w = kind === "shop" ? 14 : kind === "save" ? 7 : 12;
  events.push({ kind, w, h: kind === "shop" ? 12 : kind === "save" ? 7 : 10, x: BOX.x + 8 + Math.random() * (BOX.w - 16 - w), y: BOX.y + 2, bob: Math.random() * 6,
    mimic: kind === "chest" && wave >= 3 && Math.random() < 0.2 });
}

function shopMood() {
  if (soul.bossKills >= 2 && soul.spares === 0) return "empty";
  if (soul.bossKills >= 1 && soul.spares === 0) return "scared";
  if (soul.spares >= 2) return "friendly";
  return "normal";
}
function enterShop() {
  setState("shop"); SFX.door();
  const cons = Object.keys(ITEMS).filter(k => !ITEMS[k].unique).sort(() => Math.random() - 0.5).slice(0, 2).map(k => ({ type: "item", key: k }));
  const gear = gearPool().sort(() => Math.random() - 0.5).slice(0, 2);
  const mood = shopMood();
  ui = { stock: [...cons, ...gear], cursor: 0, mood, mult: { empty: 0, scared: 1.3, friendly: 0.8, normal: 1 }[mood] };
  say({
    normal: pick(["＊ いらっしゃい！\n　 ゆっくり みていってね。", "＊ おや、ソウルの おきゃくさん。\n　 なにを かう？", "＊ ここは よろずや ポコ。\n　 たたかいの おともに どうぞ。"]),
    friendly: "＊ うわさは きいてるよ。\n　 やさしい ソウル だってね。\n　 おまけ しておくよ！",
    scared: "＊ …い、いらっしゃい。\n　 あんた、チリの においが\n　 するね…。",
    empty: "＊ だれも いない。\n＊ しなものだけが のこっている。",
  }[mood]);
}
function gearPool() {
  return [
    ...Object.keys(WEAPONS).filter(k => !WEAPONS[k].unique && !soul.weapons.includes(k)).map(k => ({ type: "weapon", key: k })),
    ...Object.keys(ARMORS).filter(k => !ARMORS[k].unique && !soul.armors.includes(k)).map(k => ({ type: "armor", key: k })),
  ];
}
function stockData(s) { return s.type === "item" ? ITEMS[s.key] : s.type === "weapon" ? WEAPONS[s.key] : ARMORS[s.key]; }
function buy(i) {
  const s = ui.stock[i], d = stockData(s), price = Math.ceil(d.price * ui.mult);
  if (s.sold) { SFX.cancel(); say("＊ それは もう うりきれ。"); return; }
  if (soul.gold < price) { SFX.cancel(); say(ui.mood === "scared" ? "＊ …お、おかねが たりないよ。" : "＊ おかねが たりないみたい…"); return; }
  if (s.type === "item" && soul.bag.length >= INV_MAX) { SFX.cancel(); say("＊ もちものが いっぱいだよ。"); return; }
  soul.gold -= price; SFX.buy();
  const verb = ui.mood === "empty" ? "を もっていった。" : "を かった。";
  if (s.type === "item") { soul.bag.push(s.key); say("＊ " + d.name + " " + verb + "\n＊ " + d.desc); }
  else {
    s.sold = true;
    (s.type === "weapon" ? soul.weapons : soul.armors).push(s.key);
    say("＊ " + d.name + " " + verb + "\n＊ したの「そうび」で そうびできる。");
  }
}
// ぶきを きたえる（G の つかいみち）
function forge() {
  const up = wUp(soul.weapon), price = Math.ceil(forgePrice() * ui.mult), name = weapon().name;
  if (up >= 5) { SFX.cancel(); say("＊ " + name + " は もう\n　 これいじょう きたえられないよ。"); return; }
  if (soul.gold < price) { SFX.cancel(); say("＊ おかねが たりないみたい…"); return; }
  soul.gold -= price; soul.wUp = soul.wUp || {}; soul.wUp[soul.weapon] = up + 1;
  SFX.guard(); later(120, () => SFX.guard()); later(260, () => SFX.lvup());
  say("＊ まかせな！ カンカン…\n＊ " + name + " が +" + (up + 1) + " に なった！\n　 (ATK " + atk() + ")");
}

}
function rollTreasure() {
  const r = Math.random(), gear = gearPool();
  if (r < 0.35 && gear.length) return pick(gear);
  if (r < 0.75) return { type: "item", key: pick(Object.keys(ITEMS).filter(k => !ITEMS[k].unique)) };
  return { type: "gold", n: rnd(8, 20) + wave * 3 };
}
function chestTap() {
  if (!msg.done) { msg.shown = msgLen(); msg.done = true; return; }
  if (!ui.opened) {
    ui.opened = true; ui.openT = 0; SFX.open();
    const rw = ui.reward;
    if (rw.type === "gold") { soul.gold += rw.n; say("＊ なかには " + rw.n + "G が はいっていた！"); }
    else if (rw.type === "item") {
      const d = ITEMS[rw.key];
      if (soul.bag.length < INV_MAX) { soul.bag.push(rw.key); say("＊ " + d.name + " を てにいれた！\n＊ " + d.desc); }
      else { soul.gold += d.price; say("＊ " + d.name + " が はいっていたが\n　 もちきれないので うった。(+" + d.price + "G)"); }
    } else {

      say("＊ " + d.name + " を てにいれた！\n＊ " + d.desc);

  setState("play"); ui = null;
}

// ---------------- 更新 ----------------
function update(dt) {
  time += dt; stateT += dt;
  if (paused) return;
  if (hurtT > 0) hurtT -= dt;

  if (state === "menu" || state === "shop" || state === "chest" || state === "talk" || state === "revive" || state === "ending" || state === "savept") {
    updateMsg(dt, state === "talk");
    if (state === "chest" && ui.opened) ui.openT += dt;
    return; // せかいは とまる
  }

  for (const p of parts) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.t += dt; if (p.t > 0) p.y -= 14 * dt; }
  pops = pops.filter(p => p.t < 0.9);
  if (shake > 0) shake = Math.max(0, shake - dt * 20);

  // ボックスの かたちを ゆっくり かえる
  const k = Math.min(1, dt * 4);
  BOX.x += (TBOX.x - BOX.x) * k; BOX.w += (TBOX.w - BOX.w) * k;
  if (soul) soul.x = clampSoul(soul.x);

  if (state === "intro") {
    updateMsg(dt);
    moveSoulKeys(dt);
    form.appear = Math.min(1, form.appear + dt * 1.5);
    if (form.oyT != null) { form.oy += (form.oyT - form.oy) * Math.min(1, dt * 3); placeFormation(); }
    if (form.glitch > 0) { form.glitch -= dt; msg.t = 0; msg.shown = 0; }
    if (msg.done) { msg.hold += dt; if (msg.hold > 1.6) beginPlay(); }
  } else if (state === "play") {
    updatePlay(dt);
    saveT += dt;
    if (saveT > 2) { saveT = 0; saveRun(); }
  } else if (state === "dying") {
    updateDying();
  }
}

function beginPlay() {
  if (form.oyT != null) { form.oy = form.oyT; form.oyT = null; placeFormation(); }
  if (form.bossIntro) { const lines = form.bossIntro; form.bossIntro = null; startTalk(lines, enemies[0].id, "none"); }
  else setState("play");
  saveRun();
}

function updateMsg(dt, voice) {
  if (msg.done) return;
  msg.t += dt;
  const n = Math.min(msgLen(), Math.floor(msg.t * 28));
  if (n > msg.shown) {
    const all = msg.lines.join("");
    for (let i = msg.shown; i < n; i++) if (i % 2 === 0 && !/[\s　…。、！？]/.test(all[i])) voice ? SFX.voice() : SFX.blip();
    msg.shown = n;
  }
  if (msg.shown >= msgLen()) msg.done = true;
}

function moveSoulKeys(dt) {
  let d = 0;
  if (keys.ArrowLeft || keys.a || keys.A) d -= 1;
  if (keys.ArrowRight || keys.d || keys.D) d += 1;
  if (soul.invert) d = -d;
  if (d) soul.x = clampSoul(soul.x + d * 110 * dt);
}

function fire() {
  const w = weapon(), dmg = atk();
  const x = soul.x + 3, y = soul.y - 2;
  const mk = (dx, vx) => ({ x: x + dx, y, vx, dmg, pierce: !!w.pierce, hit: [] });
  if (w.shot === "twin") shots.push(mk(-2, 0), mk(2, 0));
  else if (w.shot === "spread") shots.push(mk(0, -60), mk(0, 0), mk(0, 60));
  else shots.push(mk(0, 0));
  SFX.shot();
}

const frameOf = e => {
  const m = MON[e.type];
  if (m.frames.length === 1) return 0;
  if (m.shield) return e.guard ? 0 : 1;
  if (m.dummy) return e.angry ? Math.floor(e.t * 6) % 2 : 0;
  if (e.free) return Math.floor(e.t * 4) % 2;
  return form.anim;
};
const frameRows = e => MON[e.type].frames[frameOf(e)];

function updatePlay(dt) {
  if (form.pendingTalk) { const t = form.pendingTalk; form.pendingTalk = null; startTalk(t.lines, t.who, t.after); return; }
  moveSoulKeys(dt);
  if (soul.inv > 0) soul.inv -= dt;
  if (soul.starT > 0) soul.starT -= dt;
  // ゆっくりどけい：てきの じかんだけ おそく なる
  if (soul.slowT > 0) soul.slowT -= dt;
  const edt = soul.slowT > 0 ? dt * 0.5 : dt;
  // うごいているか（あお・オレンジの はんてい）
  if (Math.abs(soul.x - soul.px) > 0.05) soul.moveT = 0.1; else soul.moveT = Math.max(0, soul.moveT - dt);
  soul.px = soul.x;
  if (armor().regen && soul.hp < soul.maxHp) { regenT += dt; if (regenT > 3) { regenT = 0; soul.hp++; } }
  updateFriends(dt);

  // 自動射撃（ボスが みのがしを まっている あいだは とまる）
  fireT -= dt;
  if (fireT <= 0 && !soul.hold) {
    fireT = Math.max(0.13, 0.3 - (soul.lv - 1) * 0.02) * (weapon().rate || 1);
    fire();
  }
  for (const s of shots) { s.y -= 240 * dt; s.x += (s.vx + (form.wind || 0) * 0.6) * dt; }
  shots = shots.filter(s => s.y > BOX.y && s.x > BOX.x && s.x < BOX.x + BOX.w && !s.dead);

  // おかねの あめ
  if (form.rush > 0) {
    form.rush -= dt;
    if (Math.random() < dt * 9) items.push({ kind: "coin", x: BOX.x + 6 + Math.random() * (BOX.w - 16), y: BOX.y + 2, v: rnd(2, 5), sway: Math.random() * 6 });
    if (form.rush <= 0) form.rush = -1;
  }

  updateFormation(edt);
  if (state !== "play") return;

  for (const e of enemies) {
    e.t += edt;
    if (e.flash > 0) e.flash -= dt;
    if (e.shakeT > 0) e.shakeT -= dt;
    const m = MON[e.type];
    if (m.shield) { e.guardT -= dt; if (e.guardT <= 0) { e.guard = !e.guard; e.guardT = e.guard ? 1.4 : 1.0; } }
    if (e.free) updateFree(e, m, edt);
  }
  if (state !== "play") return;

  // 隊列の 射撃
  efireT -= edt;
  const shooters = enemies.filter(e => e.fm && !e.free);
  if (form.peace > 0) {
    form.peace -= dt;
    if (form.peace <= 0) { dismissFormation(C.white, "モンスターたちは かえっていった", C.white); return; } // だれも えらばなかった
  } else if (efireT <= 0 && shooters.length) {
    efireT = Math.max(0.3, 1.25 - wave * 0.08) * (0.6 + Math.random() * 0.8) * (form.dark ? 1.3 : 1) * (form.angry ? 0.6 : 1);
    enemyFire(pick(shooters));
  }

  // ひとりごと
  form.chatT = (form.chatT == null ? 3 : form.chatT) - dt;
  if (form.chatT <= 0) {
    form.chatT = 4 + Math.random() * 5;
    const cands = enemies.filter(e => e.fm && !e.free && CHAT[e.type]);
    if (cands.length && !form.dark) { const e = pick(cands); e.chat = pick(CHAT[e.type]); e.chatT = 1.8; }
  }
  for (const e of enemies) if (e.chatT > 0) e.chatT -= dt;

  // とくべつな てき（おどりの あいだは こない）
  if (!(form.peace > 0)) {
  if (form.ghostT != null) { form.ghostT -= dt; if (form.ghostT <= 0) { form.ghostT = null; spawnGhost(); } }
  if (form.thiefT != null) { form.thiefT -= dt; if (form.thiefT <= 0) { form.thiefT = null; spawnThief(); } }
  if (form.dummyT != null) { form.dummyT -= dt; if (form.dummyT <= 0) { form.dummyT = null; spawnDummy(); } }
  }

  for (const b of ebul) {
    b.x += (b.vx + (form.wind || 0)) * edt; b.y += b.vy * edt;
    if (b.ay) b.vy += b.ay * edt;
    if (b.stopT != null) { // ときが とまる → うごきだす
      b.stopT -= edt;
      if (b.stopT <= 0 && !b.stopped) { b.stopped = true; b.vx = 0; b.vy = 0; }
      if (b.stopped && !b.gone) {
        b.goT -= edt;
        if (b.goT <= 0) { b.gone = true; const ax = soul.x + 3.5 - b.x, ay = soul.y + 3 - b.y, l = Math.hypot(ax, ay) || 1; b.vx = ax / l * 115; b.vy = ay / l * 115; }
      }
    }
    if (b.split && b.y > b.split) { // ひょうが われる
      b.dead = true;
      for (const a of [-0.6, 0, 0.6]) ebul.push({ x: b.x, y: b.y, vx: Math.sin(a) * 70 * (b.sp || 1), vy: Math.cos(a) * 70 * (b.sp || 1), dmg: b.sd || 3, c: "w", shape: "dot", w: 3, h: 3 });
    }
    if (b.bounce && (b.x < BOX.x + 4 || b.x > BOX.x + BOX.w - 4)) { b.vx = -b.vx; b.x = clamp(b.x, BOX.x + 4, BOX.x + BOX.w - 4); }
  }
  ebul = ebul.filter(b => b.y < BOX.y + BOX.h + 20 && b.y > BOX.y - 30 && b.x > BOX.x - 40 && b.x < BOX.x + BOX.w + 40 && !b.dead);
  for (const bm of beams) {
    bm.t += edt;
    if (!bm.fired && bm.t >= bm.warn) { bm.fired = true; SFX.beam(); shake = 3; }
  }
  beams = beams.filter(bm => bm.t < bm.warn + bm.dur);

  // おちてくる もの
  for (const it of items) { it.y += (it.kind === "coin" ? 60 : 40) * dt; if (it.kind === "coin") it.x += Math.sin(time * 4 + it.sway) * 12 * dt; }
  items = items.filter(it => {
    if (it.y > BOX.y + BOX.h - 4) return false;
    if (Math.abs(it.x + 3 - (soul.x + 3.5)) < 7 && Math.abs(it.y + 2 - (soul.y + 3)) < 7) { pickup(it); return false; }
    return true;
  });

  // みせ・たからばこ が おりてくる
  eventT -= dt;
  if (eventT <= 0 && !form.flower && !events.length && !form.rush && !enemies.some(e => MON[e.type].boss)) { spawnEvent(); eventT = 16 + Math.random() * 12; }
  for (const ev of events) ev.y += 16 * dt;
  events = events.filter(ev => ev.y < BOX.y + BOX.h - 4);
  for (const ev of events) {
    if (soul.x + 7 > ev.x && soul.x < ev.x + ev.w && soul.y + 6 > ev.y && soul.y < ev.y + ev.h) {
      events = events.filter(x => x !== ev);
      if (ev.kind === "shop") enterShop(); else if (ev.kind === "save") enterSave(); else if (ev.mimic) springMimic(ev); else enterChest();
      return;
    }
  }

  // 当たり判定：弾 → 敵
  for (const s of shots) {
    for (const e of enemies) {
      const m = MON[e.type];
      if (e.dead || e.dying || m.ghost || s.hit.includes(e.id)) continue;
      if (s.x >= e.x - 1 && s.x <= e.x + e.w + 1 && s.y <= e.y + e.h && s.y + 5 >= e.y) {
        if (m.shield && e.guard && !s.pierce) {
          s.dead = true; SFX.guard();
          pops.push({ x: e.x + e.w / 2, y: e.y - 6, text: "ガード", color: C.gray, t: 0.3 });
          break;
        }
        if (e.reflect) {
          s.dead = true; SFX.guard();
          const ax = soul.x + 3.5 - s.x, ay = soul.y - s.y, l = Math.hypot(ax, ay) || 1;
          ebul.push({ x: s.x, y: e.y + e.h, vx: ax / l * 90, vy: ay / l * 90, dmg: 4, c: "o", shape: "dot", w: 3, h: 3 });
          break;
        }
        damageEnemy(e, s.dmg);
        if (s.pierce) s.hit.push(e.id); else { s.dead = true; break; }
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
  if (state !== "play") return;

  // 当たり判定：敵の こうげき → ソウル（見た目より すこし ちいさめ）
  if (soul.inv <= 0) {
    const cx = soul.x + 3.5, cy = soul.y + 2.5, moving = soul.moveT > 0;
    for (const b of ebul) {
      if (Math.abs(b.x - cx) < b.w / 2 + 2 && Math.abs(b.y - cy) < b.h / 2 + 2) {
        if (b.c === "b" && !moving) continue; // あお：とまっていれば へいき
        if (b.c === "o" && moving) continue;  // オレンジ：うごいていれば へいき
        if (!b.keep) b.dead = true;
        hurt(b.dmg); break;
      }
    }
    if (soul.inv <= 0) for (const bm of beams) {
      if (bm.fired && Math.abs(bm.x - cx) < bm.w / 2 + 1) { hurt(bm.dmg); break; }
    }
    if (soul.inv <= 0) for (const e of enemies) {
      if (!e.free || e.dying || MON[e.type].ghost || MON[e.type].boss) continue;
      if (cx > e.x && cx < e.x + e.w && cy > e.y && cy < e.y + e.h) {
        if (MON[e.type].thief) steal(e); else hurt(5);
        break;
      }
    }
  }

  const blocking = enemies.filter(e => e.fm || MON[e.type].boss || MON[e.type].mimic);
  if (!blocking.length && state === "play" && form.rush <= 0 && !form.bossIntro && !form.flower) {
    if (form.rush !== -1) pops.push({ x: W / 2, y: BOX.y + BOX.h / 2, text: "WAVE CLEAR", color: C.yellow, t: 0, big: true });
    score += wave * 50;
    // のこった ゴースト・ネズミは どこかへ いく
    if (wave >= 15 && !soul.endingDone && Object.keys(soul.route).length >= 3) { startEnding(); return; }
    nextWave();
  }
}

function updateFormation(dt) {
  const fmE = enemies.filter(e => e.fm);
  if (!fmE.length) return;
  const inF = fmE.filter(e => !e.free);
  const alive = fmE.length;
  const speed = 10 + wave * 2 + (1 - alive / Math.max(1, form.total)) * 45;
  let dx = form.dir * speed * dt, dy = 0;
  if (inF.length) {
    let minX = Infinity, maxX = -Infinity;
    for (const e of inF) { minX = Math.min(minX, form.ox + e.fx); maxX = Math.max(maxX, form.ox + e.fx + e.w); }
    if ((form.dir > 0 && maxX + dx > BOX.x + BOX.w - 6) || (form.dir < 0 && minX + dx < BOX.x + 6)) { form.dir *= -1; dx = 0; dy = easy ? 5 : 8; }
  } else if (form.ox < BOX.x || form.ox > BOX.x + BOX.w - 60) form.dir *= -1;
  if (form.peace > 0) dy = 0;
  form.ox += dx; form.oy += dy;
  placeFormation();
  form.animT += dt;
  if (form.animT > Math.max(0.15, 0.6 - (1 - alive / Math.max(1, form.total)) * 0.4)) { form.animT = 0; form.anim ^= 1; }
  let maxY = -Infinity;
  for (const e of inF) maxY = Math.max(maxY, e.y + e.h);
  if (maxY >= soul.y - 2) { soul.hp = 0; die(); return; }
  // ワープネコが ばしょを いれかえる
  for (const e of inF) {
    if (MON[e.type].warp && Math.random() < dt * 0.35) {
      const o = pick(inF);
      if (o !== e) { [e.fx, o.fx] = [o.fx, e.fx]; [e.fy, o.fy] = [o.fy, e.fy]; e.flash = 0.08; SFX.warn();
        for (let i = 0; i < 6; i++) parts.push({ x: e.x + 6, y: e.y + 5, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 0.25, max: 0.25, delay: 0, color: C.yellow, s: 1 }); }
    }
  }
  placeFormation();
  // ツッコミドリが とびだす
  for (const e of inF) {
    if (MON[e.type].diver && !(form.peace > 0) && Math.random() < dt * (0.05 + wave * 0.008)) { e.free = true; e.dv = 1; SFX.warn(); }
  }
}

function updateFree(e, m, dt) {
  if (m.diver) {
    if (e.dv === 1) {
      e.y += 100 * dt;
      e.x += clamp(soul.x + 3 - (e.x + e.w / 2), -55 * dt, 55 * dt);
      if (e.y > BOX.y + BOX.h) { e.y = BOX.y - 12; e.dv = 2; }
    } else {
      const tx = form.ox + e.fx, ty = form.oy + e.fy, ddx = tx - e.x, ddy = ty - e.y, l = Math.hypot(ddx, ddy);
      if (l < 3) { e.free = false; e.dv = 0; }
      else { e.x += ddx / l * 110 * dt; e.y += ddy / l * 110 * dt; }
    }
  } else if (m.thief) {
    if (e.escape) { e.y -= 90 * dt; if (e.y < BOX.y - 10) e.dead = true; }
    else {
      e.y += 38 * dt; e.x += Math.sin(e.t * 3) * 50 * dt; e.x = clamp(e.x, BOX.x + 4, BOX.x + BOX.w - e.w - 4);
      if (e.y > BOX.y + BOX.h) e.dead = true;
    }
  } else if (m.mimic) {
    e.y += ((BOX.y + 60) - e.y) * Math.min(1, dt * 2);
    e.x += clamp(soul.x + 3 - (e.x + e.w / 2), -32 * dt, 32 * dt);
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.atkT = Math.max(0.6, 1.1 - wave * 0.02);
      const bx = e.x + e.w / 2, by = e.y + e.h;
      for (const a of [-0.25, 0.25]) {
        const ax = soul.x + 3.5 - bx, ay = soul.y - by, l = Math.hypot(ax, ay) || 1, ang = Math.atan2(ay, ax) + a;
        ebul.push({ x: bx, y: by, vx: Math.cos(ang) * 85, vy: Math.sin(ang) * 85, dmg: 4, c: "w", shape: "tooth", w: 3, h: 4 });
        void l;
      }
      SFX.chomp();
    }
  } else if (m.dummy) {
    if (!e.angry) { e.y = e.baseY + Math.sin(e.t * 2) * 1; return; }
    e.x += Math.sin(e.t * 1.3) * 40 * dt; e.x = clamp(e.x, BOX.x + 4, BOX.x + BOX.w - e.w - 4);
    e.y = e.baseY + Math.sin(e.t * 2) * 4;
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.atkT = 1.1;
      const bx = e.x + e.w / 2, by = e.y + e.h;
      for (const a of [-0.5, -0.25, 0, 0.25, 0.5]) ebul.push({ x: bx, y: by, vx: Math.sin(a) * 80, vy: Math.cos(a) * 80, dmg: 4, c: "w", shape: "dot", w: 3, h: 3 });
    }
  } else if (m.ghost && !m.flower) {
    e.x = e.cx + Math.sin(e.t * 0.8) * 70; e.y = BOX.y + 120 + Math.sin(e.t * 1.7) * 10;
    e.life -= dt;
    if (e.life <= 0) { e.dead = true; fadeOut(e, C.gray); pops.push({ x: e.x + 6, y: e.y - 8, text: "…", color: C.gray, t: 0 }); }
  } else if (m.flower) updateFlower(e, dt);
  else if (m.boss) updateBoss(e, m, dt);
}

// みのがした ボスたちが てつだってくれる
function updateFriends(dt) {
  if (!soul.friends.length) return;
  soul.friendT += dt;
  if (soul.friends.includes("bones") && soul.friendT % 10 < dt) {
    const targets = enemies.filter(e => !e.dead && !e.dying && !e.spare && !MON[e.type].ghost && !MON[e.type].boss);
    if (targets.length) {
      const t = pick(targets), x0 = t.x + t.w / 2;
      for (const dx of [-8, 0, 8]) shots.push({ x: clamp(x0 + dx, BOX.x + 4, BOX.x + BOX.w - 4), y: BOX.y + BOX.h - 6, vx: 0, dmg: atk() + 2, pierce: true, hit: [], ally: true });
      SFX.guard();
      pops.push({ x: x0, y: BOX.y + BOX.h - 26, text: "ボーンズ！", color: C.white, t: 0 });
    }
  }
  if (soul.friends.includes("cloud") && (soul.friendT + 5) % 14 < dt && soul.hp < soul.maxHp) {
    soul.hp = Math.min(soul.maxHp, soul.hp + 3); SFX.heal();
    pops.push({ x: soul.x + 3, y: soul.y - 14, text: "ショボンの あめ +3", color: C.blue, t: 0 });
    for (let i = 0; i < 14; i++) parts.push({ x: soul.x - 14 + Math.random() * 34, y: soul.y - 40 - Math.random() * 20, vx: -4, vy: 90, life: 0.45, max: 0.45, delay: 0, color: C.blue, s: 1 });
  }
}

function spawnGhost() {
  const e = mkEnemy(11, W / 2, BOX.y + 120, { free: true, fm: false, spare: true, cx: W / 2 - 6, life: 16 });
  enemies.push(e);
  pops.push({ x: W / 2, y: BOX.y + 100, text: "まよいゴーストが あらわれた", color: C.yellow, t: -0.6 });
}
function spawnDummy() {
  const e = mkEnemy(17, BOX.x + 30 + Math.random() * (BOX.w - 72), BOX.y + 150, { free: true, fm: false, spare: true, hits: 0, atkT: 1 });
  e.hp = 12 + wave; e.baseY = e.y;
  enemies.push(e);
  pops.push({ x: e.x + 6, y: e.y - 14, text: "わらにんぎょうは なにも しない", color: C.yellow, t: -0.3 });
}
function spawnThief() {
  const e = mkEnemy(9, BOX.x + 20 + Math.random() * (BOX.w - 50), BOX.y + 2, { free: true, fm: false, loot: 0 });
  e.hp = 3 + Math.floor(wave / 4);
  enemies.push(e);
  pops.push({ x: e.x + 5, y: e.y + 14, text: "どろぼう！", color: C.gold, t: -0.3 });
}
function steal(e) {
  if (e.escape) return;
  const n = Math.max(soul.gold > 0 ? 1 : 0, Math.floor(soul.gold * 0.25));
  soul.gold -= n; e.loot += n; e.escape = true;
  SFX.steal(); soul.inv = 0.6;
  pops.push({ x: soul.x + 3, y: soul.y - 14, text: n ? "-" + n + "G" : "…", color: C.gold, t: 0 });
}
function pickup(it) {
  if (it.kind === "coin") {
    const g = it.v * (armor().goldX || 1);
    soul.gold += g; SFX.coin();
    pops.push({ x: soul.x + 3, y: soul.y - 10, text: "+" + g + "G", color: C.gold, t: 0 });
  } else if (soul.bag.length < INV_MAX) {
    soul.bag.push("candy"); SFX.coin();
    pops.push({ x: soul.x + 3, y: soul.y - 10, text: "GET!", color: C.pink, t: 0 });
  } else {
    const before = soul.hp; soul.hp = Math.min(soul.maxHp, soul.hp + 10); SFX.heal();
    pops.push({ x: soul.x + 3, y: soul.y - 10, text: "+" + (soul.hp - before), color: C.green, t: 0 });
  }
}

function enemyFire(e) {
  const m = MON[e.type];
  const bx = e.x + e.w / 2, by = e.y + e.h;
  const sp = (70 + wave * 4) * (easy ? 0.8 : 1);
  const dmg = 3 + Math.min(3, Math.floor(e.type / 2)) + Math.floor(wave / 4);
  const dot = (vx, vy, c = "w") => ebul.push({ x: bx, y: by, vx, vy, dmg, c, shape: "dot", w: 3, h: 3 });
  if (m.fire === "straight" || wave < 2) dot(0, sp);
  else if (m.fire === "aimed") {
    const ax = soul.x + 3.5 - bx, ay = soul.y - by, l = Math.hypot(ax, ay) || 1;
    dot(ax / l * sp, ay / l * sp);
  } else if (m.fire === "spread") for (const a of [-0.35, 0, 0.35]) dot(Math.sin(a) * sp, Math.cos(a) * sp);
  else if (m.fire === "blue") ebul.push({ x: bx, y: by, vx: 0, vy: sp * 0.8, dmg, c: "b", shape: "bone", w: 3, h: 12 });
  else if (m.fire === "orange") ebul.push({ x: bx, y: by, vx: 0, vy: sp * 0.8, dmg, c: "o", shape: "bone", w: 3, h: 12 });
  else if (m.fire === "ring") for (let i = 0; i < 6; i++) { const a = 0.35 + i * (Math.PI - 0.7) / 5; dot(Math.cos(a) * 45, Math.sin(a) * 45); }
}

function damageEnemy(e, dmg, silent) {
  const m = MON[e.type];
  if (m.dummy && e.spare) {
    e.hits++; e.flash = 0.12; e.shakeT = 0.25; SFX.hit();
    if (e.hits >= 4) {
      e.spare = false; e.angry = true; shake = 4; SFX.chomp();
      pops.push({ x: e.x + 6, y: e.y - 14, text: "わらにんぎょうは おこった！", color: C.red, t: 0 });
    }
    return;
  }
  if (m.boss && !e.offered && !e.refused && e.hp - dmg <= Math.floor(e.maxHp * 0.2)) {
    // ボスは たおれる まえに みのがしを もとめる
    e.hp = Math.floor(e.maxHp * 0.2); e.flash = 0.12; e.shakeT = 0.25;
    e.offered = true; e.spare = true; soul.hold = true; ebul = []; beams = []; e.reflect = false; soul.invert = false; form.dark = false;
    SFX.hit();
    startTalk(BOSS[m.boss].spare, e.id, "none");
    return;
  }
  e.hp -= dmg; e.flash = 0.12; e.shakeT = 0.25;
  pops.push({ x: e.x + e.w / 2, y: e.y - 6, text: String(dmg), color: C.red, t: 0 });
  for (let i = 0; i < 3; i++) parts.push({ x: e.x + e.w / 2, y: e.y + e.h, vx: (Math.random() - 0.5) * 60, vy: 20 + Math.random() * 40, life: 0.2, max: 0.2, delay: 0, color: C.yellow, s: 1 });
  if (e.hp > 0) { if (!silent) SFX.hit(); return; }
  if (m.boss) { e.hp = 0; e.dying = true; e.spare = false; soul.hold = false; ebul = []; beams = []; startTalk(BOSS[m.boss].killed, e.id, "bossDust"); return; }
  killEnemy(e);
}

function killEnemy(e) {
  const m = MON[e.type], s = m.scale || 1;
  e.dead = true;
  // 撃破：上から下へ チリに なって きえる
  frameRows(e).forEach((r, j) => {
    for (let i = 0; i < r.length; i++) if (r[i] === "#") {
      parts.push({ x: e.x + i * s, y: e.y + j * s, vx: (Math.random() - 0.3) * 14, vy: -6 - Math.random() * 18,
        life: 0.6 + Math.random() * 0.6, max: 1.2, delay: j * 0.03 * (s > 1 ? 1.5 : 1), color: m.color || C.white, s });
    }
  });
  if (parts.length > 1200) parts.splice(0, parts.length - 1200); // スマホで おもく ならないように
  SFX.dust();
  score += m.pts * wave;
  soul.kills++; mem.totalKills = (mem.totalKills || 0) + 1;
  mem.defeated[e.type] = (mem.defeated[e.type] || 0) + 1;
  let g = rnd(m.gold[0], m.gold[1]) * (armor().goldX || 1);
  if (m.thief) g = e.loot + 10;
  if (g) { soul.gold += g; pops.push({ x: e.x + e.w / 2, y: e.y + 4, text: g + "G", color: C.gold, t: 0 }); }
  gainExp(m.exp);
  if (m.splits) {
    for (const off of [-5, 7]) {
      const c = mkEnemy(7, e.x + off, e.y + 3, { fx: e.fx + off, fy: e.fy + 3, free: e.free, dv: 0 });
      c.free = false; enemies.push(c); form.total++;
    }
  }
  if (m.mimic && Math.random() < 0.5) {
    const gear = gearPool();
    if (gear.length) { const rw = pick(gear); (rw.type === "weapon" ? soul.weapons : soul.armors).push(rw.key);
      pops.push({ x: e.x + 6, y: e.y - 10, text: stockData(rw).name, color: C.yellow, t: -0.3 }); }
  }
  if (!m.boss && Math.random() < 0.06) items.push({ kind: "candy", x: e.x + e.w / 2 - 3, y: e.y + 4 });
}

function gainExp(n) {
  soul.exp += n;
  while (soul.exp >= needExp(soul.lv)) {
    soul.lv++; soul.maxHp += 4; soul.hp = Math.min(soul.maxHp, soul.hp + 4);
    SFX.lvup();
    pops.push({ x: soul.x + 3, y: soul.y - 14, text: "LV UP", color: C.yellow, t: 0 });
  }
}

function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function hurt(dmg, raw) {
  if (soul.mirrorShield && !raw) {
    soul.mirrorShield = false; soul.inv = 1; SFX.guard();
    pops.push({ x: soul.x + 3, y: soul.y - 14, text: "かがみが まもった！", color: C.yellow, t: 0 });
    return;
  }
  vibrate(40); hurtT = 0.25;
  let d = raw ? dmg : Math.max(1, dmg - def());
  if (easy) d = Math.max(1, Math.ceil(d * 0.6));
  if (form && form.flower) { form.flowerHit = true; d = Math.min(d, soul.hp - 1); } // はじめは しなない
  soul.hp = Math.max(0, soul.hp - d);
  soul.inv = armor().inv || 1.0; shake = 4;
  SFX.hurt();
  if (soul.hp <= 0) die();
}

// ---------------- ボス ----------------
function bossPhase2(e) {
  const key = MON[e.type].boss;
  e.phase2 = true;
  if (key === "bones" || key === "mirror") { TBOX.w = 150; TBOX.x = W / 2 - 75; }
  if (key === "clock") { TBOX.w = 160; TBOX.x = W / 2 - 80; }
  if (key === "cloud") form.dark = true;
  if (key === "shadow" || key === "poko") { TBOX.w = 170; TBOX.x = W / 2 - 85; }
}

function updateBoss(e, m, dt) {
  const B = BOSS[m.boss];
  if (e.spare || e.refused || e.dying) { // みのがしを まっている / もう たたかう きが ない → うごかない
    e.x += (W / 2 - e.w / 2 - e.x) * Math.min(1, dt * 2);
    return;
  }
  const range = Math.max(0, BOX.w / 2 - e.w / 2 - 8);
  e.x = e.cx - e.w / 2 + Math.sin(e.t * 0.6) * range;
  e.y = BOX.y + 16 + Math.sin(e.t * 1.3) * 3;
  if (!e.phase2 && e.hp <= e.maxHp * 0.55) { ebul = []; beams = []; e.reflect = false; soul.invert = false; startTalk(B.mid, e.id, "phase2"); return; }
  if (!e.pat || e.patT <= 0) {
    if (e.pat === "invert") soul.invert = false;
    e.reflect = false;
    const pats = (e.loop || 0) >= 1 && B.extra ? B.patterns.concat(B.extra) : B.patterns; // 2しゅうめからの あたらしい こうげき
    e.pi = ((e.pi == null ? -1 : e.pi) + 1) % pats.length;
    e.pat = pats[e.pi]; e.patT = 4.5; e.pt = 0; e.pa = 0;
    if (m.boss === "shadow" || m.boss === "poko") { // ボックスを もとに もどす
      if (e.phase2) { TBOX.w = 170; TBOX.x = W / 2 - 85; } else Object.assign(TBOX, BOX0);
    }
    if (e.pat === "memory") {
      e.pat = pick(["boneRain", "gapWall", "blueSweep", "rain", "bubbles", "spiral", "mirrorRain"]);
      pops.push({ x: W / 2, y: BOX.y + 110, text: "＊ たたかいの きおく…", color: C.white, t: -0.5 });
    }
    if (e.pat === "squeeze") { TBOX.w = 96; TBOX.x = W / 2 - 48; }
    if (e.pat === "invert") { soul.invert = true; pops.push({ x: W / 2, y: BOX.y + 120, text: "さかさま！", color: C.yellow, t: -0.5, big: true }); }
    if (e.pat === "reflect") { e.reflect = true; pops.push({ x: e.x + e.w / 2, y: e.y + e.h + 4, text: "はねかえす！", color: C.bOrange, t: -0.5 }); }
    if (e.pat === "boneRain" || e.pat === "rain") e.patT = 4;
  }
  e.patT -= dt; e.pt -= dt;
  if (m.boss === "shadow") { e.hx = e.hx || []; e.hx.push(Math.round(soul.x + 3.5)); if (e.hx.length > 50) e.hx.shift(); }
  const p2 = e.phase2, lp = e.loop || 0, sp = (1 + lp * 0.15) * (easy ? 0.82 : 1);
  const bx = e.x + e.w / 2, by = e.y + e.h;
  const bone = (x, y, vx, vy, c = "w", h = 10) => ebul.push({ x, y, vx, vy, dmg: 4 + lp, c, shape: "bone", w: 3, h });
  const dot = (x, y, vx, vy, c = "w") => ebul.push({ x, y, vx, vy, dmg: 4 + lp, c, shape: "dot", w: 3, h: 3 });
  const beam = (x, w = 12) => { beams.push({ x, w, warn: 0.75, dur: 0.35, t: 0, dmg: 6 + lp }); SFX.warn(); };
  const L = BOX.x + 4, R = BOX.x + BOX.w - 4;
  if (e.pt > 0) return;
  switch (e.pat) {
    case "boneRain": e.pt = p2 ? 0.11 : 0.16; bone(L + Math.random() * (R - L), BOX.y + 4, 0, (90 + wave) * sp); break;
    case "gapWall": {
      e.pt = p2 ? 1.25 : 1.5;
      const gw = p2 ? 22 : 28, gc = L + gw / 2 + Math.random() * (R - L - gw);
      for (let x = L; x <= R; x += 7) if (Math.abs(x - gc) > gw / 2) bone(x, BOX.y + 6, 0, 70 * sp);
      break;
    }
    case "blueSweep": {
      e.pt = 1.4; e.pa ^= 1;
      const c = p2 && Math.random() < 0.5 ? "o" : "b";
      const fromL = Math.random() < 0.5;
      bone(fromL ? L : R, soul.y + 3, (fromL ? 1 : -1) * 105 * sp, 0, c, 28);
      break;
    }
    case "beam": e.pt = p2 ? 0.7 : 0.9; beam(soul.x + 3.5); if (p2) beam(L + Math.random() * (R - L)); break;
    case "rain": e.pt = 0.05; ebul.push({ x: L + Math.random() * (R - L + 30), y: BOX.y + 4, vx: -22, vy: 150 * sp, dmg: 3 + lp, c: "w", shape: "drop", w: 1, h: 4 }); break;
    case "lightning": e.pt = 1.0; beam(soul.x + 3.5, 8); beam(L + Math.random() * (R - L), 8); if (p2) beam(L + Math.random() * (R - L), 8); break;
    case "bubbles": e.pt = p2 ? 0.35 : 0.5; ebul.push({ x: bx, y: by, vx: (Math.random() - 0.5) * 100, vy: 45 * sp, dmg: 4 + lp, c: "o", shape: "bubble", w: 7, h: 7, bounce: true }); break;
    case "spiral": {
      e.pt = 0.07; e.pa += 0.45;
      for (const k of p2 ? [0, Math.PI] : [0]) dot(bx, by - 8, Math.cos(e.pa + k) * 75 * sp, Math.abs(Math.sin(e.pa + k)) * 75 * sp + 15);
      break;
    }
    case "invert": e.pt = 0.55; for (let i = 0; i < 3; i++) dot(L + Math.random() * (R - L), BOX.y + 6, 0, 80 * sp); break;
    case "reflect": e.pt = 0.9; dot(bx, by, 0, 90 * sp); break;
    case "pendulum": { // ふりこ
      e.pt = p2 ? 0.06 : 0.08;
      const px = W / 2 + Math.sin(e.t * 2.4) * (BOX.w / 2 - 14);
      dot(px, BOX.y + 40, 0, 95 * sp, p2 && Math.sin(e.t * 2.4) > 0.8 ? "b" : "w");
      break;
    }
    case "timeStop": { // とまって、いっせいに とんでくる
      e.pt = p2 ? 1.0 : 1.3;
      for (let i = 0; i < 10; i++) {
        const a = 0.3 + i * (Math.PI - 0.6) / 9;
        ebul.push({ x: bx, y: by, vx: Math.cos(a) * 120 * sp, vy: Math.sin(a) * 120 * sp, dmg: 4 + lp, c: "w", shape: "dot", w: 3, h: 3, stopT: 0.55, goT: 0.6 });
      }
      SFX.warn();
      break;
    }
    case "tickRain": { // チク・タクに あわせて れつが ふる
      e.pt = p2 ? 0.5 : 0.65;
      tone((e.pa ^= 1) ? 1500 : 1100, 0.03, "square", 0.03);
      const g1 = L + Math.random() * (R - L), g2 = L + Math.random() * (R - L);
      for (let x = L; x <= R; x += 9) if (Math.abs(x - g1) > 13 && Math.abs(x - g2) > 13) dot(x, BOX.y + 6, 0, 110 * sp);
      break;
    }
    case "boneStairs": { // かいだんじょうに ふってくる
      e.pt = 0.09;
      e.pa = (e.pa || 0) + 1;
      const n = 14, k = e.pa % (n * 2), idx = k < n ? k : n * 2 - k;
      bone(L + (R - L) * idx / n, BOX.y + 4, 0, 120 * sp);
      break;
    }
    case "hail": e.pt = p2 ? 0.45 : 0.6; ebul.push({ x: L + Math.random() * (R - L), y: BOX.y + 4, vx: 0, vy: 70 * sp, dmg: 4 + lp, c: "w", shape: "bubble", w: 7, h: 7, split: BOX.y + 120 + Math.random() * 60, sp, sd: 3 + lp }); break;
    case "crossBeams": e.pt = 1.1; beam(soul.x + 3.5, 10); beam(W - (soul.x + 3.5), 10); break;
    case "echo": { // すこし まえの あなたの いちに ふってくる
      e.pt = p2 ? 0.16 : 0.22;
      const x = e.hx && e.hx.length ? e.hx[0] : soul.x + 3.5;
      ebul.push({ x: x + (Math.random() - 0.5) * 6, y: BOX.y + 4, vx: 0, vy: 150 * sp, dmg: 5, c: "w", shape: "heart", w: 5, h: 4 });
      break;
    }
    case "heartRing": {
      e.pt = p2 ? 0.7 : 0.95; e.pa += 0.3;
      for (let i = 0; i < 9; i++) { const a = e.pa + i * Math.PI * 2 / 9; ebul.push({ x: bx, y: by - 10, vx: Math.cos(a) * 55 * sp, vy: Math.sin(a) * 55 * sp + 25, dmg: 5, c: "w", shape: "heart", w: 5, h: 4 }); }
      break;
    }
    case "squeeze": e.pt = 0.5; for (const k of [-1, 1]) dot(W / 2 + k * (10 + Math.random() * 30), BOX.y + 6, 0, 90 * sp, Math.random() < 0.3 ? "b" : "w"); break;
    case "coinRain": {
      e.pt = p2 ? 0.1 : 0.14;
      const x = L + Math.random() * (R - L);
      if (Math.random() < 0.15) items.push({ kind: "coin", x, y: BOX.y + 2, v: rnd(2, 4), sway: Math.random() * 6 });
      else ebul.push({ x, y: BOX.y + 4, vx: 0, vy: 100 * sp, dmg: 4, c: "w", shape: "coin", w: 5, h: 5 });
      break;
    }
    case "itemThrow": {
      e.pt = p2 ? 0.5 : 0.7;
      const tx = soul.x + 3.5 + (Math.random() - 0.5) * 40, t = 1.3;
      ebul.push({ x: bx, y: by, vx: (tx - bx) / t, vy: (soul.y - by) / t - 100 * t * 0.5, ay: 100, dmg: 5, c: "w", shape: "candy", w: 7, h: 3 });
      break;
    }
    case "mirrorRain": {
      e.pt = p2 ? 0.22 : 0.3;
      const x = L + Math.random() * (R - L) / 2;
      bone(x, BOX.y + 4, 0, 85 * sp); bone(R - (x - L), BOX.y + 4, 0, 85 * sp, Math.random() < 0.3 ? "b" : "w");
      break;
    }
  }
}

// ---------------- エンディング（3たいの ボスを どう したかで かわる） ----------------
function startEnding() {
  const r = soul.route, vals = ["bones", "cloud", "mirror"].map(k => r[k]);
  const kind = vals.every(v => v === "spared") ? "pacifist" : vals.every(v => v === "killed") ? "genocide" : "neutral";
  let pages;
  if (kind === "pacifist") pages = [
    { t: "＊ …あれ？\n＊ モンスターの けはいが しない。" },
    { who: 12, t: "よう。\nみんなで きてやったぜ。" },
    { who: 13, t: "…きょうは はれてるね。\nあなたの おかげ。" },
    { who: 14, t: "あなたの ソウル、\nいちばん うつくしかったわ。" },
    { who: "keeper", t: "＊ おつかれさま！\n＊ きょうは おみせを しめて\n　 パーティー だよ！" },
    { big: "THE END", t: "＊ あなたは だれも\n　 きずつけなかった。" },
    { t: "＊ …でも モンスターは\n　 まだ やってくる。\n＊ みんなの おもいが ちからに なる。(HP+20)" },
  ];
  else if (kind === "genocide") pages = [
    { t: "＊ ……………" },
    { t: "＊ だれも いなくなった。" },
    { t: "＊ よろずやの あかりも\n　 きえている。" },
    { big: "THE END", red: true, t: "＊ あなたの LV は " + soul.lv + "。\n＊ LV は「LOVE」の りゃく。" },
    { red: true, t: "＊ …まだ つづけるの？" },
  ];
  else pages = [
    { t: "＊ プルルルル…\n＊ プルルルル…" },
    { who: "keeper", t: "＊ もしもし？ ポコだよ。\n＊ あんたの うわさ、\n　 いろいろ きこえてくるよ。" },
    ...["bones", "cloud", "mirror"].map(k => ({ who: "keeper", t: "＊ " + MON[T.boss[["bones", "cloud", "mirror"].indexOf(k)]].name + "は… " +
      (r[k] === "spared" ? "\n　 げんきに してるって。\n　 あんたに よろしくってさ。" : "\n　 …もう いないんだってね。") })),
    { who: "keeper", t: "＊ …ま、あんたの じんせいだ。\n＊ すきに いきな。\n＊ これ、せんべつ。(+100G)" },
    { big: "THE END?", t: "＊ たたかいは つづく。" },
  ];
  setState("ending");
  ui = { ending: kind, pages, i: 0 };
  say(pages[0].t);
  mem.endings[kind] = (mem.endings[kind] || 0) + 1;
  if (kind === "genocide") mem.genocide = true;
  if (kind === "pacifist") mem.genocide = false;
  saveMem();
}
function endingTap() {
  if (!msg.done) { msg.shown = msgLen(); msg.done = true; return; }
  ui.i++;
  if (ui.i < ui.pages.length) { say(ui.pages[ui.i].t); SFX.blip(); return; }
  const kind = ui.ending;
  soul.endingDone = true;
  if (kind === "pacifist") { soul.maxHp += 20; soul.hp = soul.maxHp; SFX.revive(); }
  if (kind === "neutral") { soul.gold += 100; SFX.coin(); }
  ui = null;
  nextWave();
}
function drawEnding() {
  const pg = ui.pages[ui.i];

    // みんな ならんで ゆれている

}

// ---------------- しぬ・ふっかつ ----------------
function die() {
  setState("dying");
  vibrate([60, 40, 140]);
  mem.bestWave = Math.max(mem.bestWave || 0, wave); checkAch(); saveMem();
  ebul = []; shots = []; events = []; beams = [];
  soul.cracked = false; soul.shattered = false;
  if (score > hi) { hi = score; store.set("hi", hi); }
}

function updateDying() {
  if (stateT > 0.6 && !soul.cracked) { soul.cracked = true; SFX.crack(); }
  if (stateT > 1.6 && !soul.shattered) {
    soul.shattered = true; SFX.shatter();
    for (let i = 0; i < 6; i++) {
      parts.push({ x: soul.x + 3, y: soul.y + 2, vx: (Math.random() - 0.5) * 90, vy: -40 - Math.random() * 60, g: 160,
        life: 2.5, max: 2.5, delay: 0, color: C.red, s: 2, shard: true });
    }
  }
  if (stateT > 2.6) {
    // いちどだけ、くだけた ソウルが もとに もどる（ウェーブ3 から）
    if (!soul.revived && wave >= 3) {
      soul.revived = true;
      setState("revive");
      say("＊ …だめだ。\n＊ まだ たおれる わけには\n　 いかない！");
      return;
    }
    mem.deaths++; saveMem();
    clearRun();
    setState("over");
    say(mem.deaths >= 5 ? "＊ …まだ やるの？\n＊ いいね。その ケツイ。"

function drawField() {
  ctx.save();
  ctx.beginPath(); ctx.rect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4); ctx.clip();

  for (const ev of events) {
    const bob = Math.round(Math.sin(time * 3 + ev.bob) * 1);

      spr(SPR.tent, ev.x, ev.y + bob);
      ctx.fillStyle = C.orange; ctx.fillRect(Math.round(ev.x) + 6, Math.round(ev.y) + bob - 3, 3, 2);
      txt("SHOP", ev.x + ev.w / 2, ev.y + ev.h + 1 + bob, 8, C.orange, "center");
    } else if (ev.kind === "save") {
      spr(Math.floor(time * 4) % 2 ? SPR.star : SPR.starW, ev.x, ev.y + bob);
    } else {
      spr(SPR.chest, ev.x, ev.y + bob);
      if (Math.floor(time * 4) % 2) { ctx.fillStyle = C.white; ctx.fillRect(Math.round(ev.x) + 11, Math.round(ev.y) + bob + 1, 1, 1); }
    }
  }

  const showEnemies = state !== "intro" || form.appear > 0;
  if (showEnemies) {
    for (const e of enemies) {
      const m = MON[e.type], set = SPR.mon[e.type], fr = frameOf(e);
      ctx.globalAlpha = state === "intro" ? form.appear : m.ghost ? 0.75 : 1;
      const img = e.flash > 0 ? set.red[fr] : (e.spare ? set.yellow[fr] : set.base[fr]);
      const ox = e.shakeT > 0 ? Math.round(Math.sin(e.shakeT * 60) * 2) : 0;
      const oy = form.peace > 0 && e.fm && !e.free ? Math.round(Math.sin(time * 6 + e.fx * 0.2) * 3) : 0; // おどり
      spr(img, e.x + ox, e.y + oy, m.scale || 1);
      if (m.thief) txt(e.loot ? e.loot + "G" : "G", e.x + e.w / 2, e.y - 9, 8, C.gold, "center");
      if (e.chatT > 0 && state === "play") {
        ctx.font = `7px ${FONT}`;
        const tw = Math.ceil(ctx.measureText(e.chat).width) + 6, bx = Math.round(clamp(e.x + e.w / 2 - tw / 2, BOX.x + 3, BOX.x + BOX.w - tw - 3)), by = Math.round(e.y - 12);
        ctx.fillStyle = C.white; ctx.fillRect(bx, by, tw, 10);
        txt(e.chat, bx + 3, by + 1, 7, C.black);
      }
      if (m.boss && !e.dying) {
        // HPバー
        const bw = 60, bx = e.x + e.w / 2 - bw / 2, by = e.y - 7;
        ctx.fillStyle = C.hpRed; ctx.fillRect(bx, by, bw, 3);
        ctx.fillStyle = C.green; ctx.fillRect(bx, by, bw * Math.max(0, e.hp) / e.maxHp, 3);
      }
    }
    ctx.globalAlpha = 1;
  }

  // まっくら：ソウルの まわり だけ みえる
  if (form.dark && state !== "intro") {
    ctx.fillStyle = "rgba(0,0,0,0.97)";
    ctx.beginPath();
    ctx.rect(BOX.x, BOX.y, BOX.w, BOX.h);
    ctx.arc(soul.x + 3.5, soul.y + 3, 30 + Math.sin(time * 5) * 1.5, 0, Math.PI * 2, true);
    ctx.fill();
  }

  if (state === "intro") drawMsg(BOX.x + 10, BOX.y + BOX.h - 78, 12);
  if (form.glitch > 0) {
    for (let i = 0; i < 14; i++) {
      ctx.fillStyle = pick([C.red, C.blue, C.white, C.green, C.yellow]);
      ctx.globalAlpha = 0.6;
      ctx.fillRect(BOX.x + Math.random() * BOX.w, BOX.y + Math.random() * BOX.h, 4 + Math.random() * 60, 1 + Math.random() * 4);
    }
    ctx.globalAlpha = 1;
    txt(pick(["ERROR", "ＥＲＲ", "?????", "ケツイ"]), BOX.x + 20 + Math.random() * 120, BOX.y + 40 + Math.random() * 180, 12, C.red);
  }

  // ビーム
  for (const bm of beams) {
    if (!bm.fired) {
      if (Math.floor(bm.t * 12) % 2 === 0) {
        ctx.fillStyle = C.red;
        for (let y = BOX.y + 4; y < BOX.y + BOX.h - 4; y += 6) { ctx.fillRect(Math.round(bm.x - bm.w / 2), y, 1, 3); ctx.fillRect(Math.round(bm.x + bm.w / 2), y, 1, 3); }
      }
    } else {
      const a = 1 - (bm.t - bm.warn) / bm.dur;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = C.white;
      ctx.fillRect(Math.round(bm.x - bm.w / 2), BOX.y + 2, bm.w, BOX.h - 4);
      ctx.globalAlpha = 1;
    }
  }

  for (const s of shots) {
    if (s.ally) { ctx.fillStyle = C.white; ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 10); ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y), 3, 2); ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) + 8, 3, 2); }
    else { ctx.fillStyle = C.yellow; ctx.fillRect(Math.round(s.x) - 0.5, Math.round(s.y), 1, 5); }
  }
  if (form.wind && (state === "play" || state === "intro")) {
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    for (let i = 0; i < 10; i++) {
      const y = BOX.y + 10 + ((i * 97) % (BOX.h - 20));
      const x = BOX.x + (((i * 53 + time * form.wind * 4) % BOX.w) + BOX.w) % BOX.w;
      ctx.fillRect(Math.round(x), y, 8, 1);
    }
  }
  if (soul.slowT > 0 && state === "play") { ctx.fillStyle = "rgba(40,80,255,0.08)"; ctx.fillRect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4); txt("ゆっくり " + Math.ceil(soul.slowT), BOX.x + BOX.w - 6, BOX.y + BOX.h - 14, 8, C.blue, "right"); }
  if (soul.mirrorShield && state === "play") { ctx.fillStyle = C.yellow; ctx.globalAlpha = 0.5 + Math.sin(time * 6) * 0.3; rectLine(Math.round(soul.x) - 3, Math.round(soul.y) - 3, 13, 12, C.yellow, 1); ctx.globalAlpha = 1; }
  for (const b of ebul) drawBullet(b);
  for (const it of items) spr(it.kind === "coin" ? SPR.coin : SPR.candy, it.x, it.y);

  drawSoul();

  for (const p of parts) {
    if (p.delay > 0) { ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); continue; }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / (p.shard ? 0.6 : p.max)));
    ctx.fillStyle = p.color;
    if (p.shard) { const x = Math.round(p.x), y = Math.round(p.y); ctx.fillRect(x, y, 2, 1); ctx.fillRect(x + 1, y + 1, 1, 2); }
    else ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  for (const p of pops) {
    if (p.t < 0) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
    txt(p.text, p.x, p.y, p.big ? 14 : 10, p.color, "center");
  }
  ctx.globalAlpha = 1;

  if (state === "talk") drawBubble();
  if (state === "revive") drawRevive();
}

function drawBullet(b) {
  const col = b.c === "b" ? C.blue : b.c === "o" ? C.bOrange : C.white;
  ctx.fillStyle = col;
  const x = Math.round(b.x), y = Math.round(b.y);
  switch (b.shape) {
    case "bone": {
      const hh = Math.floor(b.h / 2);
      ctx.fillRect(x, y - hh, 1, b.h);
      ctx.fillRect(x - 1, y - hh, 3, 2); ctx.fillRect(x - 1, y + hh - 2, 3, 2);
      break;
    }
    case "bubble":
      ctx.fillRect(x - 2, y - 3, 5, 1); ctx.fillRect(x - 2, y + 3, 5, 1); ctx.fillRect(x - 3, y - 2, 1, 5); ctx.fillRect(x + 3, y - 2, 1, 5);
      break;
    case "drop": ctx.fillRect(x, y - 2, 1, 4); break;
    case "tooth": ctx.fillRect(x - 1, y - 2, 3, 2); ctx.fillRect(x, y, 1, 2); break;
    case "heart": ctx.fillRect(x - 2, y - 2, 2, 1); ctx.fillRect(x + 1, y - 2, 2, 1); ctx.fillRect(x - 2, y - 1, 5, 1); ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y + 1, 1, 1); break;
    case "coin": spr(SPR.coin, x - 2, y - 2); break;
    case "candy": spr(SPR.candy, x - 3, y - 1); break;
    default: ctx.fillRect(x - 1, y - 1, 3, 3);
  }
}

function drawSoul() {
  if (!soul) return;
  if (state === "dying" || state === "revive") {
    if (state === "revive" && ui && ui.reviving) { spr(SPR.heart, soul.x, soul.y); return; }
    if (soul.shattered && state === "dying") return;
    if (soul.cracked || state === "revive") { spr(SPR.heartL, soul.x - 1, soul.y); spr(SPR.heartR, soul.x + 1, soul.y); }
    else spr(SPR.heart, soul.x, soul.y);
    return;
  }
  if (soul.starT > 0 && state === "play") { // ほしのかけら：ひかる
    ctx.fillStyle = Math.floor(time * 10) % 2 ? C.yellow : C.white;
    ctx.fillRect(Math.round(soul.x) - 2, Math.round(soul.y) + 2, 1, 1); ctx.fillRect(Math.round(soul.x) + 9, Math.round(soul.y) + 2, 1, 1);
    ctx.fillRect(Math.round(soul.x) + 3, Math.round(soul.y) - 3, 1, 1);
    spr(SPR.heart, soul.x, soul.y); return;
  }
  if (soul.inv > 0 && Math.floor(soul.inv * 12) % 2 === 0) return; // 無敵中は点滅
  spr(SPR.heart, soul.x, soul.y);
  if (soul.invert) txt("⇄", soul.x + 3.5, soul.y + 7, 8, C.yellow, "center");
}

function drawRevive() {
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4);
  drawSoul();
  drawMsg(BOX.x + 10, BOX.y + 90, 12);
  if (msg.done && Math.floor(time * 2) % 2 === 0) txt("[ タップ ]", W / 2, BOX.y + 170, 11, C.yellow, "center");
}

// ボスの ふきだし（しろい ふきだしに くろい もじ）
function drawBubble() {
  const e = enemies.find(x => x.id === (ui && ui.who));
  if (!e) return;
  // ボスの したに だす（しっぽは うえむき）
  const bw = 124, lines = msg.lines.length, bh = 12 + lines * 15;
  const ecx = e.x + e.w / 2;
  const bx = Math.round(clamp(ecx - bw / 2, BOX.x + 6, BOX.x + BOX.w - bw - 6));
  const by = Math.round(e.y + e.h + 10);
  ctx.fillStyle = C.white; ctx.fillRect(bx, by, bw, bh);
  for (let i = 0; i < 6; i++) ctx.fillRect(Math.round(ecx) - (5 - i), by - 6 + i, (5 - i) * 2 + 1, 1);
  drawMsg(bx + 7, by + 6, 10, C.black, 5);
  if (msg.done && Math.floor(time * 3) % 2) { ctx.fillStyle = C.black; ctx.fillRect(bx + bw - 9, by + bh - 7, 4, 2); ctx.fillRect(bx + bw - 8, by + bh - 5, 2, 2); }
}

// えらべる行を描く（カーソルには ハート）
function drawRows(rows) {
  let ai = 0;
  for (const r of rows) {
    if (!r.act) { txt(r.label, r.x, r.y, 10, C.gray); continue; }
    const sel = ai++ === ui.cursor;
    if (r.tab) {
      const col = r.on ? C.yellow : C.gray;
      rectLine(r.x, r.y - 2, r.w, r.h + 2, col, 1);
      txt(r.label, r.x + r.w / 2, r.y + 1, 10, col, "center");
      if (sel) spr(SPR.heart, r.x + 6, r.y + 4);
      continue;
    }
    const col = r.dim ? C.dim : sel ? C.yellow : C.white;
    if (sel) spr(SPR.heart, r.x, r.y + 4);
    txt(r.label, r.x + 12, r.y + 2, 11, col);
    if (r.right) txt(r.right, r.x + r.w, r.y + 2, 10, r.dim ? C.dim : C.gray, "right");
  }
}

function drawMsgArea() {
  const y = BOX0.y + BOX0.h - 62;
  ctx.fillStyle = C.white; ctx.fillRect(BOX0.x + 6, y, BOX0.w - 12, 1);
  drawMsg(BOX0.x + 10, y + 10, 11);
}

function drawMenu() {
  const x = BOX0.x + 10;
  if (ui.tab === "item") {
    txt("＊ アイテム  " + soul.bag.length + "/" + INV_MAX, x, BOX0.y + 8, 11);
  } else {
    txt("＊ そうび", x, BOX0.y + 8, 11);
    txt("LV " + soul.lv, x + 4, BOX0.y + 26, 10);
    txt("ATK " + atk(), x + 54, BOX0.y + 26, 10);
    txt("DEF " + def(), x + 114, BOX0.y + 26, 10);
    txt("EXP " + soul.exp + "  NEXT " + (needExp(soul.lv) - soul.exp), x + 4, BOX0.y + 41, 10, C.gray);
  }
  drawRows(layoutRows());
  drawMsgArea();
}

function drawShop() {
  if (ui.mood !== "empty") {
    const shiver = ui.mood === "scared" ? Math.round(Math.sin(time * 40)) : 0;
    spr(SPR.keeper, W / 2 - 24 + shiver, BOX0.y + 12 + Math.round(Math.sin(time * 2)), 3);
    txt("よろずや ポコ", W / 2, BOX0.y + 64, 10, C.gray, "center");
  } else {
    txt("（ だれも いない ）", W / 2, BOX0.y + 40, 10, C.dim, "center");
  }
  txt(soul.gold + "G", BOX0.x + BOX0.w - 12, BOX0.y + 84, 10, C.gold, "right");
  txt("もちもの " + soul.bag.length + "/" + INV_MAX, BOX0.x + 12, BOX0.y + 84, 10, C.gray);
  drawRows(layoutRows());
  drawMsgArea();
}

function drawChest() {
  const cx = W / 2 - 24, cy = BOX0.y + 70;
  if (ui.opened) {
    ctx.fillStyle = C.yellow;
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + time, r = 18 + (ui.openT * 30 % 20);
      ctx.fillRect(Math.round(W / 2 + Math.cos(a) * r), Math.round(cy + 8 + Math.sin(a) * r * 0.6), 1, 1);
    }
    spr(SPR.chestOpen, cx, cy, 4);
  } else {
    spr(SPR.chest, cx, cy + Math.round(Math.sin(time * 8) * (stateT < 0.5 ? 1 : 0)), 4);
  }
  if (msg.done && Math.floor(time * 2) % 2 === 0) {
    txt(ui.opened ? "[ タップで もどる ]" : "[ タップで あける ]", W / 2, BOX0.y + 150, 11, C.yellow, "center");
  }
  drawMsgArea();
}

function drawStatus() {
  const y = BOX0.y + BOX0.h + 10;
  txt("SOUL", 12, y, 10);
  txt("LV " + soul.lv, 50, y, 10);
  txt("HP", 90, y + 1, 8);
  const bw = Math.min(70, soul.maxHp * 1.4), filled = bw * soul.hp / soul.maxHp;
  ctx.fillStyle = C.hpRed; ctx.fillRect(106, y + 1, bw, 9);
  ctx.fillStyle = C.yellow; ctx.fillRect(106, y + 1, filled, 9);
  txt(soul.hp + " / " + soul.maxHp, 106 + bw + 6, y, 10);

  const usable = state === "play" || state === "menu";
  const canSpare = usable && spareables().length > 0;
  const active = state === "menu" ? (ui.tab === "item" ? 1 : 2) : 0;
  const blink = Math.floor(time * 3) % 2 === 0;
  CMD.forEach((l, i) => {
    const x = CMD_X0 + i * (CMD_W + CMD_GAP);
    let on = i === active, col = !usable ? C.dim : on ? C.yellow : C.orange;
    if (i === 3) col = canSpare ? (blink ? C.yellow : C.orange) : C.dim;
    if (i === 0 && soul.hold && state === "play") { col = blink ? C.yellow : C.orange; on = false; }
    rectLine(x, CMD_Y, CMD_W, CMD_H, col, 1);
    if (on && usable) spr(SPR.heart, x + 4, CMD_Y + 9);
    txt(l, x + (on && usable ? (CMD_W + 11) / 2 : CMD_W / 2), CMD_Y + 7, 9, col, "center");
  });
}

function drawMsg(x, y, size, color = C.white, gap = 6) {
  let left = msg.shown;
  msg.lines.forEach((line, i) => {
    const s = line.slice(0, Math.max(0, left));
    left -= line.length;
    txt(s, x, y + i * (size + gap), size, color);
  });
}

function drawOver() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.6));
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 1); ctx.fillRect(Math.round(p.x) + 1, Math.round(p.y) + 1, 1, 2);
  }
  ctx.globalAlpha = Math.min(1, stateT / 1.2);
  txt("GAME", W / 2, 90, 36, C.white, "center");
  txt("OVER", W / 2, 132, 36, C.white, "center");
  ctx.globalAlpha = 1;
  if (stateT > 1.2) { updateMsg(1 / 60); drawMsg(30, 210, 12); }
  if (stateT > 2.0) {
    txt("SCORE " + String(score).padStart(6, "0"), W / 2, 270, 10, C.white, "center");
    txt("HI    " + String(hi).padStart(6, "0"), W / 2, 286, 10, C.gray, "center");
    txt("WAVE " + wave + "  /  LV " + soul.lv + "  /  " + soul.gold + "G", W / 2, 302, 10, C.gray, "center");
    if (soul.spares || soul.bossKills) txt("みのがした " + soul.spares + "  /  たおした ボス " + soul.bossKills, W / 2, 318, 9, C.dim, "center");
  }
  if (stateT > 3.2 && Math.floor(time * 2) % 2 === 0) txt("[ タップで タイトルへ ]", W / 2, 346, 12, C.yellow, "center");
}

// ---------------- ループ ----------------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
// ホーム画面に おいたとき オフラインでも あそべるように
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
(document.fonts && document.fonts.load ? document.fonts.load(`12px "DotGothic16"`).catch(() => {}) : Promise.resolve())
  .finally(() => requestAnimationFrame(t => { last = t; loop(t); }));
</script>
</body>
</html>
