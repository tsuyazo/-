  cv.style.height = Math.floor(H * scale) + "px";

const memStored = store.get("mem", {});

const saveMem = () => store.set("mem", mem);

const ACH = [
  ["はじめの いっぽ", "はじめて あそんだ", m => m.runs >= 1],
  ["ケツイ", "はじめて たおれた", m => m.deaths >= 1],
  ["とおくまで", "WAVE 10 に とどいた", m => (m.bestWave || 0) >= 10],
  ["もっと とおくまで", "WAVE 30 に とどいた", m => (m.bestWave || 0) >= 30],
  ["やさしい ソウル", "10かい みのがした", m => (m.totalSpares || 0) >= 10],
  ["ほねの ともだち", "ボーンズを みのがした", m => m.spared.bones],
  ["ちりの やま", "1000たい たおした", m => (m.totalKills || 0) >= 1000],
  ["ときを こえて", "ホーホークロックに あった", m => m.met.clock],
  ["かくされた かげ", "かくしボスに あった", m => m.met.shadow || m.met.poko],
  ["やさしい みち", "やさしい エンディング", m => m.endings.pacifist],
  ["ちりの みち", "ちりの エンディング", m => m.endings.genocide],
  ["ずかん コンプリート", "すべての モンスターに あった", m => Object.keys(m.seen).length >= MON.length],

function checkAch(silent) {
  mem.ach = mem.ach || {};
  ACH.forEach(([name, , cond], i) => {
    if (!mem.ach[i] && cond(mem)) {
      mem.ach[i] = 1;
      if (!silent && typeof pops !== "undefined") { pops.push({ x: W / 2, y: BOX0.y + BOX0.h - 70, text: "しょうごう「" + name + "」", color: C.yellow, t: -1.2, big: true }); SFX.lvup(); }
    }
  });
}
// なんども あそんでいる ひとには ヒマワリンの はじめての えんしゅつを ださない
if (!mem.migFlower) { if ((memStored.runs || 0) > 1) mem.flower = true; mem.migFlower = true; saveMem(); }
// ヒマワリンの ばんごうが 20 → 21 に なった ときの ひっこし
if (!mem.mig21) {
  if (mem.seen[20] && !mem.met.clock) { delete mem.seen[20]; mem.seen[21] = 1; }
  mem.mig21 = true; saveMem();
}
// メタルふわりん（20）が はいって、20 いこうが 1つ ずれた ときの ひっこし
if (!mem.mig22) {
  for (const tbl of [mem.seen, mem.defeated]) {
    const moved = {};
    for (const k of Object.keys(tbl)) if (+k >= 20) { moved[+k + 1] = tbl[k]; delete tbl[k]; }
    Object.assign(tbl, moved);
  }
  mem.mig22 = true; saveMem();
}

function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
}
function tone(f, d, type = "square", v = 0.05, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
let noiseBuf = null;
function noise(d, v = 0.08, hp = 800) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = hp;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d);
}

const bgm = { song: null, step: 0, next: 0 };
function noteAt(t, n, d, type, v) {
  if (!n) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (n - 69) / 12);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function wantSong() {
  if (snd > 0 || paused || document.hidden) return null;
  switch (state) {
    case "title": return "title";
    case "shop": return ui && ui.mood === "empty" ? null : "shop";
    case "ending": return ui && ui.ending === "genocide" ? null : "happy";
    case "dying": case "over": case "revive": case "chest": return null;
  }
  if (enemies.some(e => MON[e.type].boss && !e.dead)) return "boss";
  if (form && form.peace > 0) return "happy";
  return "field";
}
setInterval(() => {
  if (!AC) return;
  const want = wantSong();
  if (want !== bgm.song) { bgm.song = want; bgm.step = 0; bgm.next = AC.currentTime + 0.08; }
  if (!want) return;
  const S = SONGS[want], dur = 60 / S.bpm / 2;
  if (bgm.next < AC.currentTime - 0.5) bgm.next = AC.currentTime + 0.05; // ながく とまっていたら やりなおす
  while (bgm.next < AC.currentTime + 0.25) {
    noteAt(bgm.next, S.mel[bgm.step % S.mel.length], dur * 0.9, S.lead, S.mv);
    noteAt(bgm.next, S.bass[bgm.step % S.bass.length], dur * 0.95, "triangle", S.bv);
    bgm.next += dur; bgm.step++;
  }
}, 50);

function makeSpriteC(rows, pal) {
  const w = Math.max(...rows.map(r => r.length));
  const c = document.createElement("canvas");
  c.width = w; c.height = rows.length;
  const x = c.getContext("2d");
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (pal[r[i]]) { x.fillStyle = pal[r[i]]; x.fillRect(i, j, 1, 1); } });
  return c;
}

// ---------------- 描画ヘルパー ----------------
function txt(s, x, y, size = 10, color = C.white, align = "left") {
  if (typeof s === "string" && s[0] === "＊") s = s.replace(/^＊ ?/, "");
  ctx.font = `${size}px ${FONT}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "top";
  ctx.fillText(s, x, y);
}
function rectLine(x, y, w, h, color = C.white, lw = 2) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, lw); ctx.fillRect(x, y + h - lw, w, lw);
  ctx.fillRect(x, y, lw, h); ctx.fillRect(x + w - lw, y, lw, h);
}
function spr(img, x, y, s = 1) { ctx.drawImage(img, Math.round(x), Math.round(y), img.width * s, img.height * s); }
const emberSpr = () => SPR.ember[Math.floor(time * 6) % 2];
const cursorAt = (x, y) => spr(SPR.cursor, x + (Math.floor(time * 3) % 2), y);
// ななめの おび（Persona 風）
function slant(x, y, w, h, col, sk = 5) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + sk, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w - sk, y + h); ctx.lineTo(x, y + h);
  ctx.closePath(); ctx.fill();
}

function unlockedTypes(w) {
  const t = [0, 1, 2];
  if (w >= 2) t.push(5);
  if (w >= 3) t.push(3);
  if (w >= 4) t.push(6);
  if (w >= 6) t.push(4);
  if (w >= 7) t.push(8);
  if (w >= 8) t.push(15);
  if (w >= 9) t.push(16);
  return t;
}

function buildFormation(poolOverride) {
  const rows = Math.min(3 + Math.floor((wave - 1) / 2), 5), cols = 6;
  const gx = 30, gy = 22, fw = (cols - 1) * gx + 12;
  form.ox = BOX0.x + (BOX0.w - fw) / 2;
  const pool = poolOverride || unlockedTypes(wave);
  const rowTypes = [];
  for (let r = 0; r < rows; r++) {
    if (wave <= 1 && !poolOverride) rowTypes.push(r === 0 ? 2 : (r <= (rows - 1) / 2 ? 1 : 0));
    else rowTypes.push(pick(pool));
  }
  const nt = poolOverride ? null : NEW_TYPE[wave] ? NEW_TYPE[wave].type : null;
  if (nt != null && !rowTypes.includes(nt)) rowTypes[Math.floor(rows / 2)] = nt;
  // たいれつの かたち（ウェーブ3から いろいろ）
  const shape = wave < 3 || nt != null ? "grid" : pick(rows >= 4 ? ["grid", "grid", "checker", "v", "pillars", "diamond"] : ["grid", "grid", "checker", "pillars"]);
  const keep = (r, c) => {
    switch (shape) {
      case "checker": return (r + c) % 2 === 0 || r === rows - 1;
      case "v": return Math.abs(c - 2.5) + 0.5 >= r * 0.7 || r === 0;
      case "pillars": return c <= 1 || c >= 4;
      case "diamond": return Math.abs(c - 2.5) + Math.abs(r - (rows - 1) / 2) <= 3;
      default: return true;
    }
  };
  form.shape = shape;
  rowTypes.forEach((type, r) => {
    for (let c = 0; c < cols; c++) {
      if (!keep(r, c)) continue;
      const m = MON[type];
      const e = mkEnemy(type, 0, 0, { fx: c * gx + (12 - m.w) / 2, fy: r * gy + (10 - m.h) / 2 });
      enemies.push(e);
    }
  });
  form.total = enemies.length;
  form.oyT = form.oy; form.oy -= 80; // うえから おりてくる
  placeFormation();
}

function mkEnemy(type, x, y, extra = {}) {
  const m = MON[type];
  if (!mem.seen[type]) { mem.seen[type] = 1; saveMem(); }
  const en = Object.assign({
    id: nextId++, type, x, y, w: m.w, h: m.h, hp: Math.round((m.hp + Math.floor((wave - 1) / (mode === "adv" ? 7 : 3))) * (mode === "adv" ? advHpMul() * advFallMul() : 1)), flash: 0, shakeT: 0,
    free: !m.fm, fm: !!m.fm, t: Math.random() * 10, fx: 0, fy: 0, dv: 0, guard: false, guardT: Math.random() * 1.2,
  }, extra);
  en.maxHp0 = en.hp;
  return en;
}

function placeFormation() {
  for (const e of enemies) if (e.fm && !e.free) { e.x = form.ox + e.fx; e.y = form.oy + e.fy; }
}

    for (let i = 0; i < n; i++) row.push({ r, i, x: (i + 1) / (n + 1) + (Math.random() - 0.5) * 0.06, kind: rollKind(r), next: [], done: false });
    rows.push(row);
  }
  for (let r = 0; r < ROWS - 1; r++) {
    const a = rows[r], b = rows[r + 1];
    for (const nd of a) {
      const near = b.map((m, j) => [Math.abs(m.x - nd.x), j]).sort((p, q) => p[0] - q[0]);
      nd.next.push(near[0][1]);
      if (near[1] && Math.random() < 0.5) nd.next.push(near[1][1]);
    }
    b.forEach((m, j) => { // だれからも いけない ノードを なくす
      if (!a.some(nd => nd.next.includes(j))) a[a.map((nd, q) => [Math.abs(nd.x - m.x), q]).sort((p, q) => p[0] - q[0])[0][1]].next.push(j);
    });
  }
  rows.push([{ r: ROWS, i: 0, x: 0.5, kind: "boss", next: [], done: false }]);
  for (const nd of rows[ROWS - 1]) nd.next = [0];
  return rows;
}

function mapKey(k) {

  if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown") {

// ---- ちほうの けしき（Hollow Knight／Octopath 風：うっすら とおくの けしき＋ふちを くらく）----
function drawScenery() {
  if (mode !== "adv" || !adv) return;
  const C0 = chapter(), ch = Math.min(adv.ch, CHAPTERS.length);
  const L = BOX.x + 2, T0 = BOX.y + 2, Wd = BOX.w - 4, Hd = BOX.h - 4;
  ctx.fillStyle = C0.bg; ctx.fillRect(L, T0, Wd, Hd);
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = C0.col;
  const seed = i => (Math.sin(i * 127.1 + ch * 31.7) * 43758.5453) % 1;
  const rnd01 = i => Math.abs(seed(i));
  switch (ch) {
    case 1: // もり：き の シルエット
      for (let i = 0; i < 9; i++) {
        const x = L + rnd01(i) * Wd, h = 40 + rnd01(i + 9) * 60, y = T0 + Hd - h;
        ctx.fillRect(Math.round(x), Math.round(y), 3, Math.round(h));
        for (let k = 0; k < 4; k++) ctx.fillRect(Math.round(x - 8 + k * 2), Math.round(y + k * 6), 19 - k * 4, 3);
      }
      break;
    case 2: // どうくつ：つらら と しずく
      for (let i = 0; i < 12; i++) { const x = L + rnd01(i) * Wd, h = 10 + rnd01(i + 3) * 30; for (let k = 0; k < h; k += 2) ctx.fillRect(Math.round(x + k / 6), T0 + k, Math.max(1, 5 - k / 8), 2); }
      for (let i = 0; i < 6; i++) { const x = L + rnd01(i + 40) * Wd, y = T0 + ((time * 50 + i * 47) % Hd); ctx.fillRect(Math.round(x), Math.round(y), 1, 3); }
      break;
    case 3: // さばく：さきゅう と たいよう
      for (let x = 0; x < Wd; x += 2) { const y = T0 + Hd - 30 - Math.sin(x / 30) * 10 - Math.sin(x / 13 + 1) * 4; ctx.fillRect(L + x, Math.round(y), 2, Math.round(T0 + Hd - y)); }
      for (let a = 0; a < 6.28; a += 0.4) ctx.fillRect(Math.round(L + Wd - 40 + Math.cos(a) * 14), Math.round(T0 + 40 + Math.sin(a) * 14), 2, 2);
      break;
    case 4: // とけいの まち：はぐるま
      for (let i = 0; i < 4; i++) {
        const cx = L + 30 + i * 55, cy = T0 + 60 + (i % 2) * 120, r = 16 + (i % 3) * 6, rot = time * (i % 2 ? 0.5 : -0.4);
        for (let k = 0; k < 10; k++) { const a = rot + k * 0.628; ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 3, 3); }
      }
      break;
    case 5: // ほのおの やま：のぼる ひのこ
      for (let x = 0; x < Wd; x += 3) { const y = T0 + Hd - 20 - Math.abs(Math.sin(x / 40)) * 40; ctx.fillRect(L + x, Math.round(y), 3, Math.round(T0 + Hd - y)); }
      for (let i = 0; i < 14; i++) { const x = L + rnd01(i) * Wd + Math.sin(time + i) * 6, y = T0 + Hd - ((time * 30 + i * 37) % Hd); ctx.fillRect(Math.round(x), Math.round(y), 2, 2); }
      break;
    case 6: // こおりの みずうみ：ゆき
      for (let i = 0; i < 24; i++) { const x = L + ((rnd01(i) * Wd + time * 8 + Math.sin(time + i) * 10) % Wd), y = T0 + ((time * 18 + i * 29) % Hd); ctx.fillRect(Math.round(x), Math.round(y), 2, 2); }
      ctx.fillRect(L, T0 + Hd - 12, Wd, 2);
      break;
    case 7: // ゆめの としょかん：うかぶ ほん
      for (let i = 0; i < 7; i++) { const x = L + rnd01(i) * (Wd - 16), y = T0 + 20 + rnd01(i + 7) * (Hd - 60) + Math.sin(time * 1.3 + i) * 6; ctx.fillRect(Math.round(x), Math.round(y), 14, 10); ctx.fillStyle = C0.bg; ctx.fillRect(Math.round(x + 6), Math.round(y), 2, 10); ctx.fillStyle = C0.col; }
      break;
    default: // ほしの はて：またたく ほし
      for (let i = 0; i < 40; i++) { if ((Math.sin(time * 3 + i) + 1) > 1.2) ctx.fillRect(Math.round(L + rnd01(i) * Wd), Math.round(T0 + rnd01(i + 50) * Hd), 1, 1); }
  }
  ctx.globalAlpha = 1;
  // ふちを くらく（ビネット）
  const g = ctx.createRadialGradient(BOX.x + BOX.w / 2, BOX.y + BOX.h / 2, BOX.h * 0.3, BOX.x + BOX.w / 2, BOX.y + BOX.h / 2, BOX.h * 0.75);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = g; ctx.fillRect(L, T0, Wd, Hd);
}

  if (state === "menu" || state === "shop" || state === "rest" || state === "event" || state === "boon" || state === "journal") { tapRows(p); return; }

window.addEventListener("keydown", e => {
  audio();

  if (k === "m" || k === "M") { cycleSound(); return; }
  if (e.repeat && !k.startsWith("Arrow")) return;
  const ok = ["z", "Z", "Enter", " "].includes(k), back = ["x", "X", "Escape"].includes(k);
  if (paused) { if (ok || k === "p" || k === "P") pausedTap(null); return; }
  if ((k === "p" || k === "P") && SAVEABLE.includes(state)) { pauseGame(); return; }
  if (state === "title" && titleView !== "main") {
    if (k === "ArrowLeft" || k === "ArrowRight") {
      if (titleView !== "zukan") { const v = ["records", "zukan", "ach"]; titleView = v[(v.indexOf(titleView) + (k === "ArrowLeft" ? 2 : 1)) % 3]; zukanSel = Math.max(0, zukanSel); }

      zukanSel = clamp(Math.max(0, zukanSel) + (k === "ArrowUp" ? -5 : 5), 0, MON.length - 1); zukanPage = Math.floor(zukanSel / ZK.per); SFX.move();
    } else if (ok || back) { titleView = "main"; SFX.cancel(); }
    return;
  }
  if (state === "title" && (k === "ArrowUp" || k === "ArrowDown")) { titleSel ^= 1; SFX.move(); return; }
  if (/^[1-4]$/.test(k) && (state === "play" || state === "menu" || state === "map")) { pressCmd(+k - 1); return; }
  if (state === "map") { mapKey(k); return; }
  if (state === "menu" || state === "shop" || state === "rest" || state === "event" || state === "boon" || state === "journal") {
    const rows = layoutRows().filter(r => r.act);
    if (k === "ArrowUp" || k === "ArrowDown") {
      if (rows.length) { ui.cursor = (ui.cursor + (k === "ArrowUp" ? -1 : 1) + rows.length) % rows.length; SFX.move(); menuHint(); }

      const subs = ["weapon", "armor", "chip", "pal"]; ui.sub = subs[(subs.indexOf(ui.sub) + (k === "ArrowLeft" ? 3 : 1)) % 4]; ui.cursor = 0; ui.page = 0; SFX.move();
    } else if (ok) {

  if (ok) confirmTap(null);
  if ((k === "c" || k === "C" || back) && state === "play") openMenu("item");
});

// ---------------- みのがす ----------------
function doSpare() {
  if (form && form.peace > 0) {
    const n = dismissFormation(C.yellow, "みんな うれしそうに かえっていった", C.yellow);
    soul.spares++; mem.totalSpares = (mem.totalSpares || 0) + 1; dailyProgress("spare"); SFX.spare();

    const key = pick(["candy", "pie", "smoke", "bomb"]);

    soul.gold += g;

  }

  for (const e of list) {
    const m = MON[e.type];

    // まよいゴースト・わらにんぎょう

    fadeOut(e, C.yellow);
    const key = pick(["candy", "pie", "smoke"]);
    if (soul.bag.length < INV_MAX) { soul.bag.push(key); pops.push({ x: e.x + 6, y: e.y - 8, text: ITEMS[key].name, color: C.yellow, t: 0 }); }
    else { soul.gold += 10; pops.push({ x: e.x + 6, y: e.y - 8, text: "+10G", color: C.gold, t: 0 }); }
  }
  enemies = enemies.filter(e => !e.dead);
}
// おどりの ウェーブを おわらせる（みのがした／じかんぎれ）
function dismissFormation(color, text, textColor) {
  const fm = enemies.filter(e => e.fm);
  for (const e of fm) { e.dead = true; fadeOut(e, color); }
  enemies = enemies.filter(e => !e.dead);

function fadeOut(e, color) {

  } });
}

// ---------------- かいわ（Undertale の ふきだし） ----------------
function startTalk(lines, who, after) {
  // メニューや おみせの なかでは はじめない。もどってから はなす
  if (state === "menu" || state === "shop" || state === "chest" || state === "savept") { form.pendingTalk = { lines, who, after }; return; }

function talkTap() {

  if (ui.i < ui.talk.length) { say(ui.talk[ui.i]); return; }
  const { who, after } = ui;
  ui = null; setState("play");
  const e = enemies.find(x => x.id === who);
  if (!e) return;
  const m = MON[e.type], key = m.boss;
  if (after === "flowerLeave") {
    e.dead = true; fadeOut(e, C.gold); SFX.spare();
    enemies = enemies.filter(x => !x.dead);
    mem.flower = true; saveMem();
    soul.hold = false; soul.hp = soul.maxHp; form.flower = 0;
    if (mode === "adv") showStory(1, CHAPTERS[0].intro); else nextWave();
    return;
  }
  if (after === "phase2") bossPhase2(e);
  else if (after === "bossDust") {
    killEnemy(e); soul.bossKills++; if (key !== "giant") soul.route[key] = "killed";
    if (key === "giant") { const c = giveChip(); if (c) pops.push({ x: W / 2, y: BOX0.y + 110, text: "チップ「" + CHIPS[c].n + "」", color: C.yellow, t: -0.8 }); }

    enemies = enemies.filter(x => !x.dead);
    Object.assign(TBOX, BOX0); soul.invert = false; form.dark = false;
  } else if (after === "bossSpared") {
    e.dead = true; soul.spares++; mem.totalSpares = (mem.totalSpares || 0) + 1; dailyProgress("spare"); SFX.spare(); fadeOut(e, C.yellow);
    if (key !== "giant") { soul.route[key] = "spared"; if (!soul.friends.includes(key)) soul.friends.push(key); }
    else { if (e.baseT != null) addPal(e.baseT); const c = giveChip(); if (c) pops.push({ x: W / 2, y: BOX0.y + 130, text: "チップ「" + CHIPS[c].n + "」", color: C.yellow, t: -1.4 }); }
    mem.spared[key] = (mem.spared[key] || 0) + 1; checkAch(); saveMem();
    const g = BOSS[key].gift, gold = 40 + wave * 2;
    soul.gold += gold;
    if (g) {
      const list = g.type === "weapon" ? soul.weapons : soul.armors;
      if (!list.includes(g.key)) list.push(g.key);
      const d = g.type === "weapon" ? WEAPONS[g.key] : ARMORS[g.key];
      pops.push({ x: W / 2, y: BOX0.y + 70, text: d.name + " +" + gold + "G", color: C.yellow, t: -0.8 });
      pops.push({ x: W / 2, y: BOX0.y + 90, text: m.name + "が みかたに なった", color: C.white, t: -1.6 });
    } else pops.push({ x: W / 2, y: BOX0.y + 70, text: "+" + gold + "G", color: C.gold, t: -0.8 });
    if (key === "cloud" && soul.bag.length < INV_MAX) soul.bag.push("cotton");
    soul.mats = soul.mats || {};
    if (key === "giant") soul.mats.nusi = (soul.mats.nusi || 0) + 2; else soul.mats.kioku = (soul.mats.kioku || 0) + 1;
    enemies = enemies.filter(x => !x.dead);
    Object.assign(TBOX, BOX0); soul.invert = false; form.dark = false;
  }
}

// ---------------- フィールドイベント（みせ・たからばこ） ----------------
function spawnEvent() {
  // ボスの まえの ウェーブでは さいしょに セーブポイントが くる
  const r = Math.random();

// ---------------- 更新 ----------------
function update(dt) {
  time += dt; stateT += dt;
  if (osDownT > 0) { osDownT -= dt; return; }
  if (paused) return;
  if (state !== "title" && state !== "over") mem.playSec = (mem.playSec || 0) + dt;
  if (hurtT > 0) hurtT -= dt;
  if (form && form.blastT > 0) form.blastT -= dt;

  if (FROZEN.includes(state)) {
    if (state === "event") updateEvent(dt);
    updateMsg(dt, state === "talk");
    if (state === "chest" && ui.opened) ui.openT += dt;
    return; // せかいは とまる
  }

  for (const p of parts) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.t += dt; if (p.t > 0) p.y -= 14 * dt; }
  pops = pops.filter(p => p.t < 0.9);
  if (shake > 0) shake = Math.max(0, shake - dt * 20);

  // ボックスの かたちを ゆっくり かえる
  const k = Math.min(1, dt * 4);
  BOX.x += (TBOX.x - BOX.x) * k; BOX.w += (TBOX.w - BOX.w) * k;
  if (soul) soul.x = clampSoul(soul.x);

  if (state === "intro") {
    updateMsg(dt);
    moveSoulKeys(dt);
    form.appear = Math.min(1, form.appear + dt * 1.5);
    if (form.oyT != null) { form.oy += (form.oyT - form.oy) * Math.min(1, dt * 3); placeFormation(); }
    if (form.glitch > 0) { form.glitch -= dt; msg.t = 0; msg.shown = 0; }
    if (msg.done) { msg.hold += dt; if (msg.hold > 1.6) beginPlay(); }
  } else if (state === "play") {
    updatePlay(dt);
    saveT += dt;
    if (saveT > 2) { saveT = 0; saveRun(true); }
  } else if (state === "dying") {
    updateDying();
  }
}

function beginPlay() {
  if (form.oyT != null) { form.oy = form.oyT; form.oyT = null; placeFormation(); }
  if (form.bossIntro) { const lines = form.bossIntro; form.bossIntro = null; startTalk(lines, enemies[0].id, "none"); }
  else setState("play");
  saveRun();
}

function updateMsg(dt, voice) {
  if (msg.done) return;
  msg.t += dt;
  const n = Math.min(msgLen(), Math.floor(msg.t * 28));
  if (n > msg.shown) {
    const all = msg.lines.join("");
    for (let i = msg.shown; i < n; i++) if (i % 2 === 0 && !/[\s　…。、！？]/.test(all[i])) voice ? SFX.voice() : SFX.blip();
    msg.shown = n;
  }
  if (msg.shown >= msgLen()) msg.done = true;
}

function moveSoulKeys(dt) {
  let d = 0;
  if (keys.ArrowLeft || keys.a || keys.A) d -= 1;
  if (keys.ArrowRight || keys.d || keys.D) d += 1;
  if (soul.invert) d = -d;
  if (d) soul.x = clampSoul(soul.x + d * 110 * dt * (soul.frozenT > 0 ? 0.35 : 1));
}

function fire() {
  const w = weapon(), dmg = atk();
  const x = soul.x + 3, y = soul.y - 2;
  const mk = (dx, vx) => ({ x: x + dx, y, vx, dmg, el: w.el, pierce: !!w.pierce || hasBoon("pierce"), hit: [] });
  if (w.shot === "twin") shots.push(mk(-2, 0), mk(2, 0));
  else if (w.shot === "spread") shots.push(mk(0, -60), mk(0, 0), mk(0, 60));
  else shots.push(mk(0, 0));
  if (hasBoon("side")) shots.push(mk(0, -45), mk(0, 45));
  SFX.shot();
}

const frameOf = e => {
  const m = MON[e.type];
  if (m.frames.length === 1) return 0;
  if (m.shield) return e.guard ? 0 : 1;
  if (m.dummy) return e.angry ? Math.floor(e.t * 6) % 2 : 0;
  if (e.free) return Math.floor(e.t * 4) % 2;
  return form.anim;
};
const frameRows = e => MON[e.type].frames[frameOf(e)];

function updatePlay(dt) {
  if (form.pendingTalk) { const t = form.pendingTalk; form.pendingTalk = null; startTalk(t.lines, t.who, t.after); return; }
  moveSoulKeys(dt);
  if (soul.inv > 0) soul.inv -= dt;
  if (soul.starT > 0) soul.starT -= dt;
  if (soul.regainT > 0) soul.regainT -= dt;
  if (soul.frozenT > 0) soul.frozenT -= dt;
  if (form.glitch > 0) form.glitch -= dt;
  // ため うち（Bravely Default 風）：とまって ためて、うごいた しゅんかんに はなつ
  if (hasChip("charge") && !soul.hold) {
    if (soul.moveT <= 0) soul.chargeT = Math.min(1.5, (soul.chargeT || 0) + dt);
    else if (soul.chargeT >= 0.6) {
      shots.push({ x: soul.x + 3, y: soul.y - 6, vx: 0, dmg: atk() * (soul.chargeT >= 1.5 ? 5 : 3), el: weapon().el, pierce: true, hit: [], big: true });
      SFX.beam(); soul.chargeT = 0;
    } else soul.chargeT = 0;
  }
  if (!soul.hold) updatePal(dt);
  // HPが すくないと しんぞうの おと
  if (soul.hp > 0 && soul.hp <= soul.maxHp * 0.25) { soul.beatT = (soul.beatT || 0) - dt; if (soul.beatT <= 0) { soul.beatT = 1.1; SFX.beat(); } }
  // ゆっくりどけい：てきの じかんだけ おそく なる
  if (soul.slowT > 0) soul.slowT -= dt;
  const edt = soul.slowT > 0 ? dt * 0.5 : dt;
  // うごいているか（あお・オレンジの はんてい）
  if (Math.abs(soul.x - soul.px) > 0.05) soul.moveT = 0.1; else soul.moveT = Math.max(0, soul.moveT - dt);
  soul.px = soul.x;
  if ((armor().regen || hasChip("regen")) && soul.hp < soul.maxHp) { regenT += dt; if (regenT > 3) { regenT = 0; soul.hp++; } }
  updateFriends(dt);

  // 自動射撃（ボスが みのがしを まっている あいだは とまる）
  fireT -= dt;
  if (fireT <= 0 && !soul.hold) {
    fireT = Math.max(0.13, 0.3 - (soul.lv - 1) * 0.02) * (weapon().rate || 1) * Math.pow(0.85, boonCount("rapid"));
    fire();
  }
  for (const s of shots) { s.y -= 240 * dt; s.x += (s.vx + (form.wind || 0) * 0.6) * dt; }
  shots = shots.filter(s => s.y > BOX.y && s.x > BOX.x && s.x < BOX.x + BOX.w && !s.dead);

  // おかねの あめ
  if (form.rush > 0) {
    form.rush -= dt;
    if (Math.random() < dt * 9) items.push({ kind: "coin", x: BOX.x + 6 + Math.random() * (BOX.w - 16), y: BOX.y + 2, v: rnd(2, 5), sway: Math.random() * 6 });
    if (form.rush <= 0) form.rush = -1;
  }

  updateFormation(edt);
  if (state !== "play") return;

  for (const e of enemies) {
    e.t += edt;
    if (e.flash > 0) e.flash -= dt;
    if (e.shakeT > 0) e.shakeT -= dt;
    const m = MON[e.type];
    if (e.breakT > 0) { e.breakT -= edt; if (e.breakT <= 0) { e.shield = e.shieldMax; } }
    if (m.shield) { e.guardT -= dt; if (e.guardT <= 0) { e.guard = !e.guard; e.guardT = e.guard ? 1.4 : 1.0; } }
    if (e.free && !(e.breakT > 0)) updateFree(e, m, edt);
  }
  if (state !== "play") return;

  // 隊列の 射撃
  efireT -= edt;
  const shooters = enemies.filter(e => e.fm && !e.free && !(e.breakT > 0));
  if (form.peace > 0) {
    form.peace -= dt;
    if (form.peace <= 0) { dismissFormation(C.white, "モンスターたちは かえっていった", C.white); return; } // だれも えらばなかった
  } else if (efireT <= 0 && shooters.length) {
    efireT = Math.max(0.3, 1.25 - dWave() * 0.08) * (0.6 + Math.random() * 0.8) * (form.dark ? 1.3 : 1) * (form.angry ? 0.6 : 1) * (hard ? 0.8 : 1);
    enemyFire(pick(shooters));
  }

  // ひとりごと
  form.chatT = (form.chatT == null ? 3 : form.chatT) - dt;
  if (form.chatT <= 0) {
    form.chatT = 4 + Math.random() * 5;
    const cands = enemies.filter(e => e.fm && !e.free && CHAT[e.type]);
    if (cands.length && !form.dark) { const e = pick(cands); e.chat = pick(CHAT[e.type]); e.chatT = 1.8; }
  }
  for (const e of enemies) if (e.chatT > 0) e.chatT -= edt;

  // とくべつな てき（おどりの あいだは こない）
  if (!(form.peace > 0)) {
  if (form.ghostT != null) { form.ghostT -= dt; if (form.ghostT <= 0) { form.ghostT = null; spawnGhost(); } }
  if (form.thiefT != null) { form.thiefT -= dt; if (form.thiefT <= 0) { form.thiefT = null; spawnThief(); } }
  if (form.dummyT != null) { form.dummyT -= dt; if (form.dummyT <= 0) { form.dummyT = null; spawnDummy(); } }
  if (form.metalT != null) { form.metalT -= dt; if (form.metalT <= 0) { form.metalT = null; spawnMetal(); } }
  }

  for (const b of ebul) {
    b.x += (b.vx + (form.wind || 0)) * edt; b.y += b.vy * edt;
    if (b.ay) b.vy += b.ay * edt;
    if (b.waitT != null) { b.waitT -= edt; if (b.waitT <= 0) { b.vy = b.goVy; b.waitT = null; } }
    if (b.ink && b.y > b.ink) { b.dead = true; form.inks = form.inks || []; form.inks.push({ x: b.x, y: b.y, t: 3.5 }); } // インクが とびちる
    if (b.stopT != null) { // ときが とまる → うごきだす
      b.stopT -= edt;
      if (b.stopT <= 0 && !b.stopped) { b.stopped = true; b.vx = 0; b.vy = 0; }
      if (b.stopped && !b.gone) {
        b.goT -= edt;
        if (b.goT <= 0) { b.gone = true; const ax = soul.x + 3.5 - b.x, ay = soul.y + 3 - b.y, l = Math.hypot(ax, ay) || 1; b.vx = ax / l * 115; b.vy = ay / l * 115; }
      }
    }
    if (b.split && b.y > b.split) { // ひょうが われる
      b.dead = true;
      for (const a of [-0.6, 0, 0.6]) ebul.push({ x: b.x, y: b.y, vx: Math.sin(a) * 70 * (b.sp || 1), vy: Math.cos(a) * 70 * (b.sp || 1), dmg: b.sd || 3, c: "w", shape: "dot", w: 3, h: 3 });
    }
    if (b.bounce && (b.x < BOX.x + 4 || b.x > BOX.x + BOX.w - 4)) { b.vx = -b.vx; b.x = clamp(b.x, BOX.x + 4, BOX.x + BOX.w - 4); }
  }
  ebul = ebul.filter(b => b.y < BOX.y + BOX.h + 20 && b.y > BOX.y - 120 && b.x > BOX.x - 40 && b.x < BOX.x + BOX.w + 40 && !b.dead);
  for (const bm of beams) {
    bm.t += edt;
    if (!bm.fired && bm.t >= bm.warn) {
      bm.fired = true;
      if (bm.erupt) { // じめんから うえへ ふきだす
        for (let i = 0; i < 6; i++) ebul.push({ x: bm.x + (Math.random() - 0.5) * 10, y: BOX.y + BOX.h - 4, vx: (Math.random() - 0.5) * 70, vy: -170 - Math.random() * 90, ay: 160, dmg: 4 + (bm.lp || 0), c: "o", shape: "bubble", w: 7, h: 7 });
        noise(0.25, 0.08, 300); shake = 3;
      } else { SFX.beam(); shake = 3; }
    }
  }
  beams = beams.filter(bm => bm.t < bm.warn + bm.dur);
  if (form.inks) { for (const k of form.inks) k.t -= dt; form.inks = form.inks.filter(k => k.t > 0); }
  // ブラックホールン：ソウルを すいよせる
  // （なんびき いても ひっぱる つよさは ひとつぶん まで）
  let pull = 0;
  for (const e of enemies) if (MON[e.type].gravity && !e.dead && !e.dying && !(e.breakT > 0)) pull += clamp((e.x + e.w / 2 - (soul.x + 3.5)) / 20, -1, 1);
  if (pull) soul.x = clampSoul(soul.x + clamp(pull, -1, 1) * 13 * edt);

  // おちてくる もの
  for (const it of items) {
    if (hasChip("magnet") && Math.abs(it.x - soul.x) < 70) it.x += (soul.x - it.x) * Math.min(1, dt * 3);
    it.y += (it.kind === "coin" ? 60 : 40) * dt; if (it.kind === "coin") it.x += Math.sin(time * 4 + it.sway) * 12 * dt; }
  items = items.filter(it => {
    if (it.y > BOX.y + BOX.h - 4) return false;
    if (Math.abs(it.x + 3 - (soul.x + 3.5)) < 7 && Math.abs(it.y + 2 - (soul.y + 3)) < 7) { pickup(it); return false; }
    return true;
  });

  // みせ・たからばこ が おりてくる
  eventT -= dt;
  const fighting = enemies.some(e => e.fm || MON[e.type].mimic);
  if (eventT <= 0 && fighting && !form.flower && !events.length && !form.rush && !enemies.some(e => MON[e.type].boss)) { spawnEvent(); eventT = 16 + Math.random() * 12; }
  // たからばこは はやく とおりすぎる（とるのが むずかしい）
  for (const ev of events) ev.y += (ev.kind === "chest" ? 34 : ev.kind === "save" ? 22 : 16) * dt;
  events = events.filter(ev => ev.y < BOX.y + BOX.h - 4);
  for (const ev of events) {
    if (soul.x + 7 > ev.x && soul.x < ev.x + ev.w && soul.y + 6 > ev.y && soul.y < ev.y + ev.h) {
      events = events.filter(x => x !== ev);
      if (ev.kind === "shop") enterShop(); else if (ev.kind === "save") enterSave(); else if (ev.mimic) springMimic(ev); else enterChest();
      return;
    }
  }

  // 当たり判定：弾 → 敵
  for (const s of shots) {
    for (const e of enemies) {
      const m = MON[e.type];
      if (e.dead || e.dying || m.ghost || s.hit.includes(e.id)) continue;
      if (s.x >= e.x - 1 && s.x <= e.x + e.w + 1 && s.y <= e.y + e.h && s.y + 5 >= e.y) {
        if (m.shield && e.guard && !s.pierce) {
          s.dead = true; SFX.guard();
          pops.push({ x: e.x + e.w / 2, y: e.y - 6, text: "ガード", color: C.gray, t: 0.3 });
          break;
        }
        if (e.reflect) {
          s.dead = true; SFX.guard();
          const ax = soul.x + 3.5 - s.x, ay = soul.y - s.y, l = Math.hypot(ax, ay) || 1;
          ebul.push({ x: s.x, y: e.y + e.h, vx: ax / l * 90, vy: ay / l * 90, dmg: 4, c: "o", shape: "dot", w: 3, h: 3 });
          break;
        }
        damageEnemy(e, s.dmg, false, s.el);
        if (s.pierce) s.hit.push(e.id); else { s.dead = true; break; }
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
  if (state !== "play") return;

  // 当たり判定：敵の こうげき → ソウル（見た目より すこし ちいさめ）
  if (soul.inv <= 0) {
    const cx = soul.x + 3.5, cy = soul.y + 2.5, moving = soul.moveT > 0;
    for (const b of ebul) {
      const gx = Math.abs(b.x - cx) - b.w / 2, gy = Math.abs(b.y - cy) - b.h / 2;
      if (gx < 2 && gy < 2) {
        if (b.c === "b" && !moving) { b.near = true; continue; } // あお：とまっていれば へいき
        if (b.c === "o" && moving) { b.near = true; continue; }  // オレンジ：うごいていれば へいき
        b.hitSoul = true;
        if (!b.keep) b.dead = true;
        hurt(b.dmg); break;
      }
      // かする：あたらずに すれすれを とおりぬけたら ケツイが たまる
      if (gx < (hasChip("graze") ? 14 : 9) && gy < (hasChip("graze") ? 11 : 7)) b.near = true;
      else if (b.near && !b.grazed && !b.hitSoul) { b.grazed = true; graze(b); }
    }
    if (soul.inv <= 0) for (const bm of beams) {
      if (bm.fired && !bm.erupt && Math.abs(bm.x - cx) < bm.w / 2 + 1) { hurt(bm.dmg); break; }
    }
    if (soul.inv <= 0) for (const e of enemies) {
      if (!e.free || e.dying || MON[e.type].ghost || MON[e.type].boss) continue;
      if (cx > e.x && cx < e.x + e.w && cy > e.y && cy < e.y + e.h) {
        if (MON[e.type].thief) steal(e); else hurt(5);
        break;
      }
    }
  }

  const blocking = enemies.filter(e => e.fm || MON[e.type].boss || MON[e.type].mimic);
  // てきを たおしても、みせ・たからばこが とおりすぎるまでは おわらない
  if (!blocking.length && events.length && !form.waitPop && state === "play") {
    form.waitPop = true;
    pops.push({ x: W / 2, y: BOX.y + BOX.h / 2, text: "＊ まだ なにか おりてくる…", color: C.white, t: 0 });
  }
  if (!blocking.length && !events.length && state === "play" && form.rush <= 0 && !form.bossIntro && !form.flower) {
    if (form.rush !== -1) pops.push({ x: W / 2, y: BOX.y + BOX.h / 2, text: "WAVE CLEAR", color: C.yellow, t: 0, big: true });
    score += wave * 50;
    // のこった ゴースト・ネズミは どこかへ いく
    palBond(1);
    if (mode === "adv") { if (soul.boons && hasBoon("heal") && adv.stage && adv.stage.wi + 1 >= adv.stage.waves) soul.hp = Math.min(soul.maxHp, soul.hp + Math.ceil(soul.maxHp * 0.25) * boonCount("heal")); advWaveCleared(); return; }
    if (wave >= 15 && !soul.endingDone && Object.keys(soul.route).length >= 3) { startEnding(); return; }
    nextWave();
  }
}

function updateFormation(dt) {
  const fmE = enemies.filter(e => e.fm);
  if (!fmE.length) return;
  const inF = fmE.filter(e => !e.free);
  const alive = fmE.length;
  const speed = 10 + dWave() * 2 + (1 - alive / Math.max(1, form.total)) * 45;
  let dx = form.dir * speed * dt, dy = 0;
  if (inF.length) {
    let minX = Infinity, maxX = -Infinity;
    for (const e of inF) { minX = Math.min(minX, form.ox + e.fx); maxX = Math.max(maxX, form.ox + e.fx + e.w); }
    if ((form.dir > 0 && maxX + dx > BOX.x + BOX.w - 6) || (form.dir < 0 && minX + dx < BOX.x + 6)) { form.dir *= -1; dx = 0; dy = easy ? 5 : hard ? 9 : 8; }
  } else if (form.ox < BOX.x || form.ox > BOX.x + BOX.w - 60) form.dir *= -1;
  if (form.peace > 0) dy = 0;
  form.ox += dx; form.oy += dy;
  placeFormation();
  form.animT += dt;
  if (form.animT > Math.max(0.15, 0.6 - (1 - alive / Math.max(1, form.total)) * 0.4)) { form.animT = 0; form.anim ^= 1; }
  let maxY = -Infinity;
  for (const e of inF) maxY = Math.max(maxY, e.y + e.h);
  if (maxY >= soul.y - 2) { soul.hp = 0; die(); return; }
  // ワープネコが ばしょを いれかえる
  for (const e of inF) {
    if (MON[e.type].warp && Math.random() < dt * 0.35) {
      const o = pick(inF);
      if (o !== e) { [e.fx, o.fx] = [o.fx, e.fx]; [e.fy, o.fy] = [o.fy, e.fy]; e.flash = 0.08; SFX.warn();
        for (let i = 0; i < 6; i++) parts.push({ x: e.x + 6, y: e.y + 5, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 0.25, max: 0.25, delay: 0, color: C.yellow, s: 1 }); }
    }
  }
  placeFormation();
  // ツッコミドリが とびだす
  for (const e of inF) {
    if (MON[e.type].diver && !(form.peace > 0) && Math.random() < dt * (0.05 + dWave() * 0.008)) { e.free = true; e.dv = 1; SFX.warn(); }
  }
}

function updateFree(e, m, dt) {
  if (m.diver) {
    if (e.dv === 1) {
      if (m.trail && Math.random() < dt * 5) ebul.push({ x: e.x + e.w / 2, y: e.y + e.h, vx: 0, vy: 60, dmg: 3, c: "o", shape: "dot", w: 3, h: 3 });
      e.y += 100 * dt;
      e.x += clamp(soul.x + 3 - (e.x + e.w / 2), -55 * dt, 55 * dt);
      if (e.y > BOX.y + BOX.h) { e.y = BOX.y - 12; e.dv = 2; }
    } else {
      const tx = form.ox + e.fx, ty = form.oy + e.fy, ddx = tx - e.x, ddy = ty - e.y, l = Math.hypot(ddx, ddy);
      if (l < 3) { e.free = false; e.dv = 0; }
      else { e.x += ddx / l * 110 * dt; e.y += ddy / l * 110 * dt; }
    }
  } else if (m.thief) {
    if (e.escape) { e.y -= 90 * dt; if (e.y < BOX.y - 10) e.dead = true; }
    else {
      e.y += 38 * dt; e.x += Math.sin(e.t * 3) * 50 * dt; e.x = clamp(e.x, BOX.x + 4, BOX.x + BOX.w - e.w - 4);
      if (e.y > BOX.y + BOX.h) e.dead = true;
    }
  } else if (m.mimic) {
    e.y += ((BOX.y + 60) - e.y) * Math.min(1, dt * 2);
    // かぜで たまが ながされる ぶん ずれた ところに いる（まうえだと ぜったいに あたらない）
    const drift = (form.wind || 0) * 0.6 * Math.max(0, soul.y - (e.y + e.h)) / 240;
    e.x += clamp(soul.x + 3 + drift - (e.x + e.w / 2), -32 * dt, 32 * dt);
    e.x = clamp(e.x, BOX.x + 2, BOX.x + BOX.w - e.w - 2);
    // ながく いすわらない（つかれて かえる）
    e.mimicT = (e.mimicT || 0) + dt;
    if (e.mimicT > 30) {
      e.dead = true; fadeOut(e, C.gold);
      pops.push({ x: e.x + 6, y: e.y - 8, text: "ミミックは あきて かえった", color: C.gray, t: 0 });
      return;
    }
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.atkT = Math.max(0.6, 1.1 - wave * 0.02);
      const bx = e.x + e.w / 2, by = e.y + e.h;
      for (const a of [-0.25, 0.25]) {
        const ax = soul.x + 3.5 - bx, ay = soul.y - by, l = Math.hypot(ax, ay) || 1, ang = Math.atan2(ay, ax) + a;
        ebul.push({ x: bx, y: by, vx: Math.cos(ang) * 85, vy: Math.sin(ang) * 85, dmg: 4, c: "w", shape: "tooth", w: 3, h: 4 });
        void l;
      }
      SFX.chomp();
    }
  } else if (m.metal) {
    e.x += e.dir * (110 + Math.sin(e.t * 5) * 40) * dt;
    if (e.x < BOX.x + 4 || e.x > BOX.x + BOX.w - e.w - 4) { e.dir *= -1; e.x = clamp(e.x, BOX.x + 4, BOX.x + BOX.w - e.w - 4); }
    e.y += Math.sin(e.t * 3) * 20 * dt;
    e.life -= dt;
    if (e.life <= 0) { e.dead = true; fadeOut(e, "#ccd"); pops.push({ x: e.x + 6, y: e.y - 8, text: "にげた…", color: C.gray, t: 0 }); }
  } else if (m.dummy) {
    if (!e.angry) { e.y = e.baseY + Math.sin(e.t * 2) * 1; return; }
    e.x += Math.sin(e.t * 1.3) * 40 * dt; e.x = clamp(e.x, BOX.x + 4, BOX.x + BOX.w - e.w - 4);
    e.y = e.baseY + Math.sin(e.t * 2) * 4;
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.atkT = 1.1;
      const bx = e.x + e.w / 2, by = e.y + e.h;
      for (const a of [-0.5, -0.25, 0, 0.25, 0.5]) ebul.push({ x: bx, y: by, vx: Math.sin(a) * 80, vy: Math.cos(a) * 80, dmg: 4, c: "w", shape: "dot", w: 3, h: 3 });
    }
  } else if (m.ghost && !m.flower) {
    e.x = e.cx + Math.sin(e.t * 0.8) * 70; e.y = BOX.y + 120 + Math.sin(e.t * 1.7) * 10;
    e.life -= dt;
    if (e.life <= 0) { e.dead = true; fadeOut(e, C.gray); pops.push({ x: e.x + 6, y: e.y - 8, text: "…", color: C.gray, t: 0 }); }
  } else if (m.flower) updateFlower(e, dt);
  else if (m.boss) updateBoss(e, m, dt);
}

// みのがした ボスたちが てつだってくれる
function updateFriends(dt) {
  if (!soul.friends.length) return;
  soul.friendT += dt;
  if (soul.friends.includes("bones") && soul.friendT % 10 < dt) {
    const targets = enemies.filter(e => !e.dead && !e.dying && !e.spare && !MON[e.type].ghost && !MON[e.type].boss);
    if (targets.length) {
      const t = pick(targets), x0 = t.x + t.w / 2;
      for (const dx of [-8, 0, 8]) shots.push({ x: clamp(x0 + dx, BOX.x + 4, BOX.x + BOX.w - 4), y: BOX.y + BOX.h - 6, vx: 0, dmg: atk() + 2, pierce: true, hit: [], ally: true });
      SFX.guard();
      pops.push({ x: x0, y: BOX.y + BOX.h - 26, text: "ボーンズ！", color: C.white, t: 0 });
    }
  }
  if (soul.friends.includes("cloud") && (soul.friendT + 5) % 14 < dt && soul.hp < soul.maxHp) {
    soul.hp = Math.min(soul.maxHp, soul.hp + 3); SFX.heal();
    pops.push({ x: soul.x + 3, y: soul.y - 14, text: "ショボンの あめ +3", color: C.blue, t: 0 });
    for (let i = 0; i < 14; i++) parts.push({ x: soul.x - 14 + Math.random() * 34, y: soul.y - 40 - Math.random() * 20, vx: -4, vy: 90, life: 0.45, max: 0.45, delay: 0, color: C.blue, s: 1 });
  }
}

function spawnGhost() {
  const e = mkEnemy(11, W / 2, BOX.y + 120, { free: true, fm: false, spare: true, cx: W / 2 - 6, life: 16 });
  enemies.push(e);
  pops.push({ x: W / 2, y: BOX.y + 100, text: "まよいゴーストが あらわれた", color: C.yellow, t: -0.6 });
}
// メタルふわりん（Dragon Quest の メタル風）：すぐ にげる。どんな こうげきも 1ダメージ
function spawnMetal() {
  const e = mkEnemy(T.metal, BOX.x + 10, BOX.y + 70 + Math.random() * 40, { free: true, fm: false, life: 7, dir: 1 });
  e.hp = e.maxHp0 = 4 + Math.floor(wave / 10);
  enemies.push(e); SFX.warn();
  pops.push({ x: W / 2, y: BOX.y + 60, text: "メタルふわりんが あらわれた！", color: "#ccd", t: 0 });
}
function spawnDummy() {
  const e = mkEnemy(17, BOX.x + 30 + Math.random() * (BOX.w - 72), BOX.y + 150, { free: true, fm: false, spare: true, hits: 0, atkT: 1 });
  e.hp = 12 + wave; e.baseY = e.y;
  enemies.push(e);
  pops.push({ x: e.x + 6, y: e.y - 14, text: "わらにんぎょうは なにも しない", color: C.yellow, t: -0.3 });
}
function spawnThief() {
  const e = mkEnemy(9, BOX.x + 20 + Math.random() * (BOX.w - 50), BOX.y + 2, { free: true, fm: false, loot: 0 });
  e.hp = 3 + Math.floor(wave / 4);
  enemies.push(e);
  pops.push({ x: e.x + 5, y: e.y + 14, text: "どろぼう！", color: C.gold, t: -0.3 });
}
function steal(e) {
  if (e.escape) return;
  const n = Math.max(soul.gold > 0 ? 1 : 0, Math.floor(soul.gold * 0.25));
  soul.gold -= n; e.loot += n; e.escape = true;
  SFX.steal(); soul.inv = 0.6;
  pops.push({ x: soul.x + 3, y: soul.y - 14, text: n ? "-" + n + "G" : "…", color: C.gold, t: 0 });
}
function pickup(it) {
  if (it.kind === "coin") {
    const g = it.v * (armor().goldX || 1);
    soul.gold += g; SFX.coin();
    pops.push({ x: soul.x + 3, y: soul.y - 10, text: "+" + g + "G", color: C.gold, t: 0 });
  } else if (soul.bag.length < INV_MAX) {
    soul.bag.push("candy"); SFX.coin();
    pops.push({ x: soul.x + 3, y: soul.y - 10, text: "GET!", color: C.pink, t: 0 });
  } else {
    const before = soul.hp; soul.hp = Math.min(soul.maxHp, soul.hp + 10); SFX.heal();
    pops.push({ x: soul.x + 3, y: soul.y - 10, text: "+" + (soul.hp - before), color: C.green, t: 0 });
  }
}

function enemyFire(e) {
  const m = MON[e.type];
  const bx = e.x + e.w / 2, by = e.y + e.h;
  const sp = (70 + dWave() * 4) * (easy ? 0.8 : hard ? 1.2 : 1);
  const dmg = mode === "adv" ? 3 + Math.min(2, Math.floor(e.type / 6)) + Math.floor(wave / 9) : 3 + Math.min(3, Math.floor(e.type / 2)) + Math.floor(wave / 4);
  const dot = (vx, vy, c = "w") => ebul.push({ x: bx, y: by, vx, vy, dmg, c, shape: "dot", w: 3, h: 3 });
  if (m.fire === "straight" || wave < 2) dot(0, sp);
  else if (m.fire === "aimed") {
    const ax = soul.x + 3.5 - bx, ay = soul.y - by, l = Math.hypot(ax, ay) || 1;
    dot(ax / l * sp, ay / l * sp);
  } else if (m.fire === "spread") for (const a of [-0.35, 0, 0.35]) dot(Math.sin(a) * sp, Math.cos(a) * sp);
  else if (m.fire === "blue") ebul.push({ x: bx, y: by, vx: 0, vy: sp * 0.8, dmg, c: "b", shape: "bone", w: 3, h: 12 });
  else if (m.fire === "orange") ebul.push({ x: bx, y: by, vx: 0, vy: sp * 0.8, dmg, c: "o", shape: "bone", w: 3, h: 12 });
  else if (m.fire === "ring") for (let i = 0; i < 6; i++) { const a = 0.35 + i * (Math.PI - 0.7) / 5; dot(Math.cos(a) * 45, Math.sin(a) * 45); }
  else if (m.fire === "magma") ebul.push({ x: bx, y: by, vx: (Math.random() - 0.5) * 30, vy: sp * 0.6, dmg, c: "o", shape: "bubble", w: 7, h: 7 });
  else if (m.fire === "snowball") ebul.push({ x: bx, y: by, vx: 0, vy: sp * 0.5, dmg, c: "w", shape: "bubble", w: 7, h: 7, split: BOX.y + 140 + Math.random() * 50, sp: 0.9, sd: dmg - 1 });
  else if (m.fire === "icicle") { e.shakeT = 0.4; ebul.push({ x: bx, y: by, vx: 0, vy: 0, dmg, c: "w", shape: "bone", w: 2, h: 12, waitT: 0.45, goVy: sp * 2 }); }
  else if (m.fire === "letters") for (let i = -2; i <= 2; i++) dot(i * 30, sp * 0.7);
  else if (m.fire === "ink") ebul.push({ x: bx, y: by, vx: 0, vy: sp * 0.7, dmg: 1, c: "w", shape: "ink", w: 6, h: 6, ink: BOX.y + 150 + Math.random() * 60 });
}

function damageEnemy(e, dmg, silent, el) {
  const m = MON[e.type];
  const weakHit = el && WEAK[e.type] === el;
  if (weakHit) dmg = Math.ceil(dmg * 1.5);
  if (e.breakT > 0) dmg *= 2;
  if (m.metal) dmg = 1; // メタルは かたい
  // たいかん（シールド）：よわてんで おおきく、ふつうの こうげきでも すこし けずれる
  if (e.shieldMax && !(e.breakT > 0)) {
    e.shield -= weakHit ? 1 : 0.2;
    if (e.shield <= 0) {
      e.breakT = 3; e.shield = 0; shake = 5; SFX.crack(); vibrate(30); dailyProgress("break");
      pops.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, text: "BREAK!", color: C.yellow, t: 0, big: true });
      ebul = ebul.filter(b => Math.hypot(b.x - (e.x + e.w / 2), b.y - (e.y + e.h)) > 40);
    }
  }
  if (weakHit && Math.random() < 0.25) pops.push({ x: e.x + e.w / 2, y: e.y - 14, text: "よわてん！", color: ELEM[el].c, t: 0 });
  if (m.dummy && e.spare) {
    e.hits++; e.flash = 0.12; e.shakeT = 0.25; SFX.hit();
    if (e.hits >= 4) {
      e.spare = false; e.angry = true; shake = 4; SFX.chomp();
      pops.push({ x: e.x + 6, y: e.y - 14, text: "わらにんぎょうは おこった！", color: C.red, t: 0 });
    }
    return;
  }
  if (m.boss && !e.offered && !e.refused && e.hp - dmg <= Math.floor(e.maxHp * 0.2)) {
    // ボスは たおれる まえに みのがしを もとめる
    e.hp = Math.floor(e.maxHp * 0.2); e.flash = 0.12; e.shakeT = 0.25;
    e.offered = true; e.spare = true; soul.hold = true; ebul = []; beams = []; e.reflect = false; soul.invert = false; form.dark = false;
    SFX.hit();
    startTalk(BOSS[m.boss].spare, e.id, "none");
    return;
  }
  e.hp -= dmg; e.flash = 0.12; e.shakeT = 0.25;
  pops.push({ x: e.x + e.w / 2, y: e.y - 6, text: String(dmg), color: C.red, t: 0 });
  for (let i = 0; i < 3; i++) parts.push({ x: e.x + e.w / 2, y: e.y + e.h, vx: (Math.random() - 0.5) * 60, vy: 20 + Math.random() * 40, life: 0.2, max: 0.2, delay: 0, color: C.yellow, s: 1 });
  if (e.hp > 0) { if (!silent) SFX.hit(); return; }
  if (m.boss) { e.hp = 0; e.dying = true; e.spare = false; soul.hold = false; ebul = []; beams = []; startTalk(BOSS[m.boss].killed, e.id, "bossDust"); return; }
  killEnemy(e);
}

function killEnemy(e) {
  const m = MON[e.type], s = m.scale || 1;
  e.dead = true;
  // 撃破：上から下へ チリに なって きえる
  frameRows(e).forEach((r, j) => {
    for (let i = 0; i < r.length; i++) if (r[i] === "#") {
      parts.push({ x: e.x + i * s, y: e.y + j * s, vx: (Math.random() - 0.3) * 14, vy: -6 - Math.random() * 18,
        life: 0.6 + Math.random() * 0.6, max: 1.2, delay: j * 0.03 * (s > 1 ? 1.5 : 1), color: m.color || C.white, s });
    }
  });
  if (parts.length > 1200) parts.splice(0, parts.length - 1200); // スマホで おもく ならないように
  SFX.dust();
  score += m.pts * wave * (hard ? 2 : 1);
  soul.kills++; mem.totalKills = (mem.totalKills || 0) + 1;
  dailyProgress("kill", e.type);
  if (soul.regainT > 0 && soul.hp < soul.maxHp) { soul.hp++; pops.push({ x: soul.x + 3, y: soul.y - 10, text: "+1", color: C.green, t: 0 }); }
  mem.defeated[e.type] = (mem.defeated[e.type] || 0) + 1;
  let g = Math.round(rnd(m.gold[0], m.gold[1]) * (armor().goldX || 1) * (hasBoon("greed") ? 1.5 : 1) * (e.elite ? 3 : 1));
  if (m.thief) g = e.loot + 10;
  if (g) { soul.gold += g; pops.push({ x: e.x + e.w / 2, y: e.y + 4, text: g + "G", color: C.gold, t: 0 }); }
  gainExp(m.metal ? 25 + wave * 4 : m.exp);
  if (m.metal) { pops.push({ x: e.x + 6, y: e.y - 16, text: "メタル たおした！ EXP +" + (25 + wave * 4), color: "#ccd", t: 0 }); soul.mats = soul.mats || {}; soul.mats.metal = (soul.mats.metal || 0) + 1; }
  if (m.burst) for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.3; ebul.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 + 20, dmg: 3, c: "w", shape: "dot", w: 3, h: 3 }); }
  if (m.splits) {
    for (const off of [-5, 7]) {
      const c = mkEnemy(7, e.x + off, e.y + 3, { fx: e.fx + off, fy: e.fy + 3, free: e.free, dv: 0 });
      c.free = false; enemies.push(c); form.total++;
    }
  }
  if (m.mimic && Math.random() < 0.5) {
    const gear = gearPool();
    if (gear.length) { const rw = pick(gear); (rw.type === "weapon" ? soul.weapons : soul.armors).push(rw.key);
      pops.push({ x: e.x + 6, y: e.y - 10, text: stockData(rw).name, color: C.yellow, t: -0.3 }); }
  }
  if (!m.boss && Math.random() < 0.06) items.push({ kind: "candy", x: e.x + e.w / 2 - 3, y: e.y + 4 });
  // そざい
  const gainMat = (k, n) => { soul.mats = soul.mats || {}; soul.mats[k] = (soul.mats[k] || 0) + n; pops.push({ x: e.x + e.w / 2, y: e.y + 14, text: MATS[k] + (n > 1 ? "×" + n : ""), color: "#aab", t: -0.2 }); };
  if (m.boss === "giant") gainMat("nusi", 2);
  else if (m.boss) gainMat("kioku", 1);
  else if (DROP[e.type] && (e.elite || Math.random() < 0.2)) gainMat(DROP[e.type], e.elite ? 2 : 1);
}

function gainExp(n) {
  soul.exp += n;
  while (soul.exp >= needExp(soul.lv)) {
    soul.lv++; soul.maxHp += 4; soul.hp = Math.min(soul.maxHp, soul.hp + 4);
    SFX.lvup();
    pops.push({ x: soul.x + 3, y: soul.y - 14, text: "LV UP", color: C.yellow, t: 0 });
  }
}

function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function hurt(dmg, raw) {
  if (soul.mirrorShield && !raw) {
    soul.mirrorShield = false; soul.inv = 1; SFX.guard();
    pops.push({ x: soul.x + 3, y: soul.y - 14, text: "かがみが まもった！", color: C.yellow, t: 0 });
    return;
  }
  vibrate(40); hurtT = 0.25;
  if (hasChip("counter")) for (let i = -3; i <= 3; i++) shots.push({ x: soul.x + 3, y: soul.y - 2, vx: i * 45, dmg: atk(), el: weapon().el, pierce: false, hit: [] });
  if (hasChip("regain")) soul.regainT = 2.5;
  let d = raw ? dmg : Math.max(1, dmg - def());
  if (easy) d = Math.max(1, Math.ceil(d * 0.6));
  if (hard) d = Math.ceil(d * 1.3);
  if (form && form.flower) { form.flowerHit = true; d = Math.min(d, soul.hp - 1); } // はじめは しなない
  soul.hp = Math.max(0, soul.hp - d);
  soul.inv = (armor().inv || 1.0) + 0.6 * boonCount("ghost"); shake = 4;
  SFX.hurt();
  if (soul.hp <= 0) die();
}

// ---------------- ボス ----------------
function bossPhase2(e) {
  const key = MON[e.type].boss;
  e.phase2 = true;
  if (key === "bones" || key === "mirror") { TBOX.w = 150; TBOX.x = W / 2 - 75; }
  if (key === "clock") { TBOX.w = 160; TBOX.x = W / 2 - 80; }
  if (key === "magdon") { TBOX.w = 170; TBOX.x = W / 2 - 85; }
  if (key === "freezia") form.wind = 25;
  if (key === "page") { TBOX.w = 160; TBOX.x = W / 2 - 80; }
  if (key === "nul") { form.glitch = 2.2; form.hudGone = true; noise(1.5, 0.1, 150); } // コマンドが きえる…
  if (key === "cloud") form.dark = true;
  if (key === "shadow" || key === "poko") { TBOX.w = 170; TBOX.x = W / 2 - 85; }
}

function updateBoss(e, m, dt) {
  const B = BOSS[m.boss];
  if (e.spare || e.refused || e.dying) { // みのがしを まっている / もう たたかう きが ない → うごかない
    e.x += (W / 2 - e.w / 2 - e.x) * Math.min(1, dt * 2);
    return;
  }
  const range = Math.max(0, BOX.w / 2 - e.w / 2 - 8);
  e.x = e.cx - e.w / 2 + Math.sin(e.t * 0.6) * range;
  e.y = BOX.y + 16 + Math.sin(e.t * 1.3) * 3;
  if (!e.phase2 && e.hp <= e.maxHp * 0.55) { ebul = []; beams = []; e.reflect = false; soul.invert = false; startTalk(B.mid, e.id, "phase2"); return; }
  if (e.quiz) { // ○× クイズ：ひだり＝○ / みぎ＝×
    e.quiz.t -= dt;
    if (e.quiz.t <= 0) {
      const ans = soul.x + 3.5 < W / 2 ? "o" : "x";
      if (ans === e.quiz.a) {
        SFX.lvup(); pops.push({ x: W / 2, y: BOX.y + 120, text: "せいかい！", color: C.green, t: 0, big: true });
        e.shield = Math.max(0, (e.shield || 0) - 6);
        if (e.shieldMax && e.shield <= 0) { e.breakT = 3; shake = 5; SFX.crack(); pops.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, text: "BREAK!", color: C.yellow, t: 0, big: true }); }
      } else { pops.push({ x: W / 2, y: BOX.y + 120, text: "ざんねん…", color: C.red, t: 0, big: true }); hurt(8 + (e.loop || 0)); }
      e.quiz = null; e.patT = 0;
    }
    return;
  }
  if (!e.pat || e.patT <= 0) {
    if (e.pat === "invert") soul.invert = false;
    e.reflect = false;
    const pats = e.pats || ((e.loop || 0) >= 1 && B.extra ? B.patterns.concat(B.extra) : B.patterns); // 2しゅうめからの あたらしい こうげき
    e.pi = ((e.pi == null ? -1 : e.pi) + 1) % pats.length;
    e.pat = pats[e.pi]; e.patT = 4.5; e.pt = 0; e.pa = 0;
    if (m.boss === "shadow" || m.boss === "poko") { // ボックスを もとに もどす
      if (e.phase2) { TBOX.w = 170; TBOX.x = W / 2 - 85; } else Object.assign(TBOX, BOX0);
    }
    if (e.pat === "memory") {
      e.pat = pick(["boneRain", "gapWall", "blueSweep", "rain", "bubbles", "spiral", "mirrorRain"]);
      pops.push({ x: W / 2, y: BOX.y + 110, text: "＊ たたかいの きおく…", color: C.white, t: -0.5 });
    }
    if (e.pat === "squeeze") { TBOX.w = 96; TBOX.x = W / 2 - 48; }
    if (e.pat === "invert") { soul.invert = true; pops.push({ x: W / 2, y: BOX.y + 120, text: "さかさま！", color: C.yellow, t: -0.5, big: true }); }
    if (e.pat === "reflect") { e.reflect = true; pops.push({ x: e.x + e.w / 2, y: e.y + e.h + 4, text: "はねかえす！", color: C.bOrange, t: -0.5 }); }
    if (e.pat === "boneRain" || e.pat === "rain") e.patT = 4;
  }
  e.patT -= dt; e.pt -= dt;
  if (m.boss === "shadow") { e.hx = e.hx || []; e.hx.push(Math.round(soul.x + 3.5)); if (e.hx.length > 50) e.hx.shift(); }
  const p2 = e.phase2, lp = e.loop || 0, sp = (1 + lp * 0.15) * (easy ? 0.82 : hard ? 1.15 : 1);
  const bx = e.x + e.w / 2, by = e.y + e.h;
  const bone = (x, y, vx, vy, c = "w", h = 10) => ebul.push({ x, y, vx, vy, dmg: 4 + lp, c, shape: "bone", w: 3, h });
  const dot = (x, y, vx, vy, c = "w") => ebul.push({ x, y, vx, vy, dmg: 4 + lp, c, shape: "dot", w: 3, h: 3 });
  const beam = (x, w = 12) => { beams.push({ x, w, warn: 0.75, dur: 0.35, t: 0, dmg: 6 + lp }); SFX.warn(); };
  const L = BOX.x + 4, R = BOX.x + BOX.w - 4;
  if (e.pt > 0) return;
  switch (e.pat) {
    case "boneRain": e.pt = p2 ? 0.11 : 0.16; bone(L + Math.random() * (R - L), BOX.y + 4, 0, (90 + wave) * sp); break;
    case "gapWall": {
      e.pt = p2 ? 1.25 : 1.5;
      const gw = p2 ? 22 : 28, gc = e.nextGap != null ? clamp(e.nextGap, L + gw / 2, R - gw / 2) : L + gw / 2 + Math.random() * (R - L - gw);
      e.nextGap = L + gw / 2 + Math.random() * (R - L - gw); // みらいし：つぎの すきまを さきに きめておく
      for (let x = L; x <= R; x += 7) if (Math.abs(x - gc) > gw / 2) bone(x, BOX.y + 6, 0, 70 * sp);
      break;
    }
    case "blueSweep": {
      e.pt = 1.4; e.pa ^= 1;
      const c = p2 && Math.random() < 0.5 ? "o" : "b";
      const fromL = Math.random() < 0.5;
      bone(fromL ? L : R, soul.y + 3, (fromL ? 1 : -1) * 105 * sp, 0, c, 28);
      break;
    }
    case "beam": e.pt = p2 ? 0.7 : 0.9; beam(soul.x + 3.5); if (p2) beam(L + Math.random() * (R - L)); break;
    case "rain": e.pt = 0.05; ebul.push({ x: L + Math.random() * (R - L + 30), y: BOX.y + 4, vx: -22, vy: 150 * sp, dmg: 3 + lp, c: "w", shape: "drop", w: 1, h: 4 }); break;
    case "lightning": e.pt = 1.0; beam(soul.x + 3.5, 8); beam(L + Math.random() * (R - L), 8); if (p2) beam(L + Math.random() * (R - L), 8); break;
    case "bubbles": e.pt = p2 ? 0.35 : 0.5; ebul.push({ x: bx, y: by, vx: (Math.random() - 0.5) * 100, vy: 45 * sp, dmg: 4 + lp, c: "o", shape: "bubble", w: 7, h: 7, bounce: true }); break;
    case "spiral": {
      e.pt = 0.07; e.pa += 0.45;
      for (const k of p2 ? [0, Math.PI] : [0]) dot(bx, by - 8, Math.cos(e.pa + k) * 75 * sp, Math.abs(Math.sin(e.pa + k)) * 75 * sp + 15);
      break;
    }
    case "invert": e.pt = 0.55; for (let i = 0; i < 3; i++) dot(L + Math.random() * (R - L), BOX.y + 6, 0, 80 * sp); break;
    case "reflect": e.pt = 0.9; dot(bx, by, 0, 90 * sp); break;
    case "pendulum": { // ふりこ
      e.pt = p2 ? 0.06 : 0.08;
      const px = W / 2 + Math.sin(e.t * 2.4) * (BOX.w / 2 - 14);
      dot(px, BOX.y + 40, 0, 95 * sp, p2 && Math.sin(e.t * 2.4) > 0.8 ? "b" : "w");
      break;
    }
    case "timeStop": { // とまって、いっせいに とんでくる
      e.pt = p2 ? 1.0 : 1.3;
      for (let i = 0; i < 10; i++) {
        const a = 0.3 + i * (Math.PI - 0.6) / 9;
        ebul.push({ x: bx, y: by, vx: Math.cos(a) * 120 * sp, vy: Math.sin(a) * 120 * sp, dmg: 4 + lp, c: "w", shape: "dot", w: 3, h: 3, stopT: 0.55, goT: 0.6 });
      }
      SFX.warn();
      break;
    }
    case "tickRain": { // チク・タクに あわせて れつが ふる
      e.pt = p2 ? 0.5 : 0.65;
      tone((e.pa ^= 1) ? 1500 : 1100, 0.03, "square", 0.03);
      const g1 = L + Math.random() * (R - L), g2 = L + Math.random() * (R - L);
      for (let x = L; x <= R; x += 9) if (Math.abs(x - g1) > 13 && Math.abs(x - g2) > 13) dot(x, BOX.y + 6, 0, 110 * sp);
      break;
    }
    case "magmaRain": e.pt = p2 ? 0.12 : 0.18; ebul.push({ x: L + Math.random() * (R - L), y: BOX.y + 4, vx: (Math.random() - 0.5) * 20, vy: 95 * sp, dmg: 4 + lp, c: "o", shape: "bubble", w: 7, h: 7 }); break;
    case "eruption": { // じめんから ふきだす（よこくの あと）
      e.pt = p2 ? 0.7 : 0.95;
      beams.push({ x: clamp(soul.x + 3.5 + (Math.random() - 0.5) * 40, L, R), w: 14, warn: 0.7, dur: 0.05, t: 0, dmg: 0, erupt: true, lp }); SFX.warn();
      break;
    }
    case "snowStorm": e.pt = 0.07; e.pa += 0.2; ebul.push({ x: L + Math.random() * (R - L), y: BOX.y + 4, vx: Math.sin(e.pa) * 50, vy: 85 * sp, dmg: 3 + lp, c: "w", shape: "dot", w: 3, h: 3 }); break;
    case "iceWall": {
      e.pt = p2 ? 1.0 : 1.25;
      const gw = 20, gc = e.nextGap != null ? clamp(e.nextGap, L + gw / 2, R - gw / 2) : L + gw / 2 + Math.random() * (R - L - gw);
      e.nextGap = L + gw / 2 + Math.random() * (R - L - gw);
      for (let x = L; x <= R; x += 6) if (Math.abs(x - gc) > gw / 2) bone(x, BOX.y + 6, 0, 105 * sp, "w", 8);
      break;
    }
    case "freeze": { // こおって うごきが にぶる＋あおい ほね（とまっていれば だいじょうぶ）
      if (!e.frozeOnce) { e.frozeOnce = true; soul.frozenT = 4.2; pops.push({ x: soul.x + 3, y: soul.y - 18, text: "こおりついた！", color: C.blue, t: 0 }); }
      e.pt = 0.18; bone(L + Math.random() * (R - L), BOX.y + 4, 0, 110 * sp, "b", 12);
      break;
    }
    case "letterRain": { e.pt = p2 ? 0.55 : 0.75; const off = Math.random() * 20; for (let x = L + off; x <= R; x += 24) dot(x, BOX.y + 6, 0, 80 * sp); break; }
    case "quiz": {
      if (!e.quiz) {
        const q = pick(QUIZ);
        e.quiz = { q: q[0], a: q[1], t: 4.5 }; e.patT = 5; ebul = []; SFX.select();
      }
      e.pt = 0.05;
      break;
    }
    case "boneStairs": { // かいだんじょうに ふってくる
      e.pt = 0.09;
      e.pa = (e.pa || 0) + 1;
      const n = 14, k = e.pa % (n * 2), idx = k < n ? k : n * 2 - k;
      bone(L + (R - L) * idx / n, BOX.y + 4, 0, 120 * sp);
      break;
    }
    case "hail": e.pt = p2 ? 0.45 : 0.6; ebul.push({ x: L + Math.random() * (R - L), y: BOX.y + 4, vx: 0, vy: 70 * sp, dmg: 4 + lp, c: "w", shape: "bubble", w: 7, h: 7, split: BOX.y + 120 + Math.random() * 60, sp, sd: 3 + lp }); break;
    case "crossBeams": e.pt = 1.1; beam(soul.x + 3.5, 10); beam(W - (soul.x + 3.5), 10); break;
    case "echo": { // すこし まえの あなたの いちに ふってくる
      e.pt = p2 ? 0.16 : 0.22;
      const x = e.hx && e.hx.length ? e.hx[0] : soul.x + 3.5;
      ebul.push({ x: x + (Math.random() - 0.5) * 6, y: BOX.y + 4, vx: 0, vy: 150 * sp, dmg: 5, c: "w", shape: "heart", w: 5, h: 4 });
      break;
    }
    case "heartRing": {
      e.pt = p2 ? 0.7 : 0.95; e.pa += 0.3;

function die() {
  setState("dying");
  vibrate([60, 40, 140]);
  mem.bestWave = Math.max(mem.bestWave || 0, wave); checkAch(); saveMem();
  ebul = []; shots = []; events = []; beams = [];
  soul.cracked = false; soul.shattered = false;
  if (score > hi) { hi = score; store.set("hi", hi); }
}

function updateDying() {
  if (stateT > 0.6 && !soul.cracked) { soul.cracked = true; SFX.crack(); }
  if (stateT > 1.6 && !soul.shattered) {
    soul.shattered = true; SFX.shatter();
    for (let i = 0; i < 6; i++) {
      parts.push({ x: soul.x + 3, y: soul.y + 2, vx: (Math.random() - 0.5) * 90, vy: -40 - Math.random() * 60, g: 160,
        life: 2.5, max: 2.5, delay: 0, color: i % 2 ? C.ember : "#ffd27a", s: 2, shard: true });
    }
    for (let i = 0; i < 10; i++) parts.push({ x: soul.x + 2 + Math.random() * 4, y: soul.y, vx: (Math.random() - 0.5) * 14, vy: -18 - Math.random() * 20,
      life: 1.6, max: 1.6, delay: Math.random() * 0.4, color: "#666", s: 1 });
  }
  if (stateT > 2.6) {
    // いちどだけ、くだけた ソウルが もとに もどる（ウェーブ3 から）
    if (!soul.revived && wave >= 3) {
      soul.revived = true;
      setState("revive");
      say("＊ …だめだ。\n＊ まだ たおれる わけには\n　 いかない！");
      return;
    }
    if (mode === "adv") { advDeath(); return; }
    mem.deaths++; checkAch(); saveMem();
    clearRun();
    setState("over");
    say(mem.deaths >= 5 ? "＊ …まだ やるの？\n＊ いいね。その ケツイ。"
      : pick(["＊ ひのこは はいの なかで\n　 まだ あたたかい。", "＊ たきびは いつでも\n　 あなたを まっている。"]));
  }
}
function reviveTap() {
  if (!msg.done) { msg.shown = msgLen(); msg.done = true; return; }
  if (!ui || !ui.reviving) {
    ui = { reviving: true };
    SFX.revive();
    soul.hp = Math.ceil(soul.maxHp / 2);
    say("＊ きえかけた ひが\n　 もういちど もえあがった！\n＊ HPが " + soul.hp + " もどった。");
    return;
  }
  ui = null; soul.cracked = false; soul.shattered = false; soul.inv = 2.5; parts = [];
  if (form) form.oy = Math.max(BOX0.y + 14, form.oy - 48); // たいれつを すこし おしもどす
  setState("play"); saveRun();
}

  if (mode === "adv") txt("ちほう " + adv.ch, W - 50, 10, 10, chapter().col, "right");
  else txt("WAVE " + wave, W - 50, 10, 10, C.white, "right");

  if (["menu", "shop", "chest", "savept", "map", "rest", "event", "boon", "chclear", "journal"].includes(state)) drawWin(BOX0.x, BOX0.y, BOX0.w, BOX0.h);
  else if (!["ending", "story", "aending"].includes(state)) drawFieldFrame(); // えいがの ような ばめんは わく なし

  if (state === "menu") drawMenu();
  else if (state === "shop") drawShop();
  else if (state === "chest") drawChest();
  else if (state === "ending") drawEnding();
  else if (state === "savept") drawSavePt();
  else if (state === "map") drawMap();
  else if (state === "rest") drawRest();
  else if (state === "event") drawEvent();
  else if (state === "boon") drawBoons();
  else if (state === "chclear") drawChClear();
  else if (state === "journal") drawJournal();
  else if (state === "story") drawStory();
  else if (state === "aending") drawAEnding();
  else drawField();

  drawStatus();
}

function drawField() {
  ctx.save();
  ctx.beginPath(); ctx.rect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4); ctx.clip();
  drawScenery();

  for (const ev of events) {
    const bob = Math.round(Math.sin(time * 3 + ev.bob) * 1);
    if (ev.kind === "shop") {
      spr(SPR.tent, ev.x, ev.y + bob);
      ctx.fillStyle = C.orange; ctx.fillRect(Math.round(ev.x) + 6, Math.round(ev.y) + bob - 3, 3, 2);
      txt("SHOP", ev.x + ev.w / 2, ev.y + ev.h + 1 + bob, 8, C.orange, "center");
    } else if (ev.kind === "save") {
      spr(Math.floor(time * 4) % 2 ? SPR.star : SPR.starW, ev.x, ev.y + bob);
    } else {
      spr(SPR.chest, ev.x, ev.y + bob);
      if (Math.floor(time * 4) % 2) { ctx.fillStyle = C.white; ctx.fillRect(Math.round(ev.x) + 11, Math.round(ev.y) + bob + 1, 1, 1); }
    }
  }

  const showEnemies = state !== "intro" || form.appear > 0;
  if (showEnemies) {
    for (const e of enemies) {
      const m = MON[e.type], set = SPR.mon[e.type], fr = frameOf(e);
      ctx.globalAlpha = state === "intro" ? form.appear : m.ghost ? 0.75 : 1;
      const img = e.flash > 0 ? set.red[fr] : (e.spare ? set.yellow[fr] : set.base[fr]);
      const ox = e.shakeT > 0 ? Math.round(Math.sin(e.shakeT * 60) * 2) : 0;
      const oy = form.peace > 0 && e.fm && !e.free ? Math.round(Math.sin(time * 6 + e.fx * 0.2) * 3) : 0; // おどり
      spr(img, e.x + ox, e.y + oy, m.scale || 1);
      if (e.elite && Math.floor(time * 4) % 2) { ctx.globalAlpha = 0.45; spr(set.red[fr], e.x + ox, e.y + oy, m.scale || 1); ctx.globalAlpha = state === "intro" ? form.appear : 1; }
      if (m.thief) txt(e.loot ? e.loot + "G" : "G", e.x + e.w / 2, e.y - 9, 8, C.gold, "center");
      if (hasChip("hpbar") && !m.boss && e.maxHp0 && e.hp < e.maxHp0) { ctx.fillStyle = C.hpRed; ctx.fillRect(Math.round(e.x), Math.round(e.y + e.h + 1), e.w, 1); ctx.fillStyle = C.green; ctx.fillRect(Math.round(e.x), Math.round(e.y + e.h + 1), Math.round(e.w * e.hp / e.maxHp0), 1); }
      if (e.chatT > 0 && state === "play") {
        ctx.font = `7px ${FONT}`;
        const tw = Math.ceil(ctx.measureText(e.chat).width) + 6, bx = Math.round(clamp(e.x + e.w / 2 - tw / 2, BOX.x + 3, BOX.x + BOX.w - tw - 3)), by = Math.round(e.y - 12);
        ctx.fillStyle = C.white; ctx.fillRect(bx, by, tw, 10);
        txt(e.chat, bx + 3, by + 1, 7, C.black);
      }
      if (e.shieldMax && !e.dying) { // シールド（たいかん）と よわてん
        const sx = Math.round(m.boss ? e.x + e.w / 2 - 44 : e.x + e.w / 2 - 6), sy = Math.round(m.boss ? e.y - 10 : e.y + e.h + 1);
        if (e.breakT > 0) txt("BREAK", sx, sy, 7, Math.floor(time * 8) % 2 ? C.yellow : C.white);
        else {
          ctx.fillStyle = "#666"; ctx.fillRect(sx, sy, 8, 8);
          txt(String(Math.ceil(e.shield)), sx + 4, sy, 7, C.white, "center");
          const wk = WEAK[e.type];
          if (wk) { ctx.fillStyle = ELEM[wk].c; ctx.fillRect(sx + 10, sy + 2, 4, 4); }
        }
      }
      if (m.boss && !e.dying) {
        // HPバー
        const bw = 60, bx = e.x + e.w / 2 - bw / 2, by = e.y - 7;
        ctx.fillStyle = C.hpRed; ctx.fillRect(bx, by, bw, 3);
        ctx.fillStyle = C.green; ctx.fillRect(bx, by, bw * Math.max(0, e.hp) / e.maxHp, 3);
      }
    }
    ctx.globalAlpha = 1;
  }

  // インクの しみ（しかいを ふさぐ）
  if (form.inks) for (const k of form.inks) {
    ctx.globalAlpha = Math.min(1, k.t) * 0.95; ctx.fillStyle = "#101";
    ctx.beginPath(); ctx.arc(k.x, k.y, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#326"; ctx.fillRect(Math.round(k.x - 10), Math.round(k.y - 2), 4, 2); ctx.fillRect(Math.round(k.x + 6), Math.round(k.y + 4), 3, 2);
    ctx.globalAlpha = 1;
  }
  // まっくら：ソウルの まわり だけ みえる
  if (form.dark && state !== "intro") {
    ctx.fillStyle = "rgba(0,0,0,0.97)";
    ctx.beginPath();
    ctx.rect(BOX.x, BOX.y, BOX.w, BOX.h);
    ctx.arc(soul.x + 3.5, soul.y + 3, (hasChip("lamp") ? 50 : 30) + Math.sin(time * 5) * 1.5, 0, Math.PI * 2, true);
    ctx.fill();
  }

  if (state === "intro") drawMsg(BOX.x + 10, BOX.y + BOX.h - 78, 12);
  if (form.glitch > 0) {
    for (let i = 0; i < 14; i++) {
      ctx.fillStyle = pick([C.red, C.blue, C.white, C.green, C.yellow]);
      ctx.globalAlpha = 0.6;
      ctx.fillRect(BOX.x + Math.random() * BOX.w, BOX.y + Math.random() * BOX.h, 4 + Math.random() * 60, 1 + Math.random() * 4);
    }
    ctx.globalAlpha = 1;
    txt(pick(["ERROR", "ＥＲＲ", "?????", "ケツイ"]), BOX.x + 20 + Math.random() * 120, BOX.y + 40 + Math.random() * 180, 12, C.red);
  }

  // ビーム
  for (const bm of beams) {
    if (!bm.fired) {
      if (Math.floor(bm.t * 12) % 2 === 0) {
        ctx.fillStyle = C.red;
        for (let y = BOX.y + 4; y < BOX.y + BOX.h - 4; y += 6) { ctx.fillRect(Math.round(bm.x - bm.w / 2), y, 1, 3); ctx.fillRect(Math.round(bm.x + bm.w / 2), y, 1, 3); }
      }
    } else {
      const a = 1 - (bm.t - bm.warn) / bm.dur;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = C.white;
      ctx.fillRect(Math.round(bm.x - bm.w / 2), BOX.y + 2, bm.w, BOX.h - 4);
      ctx.globalAlpha = 1;
    }
  }

  for (const s of shots) {
    if (s.big) { ctx.fillStyle = Math.floor(time * 20) % 2 ? C.white : C.yellow; ctx.fillRect(Math.round(s.x) - 2, Math.round(s.y), 5, 12); continue; }
    if (s.pal) { ctx.fillStyle = ELEM[s.el].c; ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y), 2, 4); continue; }
    if (s.ally) { ctx.fillStyle = C.white; ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 10); ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y), 3, 2); ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) + 8, 3, 2); }
    else { ctx.fillStyle = C.yellow; ctx.fillRect(Math.round(s.x) - 0.5, Math.round(s.y), 1, 5); }
  }
  if (form.wind && (state === "play" || state === "intro")) {
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    for (let i = 0; i < 10; i++) {
      const y = BOX.y + 10 + ((i * 97) % (BOX.h - 20));
      const x = BOX.x + (((i * 53 + time * form.wind * 4) % BOX.w) + BOX.w) % BOX.w;
      ctx.fillRect(Math.round(x), y, 8, 1);
    }
  }
  if (soul.slowT > 0 && state === "play") { ctx.fillStyle = "rgba(40,80,255,0.08)"; ctx.fillRect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4); txt("ゆっくり " + Math.ceil(soul.slowT), BOX.x + BOX.w - 6, BOX.y + BOX.h - 14, 8, C.blue, "right"); }
  if (soul.mirrorShield && state === "play") { ctx.fillStyle = C.yellow; ctx.globalAlpha = 0.5 + Math.sin(time * 6) * 0.3; rectLine(Math.round(soul.x) - 3, Math.round(soul.y) - 3, 13, 12, C.yellow, 1); ctx.globalAlpha = 1; }
  for (const b of ebul) drawBullet(b);
  for (const it of items) spr(it.kind === "coin" ? SPR.coin : SPR.candy, it.x, it.y);

  drawSoul();
  drawPal();
  if (soul.frozenT > 0 && state === "play") { ctx.fillStyle = C.blue; for (const [dx, dy] of [[-3, -2], [10, -2], [3, -5], [3, 9]]) ctx.fillRect(Math.round(soul.x + dx), Math.round(soul.y + dy), 1, 1); }
  // みらいし（Xenoblade 風）：つぎの かべの すきまが さきに みえる
  for (const e of enemies) if ((e.pat === "gapWall" || e.pat === "iceWall") && e.nextGap != null && e.pt < 0.7 && state === "play" && !e.spare) {
    ctx.globalAlpha = 0.5 + Math.sin(time * 20) * 0.3;
    txt("▼", e.nextGap, BOX.y + 6, 9, C.yellow, "center");
    ctx.globalAlpha = 1;
  }
  // ○× クイズ
  const qz = enemies.find(e => e.quiz);
  if (qz && state === "play") {
    const q = qz.quiz, side = soul.x + 3.5 < W / 2 ? "o" : "x";
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(BOX.x + 6, BOX.y + 96, BOX.w - 12, 44);
    rectLine(BOX.x + 6, BOX.y + 96, BOX.w - 12, 44, C.white, 1);
    q.q.split("\n").forEach((l, i) => txt(l, W / 2, BOX.y + 102 + i * 14, 10, C.white, "center"));
    ctx.fillStyle = C.yellow; ctx.fillRect(BOX.x + 8, BOX.y + 136, Math.round((BOX.w - 16) * Math.max(0, q.t) / 4.5), 2);
    txt("○", BOX.x + BOX.w * 0.25, BOX.y + BOX.h - 70, 28, side === "o" ? C.yellow : C.dim, "center");
    txt("×", BOX.x + BOX.w * 0.75, BOX.y + BOX.h - 70, 28, side === "x" ? C.yellow : C.dim, "center");
    ctx.fillStyle = "#444"; ctx.fillRect(W / 2, BOX.y + 150, 1, BOX.h - 156);
  }
  if (hasChip("charge") && soul.chargeT > 0.2 && state === "play") {
    const r = 4 + soul.chargeT * 6; ctx.globalAlpha = 0.6; rectLine(Math.round(soul.x + 3.5 - r), Math.round(soul.y + 3 - r), Math.round(r * 2), Math.round(r * 2), soul.chargeT >= 1.5 ? C.yellow : C.white, 1); ctx.globalAlpha = 1;
  }

  for (const p of parts) {
    if (p.delay > 0) { ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); continue; }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / (p.shard ? 0.6 : p.max)));
    ctx.fillStyle = p.color;
    if (p.shard) { const x = Math.round(p.x), y = Math.round(p.y); ctx.fillRect(x, y, 2, 1); ctx.fillRect(x + 1, y + 1, 1, 2); }
    else ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  for (const p of pops) {
    if (p.t < 0) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
    txt(p.text, p.x, p.y, p.big ? 14 : 10, p.color, "center");
  }
  ctx.globalAlpha = 1;

  if (state === "talk") drawBubble();
  if (state === "revive") drawRevive();
  drawDying();
}

function drawBullet(b) {
  const col = b.c === "b" ? C.blue : b.c === "o" ? C.bOrange : C.white;
  ctx.fillStyle = col;
  const x = Math.round(b.x), y = Math.round(b.y);
  switch (b.shape) {
    case "bone": {
      const hh = Math.floor(b.h / 2);
      ctx.fillRect(x, y - hh, 1, b.h);
      ctx.fillRect(x - 1, y - hh, 3, 2); ctx.fillRect(x - 1, y + hh - 2, 3, 2);
      break;
    }
    case "bubble":
      ctx.fillRect(x - 2, y - 3, 5, 1); ctx.fillRect(x - 2, y + 3, 5, 1); ctx.fillRect(x - 3, y - 2, 1, 5); ctx.fillRect(x + 3, y - 2, 1, 5);
      break;
    case "drop": ctx.fillRect(x, y - 2, 1, 4); break;
    case "tooth": ctx.fillRect(x - 1, y - 2, 3, 2); ctx.fillRect(x, y, 1, 2); break;
    case "heart": ctx.fillRect(x - 2, y - 2, 2, 1); ctx.fillRect(x + 1, y - 2, 2, 1); ctx.fillRect(x - 2, y - 1, 5, 1); ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y + 1, 1, 1); break;
    case "coin": spr(SPR.coin, x - 2, y - 2); break;
    case "ink": ctx.fillStyle = "#86c"; ctx.fillRect(x - 3, y - 2, 6, 4); ctx.fillRect(x - 2, y - 3, 4, 6); break;
    case "candy": spr(SPR.candy, x - 3, y - 1); break;
    default: ctx.fillRect(x - 1, y - 1, 3, 3);
  }
}

function drawSoul() {
  if (!soul) return;
  if (state === "dying" || state === "revive") {
    if (state === "revive" && ui && ui.reviving) { spr(emberSpr(), soul.x, soul.y); return; }
    if (soul.shattered && state === "dying") return;
    spr(soul.cracked || state === "revive" ? SPR.emberD : emberSpr(), soul.x, soul.y);
    return;
  }
  if (soul.starT > 0 && state === "play") { // ほしのかけら：ひかる
    ctx.fillStyle = Math.floor(time * 10) % 2 ? C.yellow : C.white;
    ctx.fillRect(Math.round(soul.x) - 2, Math.round(soul.y) + 2, 1, 1); ctx.fillRect(Math.round(soul.x) + 9, Math.round(soul.y) + 2, 1, 1);
    ctx.fillRect(Math.round(soul.x) + 3, Math.round(soul.y) - 3, 1, 1);
    spr(emberSpr(), soul.x, soul.y); return;
  }
  if (soul.inv > 0 && Math.floor(soul.inv * 12) % 2 === 0) return; // 無敵中は点滅
  const low = soul.hp <= soul.maxHp * 0.25 && state === "play";
  spr(low && Math.floor(time * 4) % 2 ? SPR.emberW : emberSpr(), soul.x, soul.y);
  if (soul.invert) txt("⇄", soul.x + 3.5, soul.y + 7, 8, C.yellow, "center");
}

function drawDying() {
  if (state === "dying" && soul && soul.shattered) drawDiedBanner(Math.min(1, (stateT - 1.6) / 0.6), BOX.y + BOX.h / 2 - 30);
}
function drawRevive() {
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(BOX.x + 2, BOX.y + 2, BOX.w - 4, BOX.h - 4);
  drawSoul();
  drawMsg(BOX.x + 10, BOX.y + 90, 12);

}

// ボスの ふきだし
function drawBubble() {
  const e = enemies.find(x => x.id === (ui && ui.who));
  if (!e) return;
  // ボスの したに だす（しっぽは うえむき）
  const bw = 124, lines = msg.lines.length, bh = 12 + lines * 15;
  const ecx = e.x + e.w / 2;
  const bx = Math.round(clamp(ecx - bw / 2, BOX.x + 6, BOX.x + BOX.w - bw - 6));
  const by = Math.round(e.y + e.h + 10);
  ctx.fillStyle = C.white; for (let i = 0; i < 7; i++) ctx.fillRect(Math.round(ecx) - (6 - i), by - 7 + i, (6 - i) * 2 + 1, 1);
  drawWin(bx, by, bw, bh);
  drawMsg(bx + 7, by + 6, 10, C.white, 5);
  if (msg.done && Math.floor(time * 3) % 2) { ctx.fillStyle = C.white; ctx.fillRect(bx + bw - 10, by + bh - 7, 5, 1); ctx.fillRect(bx + bw - 9, by + bh - 6, 3, 1); ctx.fillRect(bx + bw - 8, by + bh - 5, 1, 1); }
}

// えらべる行を描く（カーソルは ▶）
function drawRows(rows) {
  let ai = 0;
  for (const r of rows) {
    if (!r.act) { txt(r.label, r.x, r.y, 10, C.gray); continue; }
    const sel = ai++ === ui.cursor;
    if (r.tab) {
      const col = r.on ? C.yellow : C.gray;
      rectLine(r.x, r.y - 2, r.w, r.h + 2, col, 1);
      txt(r.label, r.x + r.w / 2, r.y + 1, 10, col, "center");
      if (sel) cursorAt(r.x + 4, r.y + 3);
      continue;
    }
    const col = r.dim ? C.dim : sel ? C.yellow : C.white;
    if (sel) cursorAt(r.x + 1, r.y + 4);
    txt(r.label, r.x + 12, r.y + 2, 11, col);
    if (r.right) txt(r.right, r.x + r.w, r.y + 2, 10, r.dim ? C.dim : C.gray, "right");
  }
}

function drawMsgArea() {
  const y = BOX0.y + BOX0.h - 62;

let hpLag = 0;
function drawStatus() {
  const y = BOX0.y + BOX0.h + 8;
  // LV は ななめの おび（Persona 風）
  slant(8, y - 1, 40, 14, C.pRed, 5);
  txt("LV" + soul.lv, 29, y + 1, 10, C.white, "center");
  // HP は ほそい あかい バー＋しろい のこりかげ（Dark Souls 風）
  const bx = 54, bw = 112, low = soul.hp <= soul.maxHp * 0.25;
  hpLag = hpLag > soul.hp ? Math.max(soul.hp, hpLag - soul.maxHp * 0.012) : soul.hp;
  ctx.fillStyle = "#3a3a3a"; ctx.fillRect(bx - 1, y, bw + 2, 7);
  ctx.fillStyle = "#1a0505"; ctx.fillRect(bx, y + 1, bw, 5);
  ctx.fillStyle = "#e8e0d0"; ctx.fillRect(bx, y + 1, Math.round(bw * hpLag / soul.maxHp), 5);
  ctx.fillStyle = low && Math.floor(time * 4) % 2 ? "#ff4a3a" : "#b3121b"; ctx.fillRect(bx, y + 1, Math.round(bw * soul.hp / soul.maxHp), 5);
  ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.fillRect(bx, y + 1, Math.round(bw * soul.hp / soul.maxHp), 1);
  // ケツイ（かすると たまる）は その した に ほそく
  ctx.fillStyle = "#222"; ctx.fillRect(bx, y + 9, bw, 2);
  if (soul.tp > 0) { ctx.fillStyle = soul.tp >= 100 ? (Math.floor(time * 6) % 2 ? C.gold : C.white) : "#c9a227"; ctx.fillRect(bx, y + 9, Math.round(bw * soul.tp / 100), 2); }
  txt(soul.hp + "/" + soul.maxHp, W - 10, y - 1, 10, low ? C.red : C.white, "right");

  if (form && form.hudGone && !enemies.some(e => e.offered || e.dying) && (state === "play" || state === "talk")) { txt("？？？", W / 2, CMD_Y + 6, 10, C.dim, "center"); return; } // コマンドが ない…
  const usable = state === "play" || state === "menu" || state === "map";
  const canSpare = usable && spareables().length > 0;
  const active = state === "menu" ? (ui.tab === "item" ? 1 : 2) : state === "map" ? -1 : 0;
  const blink = Math.floor(time * 3) % 2 === 0;
  // コマンドは ななめの カード（Persona 風）。えらんでいる ものは あか、つかえない ものは くらく
  CMD.forEach((lbl, i) => {
    let l = lbl;
    const x = CMD_X0 + i * (CMD_W + CMD_GAP);
    let on = i === active && usable, fill = !usable ? "#262626" : "#ececec", ink = !usable ? "#5a5a5a" : "#111";
    if (i === 3) { fill = canSpare ? (blink ? C.gold : "#ececec") : "#262626"; ink = canSpare ? "#111" : "#5a5a5a"; on = false; }
    if (i === 0 && state === "map") { l = "てちょう"; fill = "#ececec"; ink = "#111"; on = false; }
    if (i === 0 && soul.hold && state === "play") { fill = blink ? C.gold : "#ececec"; ink = "#111"; on = false; }
    const full = i === 0 && soul.tp >= 100 && !soul.hold && state === "play";
    if (full) { l = "ケツイ！"; on = true; }
    const lift = on ? 2 : 0;
    if (on) { slant(x + 1, CMD_Y + 2, CMD_W, CMD_H, "#000", 6); slant(x - 1, CMD_Y - lift - 1, CMD_W + 2, CMD_H + 2, C.white, 6); fill = full && blink ? C.gold : C.pRed; ink = full && blink ? "#111" : C.white; }
    slant(x, CMD_Y - lift, CMD_W, CMD_H, fill, 6);
    txt(l, x + CMD_W / 2, CMD_Y + 7 - lift, 9, ink, "center");
  });
}

function drawMsg(x, y, size, color = C.white, gap = 6) {
  let left = msg.shown;
  msg.lines.forEach((line, i) => {
    const s = line.slice(0, Math.max(0, left));
    left -= line.length;
    txt(s, x, y + i * (size + gap), size, color);
  });
}

function drawOver() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.6));
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 1); ctx.fillRect(Math.round(p.x) + 1, Math.round(p.y) + 1, 1, 2);
  }
  drawDiedBanner(Math.min(1, stateT / 1.2), 104);
  if (stateT > 1.2) { updateMsg(1 / 60); drawMsg(30, 210, 12); }
  if (stateT > 2.0) {
    txt("SCORE " + String(score).padStart(6, "0"), W / 2, 270, 10, C.white, "center");
    txt("HI    " + String(hi).padStart(6, "0"), W / 2, 286, 10, C.gray, "center");
    txt("WAVE " + wave + "  /  LV " + soul.lv + "  /  " + soul.gold + "G", W / 2, 302, 10, C.gray, "center");
    if (soul.spares || soul.bossKills) txt("みのがした " + soul.spares + "  /  たおした ボス " + soul.bossKills, W / 2, 318, 9, C.dim, "center");
  }
  if (stateT > 3.2 && Math.floor(time * 2) % 2 === 0) txt("[ タップで タイトルへ ]", W / 2, 346, 12, C.yellow, "center");
}

// ---------------- ループ ----------------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
// ホーム画面に おいたとき オフラインでも あそべるように
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
(document.fonts && document.fonts.load ? document.fonts.load(`12px "DotGothic16"`).catch(() => {}) : Promise.resolve())
  .finally(() => requestAnimationFrame(t => { last = t; loop(t); }));
</script>
